<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HCOS 1.0.1 Computer</title>
    <style>
        /* ===== 全局样式 ===== */
        :root {
            --primary: #7eb4f2;
            --primary-hover: #6ba3e8;
            --text: #1e2a3a;
            --text-secondary: #4a5c6d;
            --bg: linear-gradient(145deg, #c2d7f0, #b0c8e5);
            --taskbar-bg: rgba(255,255,255,0.85);
            --menu-bg: rgba(255,255,255,0.30);
            --window-bg: rgba(255,255,255,0.88);
            --toast-bg: rgba(30,30,40,0.9);
            --border: rgba(255,255,255,0.9);
            --editor-bg: rgba(255,255,255,0.6);
            --widget-bg: rgba(255,255,255,0.12);
            --welcome-card-bg: rgba(255,255,255,0.70);
            --welcome-text: #1e2a3a;
            --welcome-sub: #4a5c6d;
            --shadow: 0 8px 32px rgba(0,0,0,0.15);
            --radius: 14px;
            --font-size-base: 14px;
            --window-opacity: 0.75;
        }
        .dark-theme {
            --primary: #5a8fd4;
            --primary-hover: #4a7fc4;
            --text: #e8e8e8;
            --text-secondary: #aab;
            --bg: linear-gradient(145deg, #1a1a2e, #16213e);
            --taskbar-bg: rgba(30,30,50,0.85);
            --menu-bg: rgba(30,30,50,0.40);
            --window-bg: rgba(40,40,60,0.88);
            --toast-bg: rgba(20,20,30,0.9);
            --border: rgba(255,255,255,0.15);
            --editor-bg: rgba(255,255,255,0.05);
            --widget-bg: rgba(255,255,255,0.08);
            --welcome-card-bg: rgba(40,40,60,0.70);
            --welcome-text: #e8e8e8;
            --welcome-sub: #aab;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:100vw; height:100vh; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; background:#0a0a0f; font-size:var(--font-size-base); user-select:none; }

        /* ===== 动画 ===== */
        @keyframes windowOpen { 0%{transform:scale(.85);opacity:0} 100%{transform:scale(1);opacity:1} }
        @keyframes windowClose { 0%{transform:scale(1);opacity:1} 100%{transform:scale(.85);opacity:0} }
        @keyframes minimizeToTaskbar { 0%{transform:scale(1) translateY(0);opacity:1} 100%{transform:scale(.2) translateY(80px);opacity:0} }
        @keyframes floatLight { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(40px,-30px) scale(1.2)} }
        @keyframes floatParticle { 0%{opacity:0;transform:translateY(0) scale(.5)} 20%{opacity:.8} 100%{opacity:0;transform:translateY(-120px) scale(1.2)} }
        @keyframes dotPulse { 0%{box-shadow:0 0 0 0 rgba(126,180,242,.7)} 70%{box-shadow:0 0 0 8px rgba(126,180,242,0)} 100%{box-shadow:0 0 0 0 rgba(126,180,242,0)} }
        @keyframes checkPop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }

        .window.active { animation:windowOpen .3s cubic-bezier(.34,1.56,.64,1); }
        .window.closing { animation:windowClose .15s ease-in; }
        .window.minimizing { animation:minimizeToTaskbar .3s ease; }

        .lock-screen { transition:opacity .4s ease; }
        .lock-screen.active { opacity:1; pointer-events:auto; }
        .lock-screen:not(.active) { opacity:0; pointer-events:none; }

        .toast { transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.56,.64,1); transform:translateX(60px); }
        .toast.show { transform:translateX(0); }

        #taskViewOverlay { transition:opacity .3s ease; }
        #taskViewOverlay:not(.active) { opacity:0; pointer-events:none; }
        #taskViewOverlay.active { opacity:1; }
        .task-view-item { transition:all .4s cubic-bezier(.34,1.56,.64,1); }

        /* ===== 启动画面 ===== */
        .boot-screen {
            position:fixed; inset:0; z-index:300;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:radial-gradient(ellipse at center,#0b0d1a 0%,#030308 100%);
            transition:opacity .8s ease;
        }
        .boot-screen.fade-out { opacity:0; pointer-events:none; }
        .boot-bg-lights { position:absolute; inset:0; overflow:hidden; }
        .boot-bg-light { position:absolute; border-radius:50%; filter:blur(100px); opacity:.2; animation:floatLight 8s infinite alternate ease-in-out; }
        .boot-bg-light:nth-child(1) { width:500px; height:500px; background:#4a6cf7; top:-200px; left:-150px; animation-duration:10s; }
        .boot-bg-light:nth-child(2) { width:450px; height:450px; background:#7b4fff; bottom:-180px; right:-120px; animation-duration:12s; animation-delay:-3s; }
        .boot-bg-light:nth-child(3) { width:350px; height:350px; background:#3b82f6; top:50%; left:50%; transform:translate(-50%,-50%); animation-duration:15s; animation-delay:-6s; opacity:.15; }
        .particles { position:absolute; inset:0; pointer-events:none; z-index:5; }
        .particle { position:absolute; width:4px; height:4px; border-radius:50%; opacity:0; animation:floatParticle 4s infinite ease-in; }
        .particle.colored { width:6px; height:6px; }
        .logo-container { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; opacity:0; transform:scale(.9); transition:opacity .6s ease,transform .6s ease; }
        .logo-container.visible { opacity:1; transform:scale(1); }
        .logo-glass { padding:28px 56px; background:rgba(255,255,255,.03); backdrop-filter:blur(25px); border:1px solid rgba(255,255,255,.08); border-radius:36px; box-shadow:0 15px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1); display:flex; align-items:baseline; gap:6px; }
        .logo-hc { font-size:70px; font-weight:600; color:#fff; text-shadow:0 0 25px rgba(255,255,255,.7); }
        .logo-os { font-size:70px; font-weight:600; color:#7CB9FF; text-shadow:0 0 30px rgba(126,180,242,.8); }
        .powered-by { margin-top:20px; font-size:16px; color:rgba(255,255,255,.6); background:rgba(255,255,255,.03); backdrop-filter:blur(12px); padding:8px 28px; border-radius:24px; border:1px solid rgba(255,255,255,.05); }
        .progress-wrapper { margin-top:50px; width:220px; height:5px; background:rgba(255,255,255,.08); border-radius:5px; overflow:hidden; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.12); opacity:0; transition:opacity .5s; }
        .progress-wrapper.active { opacity:1; }
        .progress-fill { height:100%; width:0%; background:linear-gradient(90deg, rgba(124,185,255,.9), rgba(165,140,255,.95)); border-radius:5px; box-shadow:0 0 15px rgba(124,185,255,.7); transition:width .3s ease; }
        .boot-version { position:absolute; bottom:24px; right:32px; color:rgba(255,255,255,.3); font-size:11px; z-index:15; letter-spacing:.5px; user-select:none; pointer-events:none; }

        /* ===== 锁屏 ===== */
        .lock-screen {
            position:fixed; inset:0; z-index:600;
            display:flex; align-items:center; justify-content:center;
            background-size:cover; background-position:center;
            opacity:0; pointer-events:none; transition:opacity .4s ease;
        }
        .lock-screen.active { opacity:1; pointer-events:auto; }
        .lock-screen::before { content:''; position:absolute; inset:0; backdrop-filter:blur(25px) brightness(.5); z-index:0; }
        .lock-card {
            position:relative; z-index:1;
            background:rgba(255,255,255,.08); backdrop-filter:blur(40px);
            border-radius:28px; border:1px solid rgba(255,255,255,.15);
            box-shadow:0 30px 50px rgba(0,0,0,.4), inset 0 0 20px rgba(255,255,255,.05);
            padding:50px 60px; text-align:center; color:#fff; width:400px; max-width:90vw;
        }
        .lock-greeting { font-size:22px; margin-bottom:5px; }
        .lock-avatar { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--primary),#a08bc9); margin:0 auto 25px; display:flex; align-items:center; justify-content:center; font-size:36px; box-shadow:0 10px 25px rgba(0,0,0,.3); }
        .lock-time { font-size:64px; font-weight:300; letter-spacing:6px; text-shadow:0 0 20px rgba(255,255,255,.5); margin-bottom:10px; }
        .lock-date { font-size:16px; opacity:.8; margin-bottom:5px; }
        .lock-notif-count { font-size:14px; opacity:.7; margin-bottom:20px; }
        .lock-input-group { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:25px; }
        .lock-input-group input { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:12px 22px; font-size:18px; color:#fff; outline:none; text-align:center; width:200px; transition:.2s; }
        .lock-input-group input:focus { border-color:var(--primary); background:rgba(255,255,255,.2); }
        .lock-input-group button { background:var(--primary); border:none; color:#fff; border-radius:14px; padding:12px 24px; font-size:18px; cursor:pointer; transition:.2s; box-shadow:0 8px 16px rgba(0,0,0,.3); }
        .lock-input-group button:hover { background:var(--primary-hover); transform:scale(1.02); }
        .lock-error { color:#ff7c7c; font-size:14px; margin-top:10px; min-height:20px; }

        /* ===== 欢迎向导 ===== */
        .welcome-screen {
            position:fixed; inset:0; z-index:250;
            display:none; flex-direction:column; align-items:center; justify-content:center;
            transition:opacity .5s ease; background-size:cover; background-position:center;
        }
        .welcome-screen.active { display:flex; }
        .welcome-screen.fade-out { opacity:0; pointer-events:none; }
        .skip-all { position:absolute; top:24px; right:30px; color:var(--welcome-text); font-size:14px; cursor:pointer; background:var(--welcome-card-bg); backdrop-filter:blur(12px); padding:8px 18px; border-radius:20px; border:1px solid rgba(255,255,255,.7); z-index:30; transition:all .25s; box-shadow:0 2px 6px rgba(0,0,0,.05); }
        .skip-all:hover { background:rgba(255,255,255,.75); color:var(--welcome-text); }
        .welcome-card {
            background:var(--welcome-card-bg); backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,.6); border-radius:32px;
            box-shadow:0 20px 40px rgba(44,62,80,.08), 0 8px 16px rgba(44,62,80,.06), inset 0 1px 0 rgba(255,255,255,.9);
            padding:44px 52px; width:580px; max-width:92vw; text-align:center;
            transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
            margin-top:60px; position:relative; z-index:5;
            color:var(--welcome-text); max-height:85vh; overflow-y:auto;
        }
        .step-content { transition: opacity .3s ease; }
        .step-title { font-size:30px; font-weight:700; color:var(--welcome-text); margin-bottom:10px; }
        .step-subtitle { font-size:16px; color:var(--welcome-sub); margin-bottom:30px; }
        .btn-group { display:flex; justify-content:center; gap:16px; margin-top:30px; }
        .btn { padding:12px 28px; border-radius:16px; font-size:15px; font-weight:600; border:none; cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1); }
        .btn:active { transform:scale(.96); }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 8px 20px rgba(126,180,242,.35); }
        .btn-primary:hover { background:var(--primary-hover); transform:translateY(-1px); }
        .btn-glass { background:rgba(255,255,255,.55); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.8); color:var(--welcome-text); }
        .btn-glass:hover { background:rgba(255,255,255,.75); }
        .step-dots { display:flex; gap:14px; margin-top:28px; justify-content:center; align-items:center; }
        .dot { width:10px; height:10px; border-radius:50%; background:rgba(44,62,80,.25); transition:all .3s; }
        .dot.active { background:var(--primary); transform:scale(1.4); box-shadow:0 0 0 0 rgba(126,180,242,.7); animation:dotPulse 1.8s infinite; }
        .dot-line { width:20px; height:1px; background:rgba(44,62,80,.15); }
        .language-options { display:flex; justify-content:center; gap:15px; margin:25px 0 15px; flex-wrap:wrap; }
        .lang-card { background:rgba(255,255,255,.5); backdrop-filter:blur(12px); border:2px solid transparent; border-radius:18px; padding:18px 24px; cursor:pointer; font-weight:600; color:var(--welcome-text); transition:.2s; }
        .lang-card:hover { background:rgba(255,255,255,.75); transform:translateY(-2px); }
        .lang-card.selected { border-color:var(--primary); background:rgba(255,255,255,.85); box-shadow:0 0 0 4px rgba(126,180,242,.2); }
        .wallpaper-options { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin:20px 0; }
        .wallpaper-thumb { width:62px; height:62px; border-radius:18px; cursor:pointer; border:2px solid transparent; transition:.25s; overflow:hidden; background-size:cover; background-position:center; }
        .wallpaper-thumb:hover { transform:translateY(-3px); }
        .wallpaper-thumb.selected { border-color:#fff; transform:scale(1.08); }
        .color-options { display:flex; justify-content:center; gap:16px; margin:20px 0; }
        .color-dot { width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; position:relative; }
        .color-dot:hover { transform:scale(1.1); }
        .color-dot.selected { border-color:#fff; transform:scale(1.15); }
        .color-dot.selected::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:10px; height:10px; background:#fff; border-radius:50%; }
        .avatar-wrapper { width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,.6); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; margin:20px auto; cursor:pointer; transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
        .nickname-input { background:rgba(255,255,255,.55); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.7); border-radius:16px; padding:12px 18px; font-size:16px; width:240px; text-align:center; outline:none; color:var(--welcome-text); margin:15px 0; }
        .check-icon { width:72px; height:72px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; color:#fff; font-size:38px; box-shadow:0 12px 28px rgba(126,180,242,.45); animation:checkPop .5s cubic-bezier(.34,1.56,.64,1); }
        .privacy-scroll { height:140px; overflow-y:auto; background:rgba(255,255,255,.35); border-radius:12px; padding:15px; margin-bottom:20px; font-size:13px; text-align:left; color:var(--welcome-text); border:1px solid rgba(255,255,255,.3); line-height:1.7; }
        .privacy-scroll::-webkit-scrollbar { width:4px; }
        .privacy-scroll::-webkit-scrollbar-thumb { background:var(--primary); border-radius:4px; }

        /* ===== 桌面 ===== */
        .desktop {
            position:fixed; inset:0; z-index:100;
            background:var(--bg);
            display:none; flex-direction:column;
            opacity:0; transition: opacity .3s ease;
        }
        .desktop.active { display:flex; opacity:1; }
        .desktop .desktop-icons { top:46px; height:calc(100% - 46px); }
        .desktop .start-menu { top:48px; bottom:auto; }
        .taskbar { border-bottom:none; border-top:none; }

        .desktop-icons {
            position:absolute; left:0; top:0; width:100%; height:100%;
            padding:0 12px 6px 12px; overflow:hidden; box-sizing:border-box;
        }
        .desktop-icon {
            position:absolute; width:54px; height:64px;
            background:rgba(255,255,255,.20); backdrop-filter:blur(16px);
            border-radius:12px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            border:1px solid rgba(255,255,255,.4); box-shadow:0 4px 10px rgba(0,0,0,.06);
            cursor:grab; transition:transform .2s, box-shadow .2s, background .2s;
            user-select:none; padding:3px 2px; z-index:10;
            will-change:transform, left, top;
        }
        .desktop-icon:active { cursor:grabbing; }
        .desktop-icon .icon-img { font-size:22px; line-height:1; }
        .desktop-icon span { font-size:9px; color:var(--text); margin-top:2px; font-weight:500; text-align:center; line-height:1.2; max-width:50px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .desktop-icon:hover { transform:translateY(-2px) scale(1.05); background:rgba(255,255,255,.35); box-shadow:0 8px 18px rgba(0,0,0,.12); }
        .desktop-icon.dragging { opacity:.6; transform:scale(.9); z-index:100; }
        .desktop-icon.drag-over { border-color:var(--primary); background:rgba(126,180,242,.25); transform:scale(1.06); }

        #widgetContainer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:101; }
        .widget {
            position:absolute;
            background:var(--widget-bg); backdrop-filter:blur(20px);
            border-radius:var(--radius); border:1px solid rgba(255,255,255,0.2);
            padding:10px 12px; pointer-events:auto; box-shadow:var(--shadow);
            transition:box-shadow .2s; min-width:120px; min-height:70px; overflow:hidden;
        }
        .widget:hover { box-shadow:0 8px 24px rgba(0,0,0,.18); }
        .widget .widget-header {
            display:flex; justify-content:space-between; align-items:center;
            font-size:11px; color:var(--text-secondary); margin-bottom:3px; cursor:move;
        }
        .widget .widget-header .widget-close { cursor:pointer; opacity:.5; font-size:13px; }
        .widget .widget-header .widget-close:hover { opacity:1; }
        .widget .widget-resize-handle {
            position:absolute; right:0; bottom:0; width:12px; height:12px;
            cursor:nwse-resize;
            background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,.08) 50%);
            border-radius:0 0 var(--radius) 0;
        }
        .widget-content { font-size:13px; color:var(--text); }

        .taskbar {
            height:46px; background:var(--taskbar-bg); backdrop-filter:blur(28px);
            display:flex; align-items:center; padding:0 10px;
            color:var(--text); font-size:13px; box-shadow:0 0 15px rgba(0,0,0,.05);
            z-index:200; flex-shrink:0; position:relative;
        }
        .start-btn {
            background:rgba(91,155,213,.25); border-radius:10px; padding:3px 12px;
            margin-right:10px; font-weight:700; color:#5b9bd5; border:none;
            cursor:pointer; display:flex; align-items:center; gap:4px; font-size:16px;
            text-shadow:0 0 10px rgba(91,155,213,.6);
            box-shadow:inset 0 0 8px rgba(91,155,213,.2);
            transition:background .2s,box-shadow .2s; flex-shrink:0;
        }
        .start-btn:hover { background:rgba(91,155,213,.4); box-shadow:inset 0 0 15px rgba(91,155,213,.5),0 0 12px rgba(91,155,213,.6); }
        .taskbar-apps {
            display:flex; gap:3px; flex:1;
            overflow-x:auto; overflow-y:hidden; white-space:nowrap;
            scrollbar-width:none; -ms-overflow-style:none;
            padding:2px 0; justify-content:center;
        }
        .taskbar-apps::-webkit-scrollbar { display:none; }
        .taskbar-app {
            display:flex; align-items:center; gap:4px; padding:2px 8px;
            background:rgba(255,255,255,.4); border-radius:6px;
            border:1px solid rgba(255,255,255,.5); cursor:pointer;
            font-size:11px; color:var(--text); transition:.2s ease;
            max-width:130px; flex-shrink:1; min-width:0; height:28px; position:relative;
        }
        .taskbar-app .icon-img { font-size:13px; flex-shrink:0; }
        .taskbar-app span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .taskbar-app:hover { transform:scale(1.04); background:rgba(255,255,255,.7); }
        .taskbar-app.active { background:rgba(126,180,242,.4); border-color:var(--primary); }
        .taskbar-app .running-indicator {
            position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
            width:5px; height:5px; border-radius:50%; background:var(--primary);
            opacity:0; transition:opacity .2s;
        }
        .taskbar-app.active .running-indicator { opacity:1; }
        .taskbar-right {
            margin-left:auto; display:flex; align-items:center; gap:10px;
            color:var(--text-secondary); flex-shrink:0; font-size:13px;
        }
        .tray-icon { cursor:pointer; padding:3px 5px; border-radius:5px; transition:background .2s; font-size:14px; }
        .tray-icon:hover { background:rgba(255,255,255,.3); }
        .taskbar-slider { display:flex; align-items:center; gap:4px; }
        .taskbar-slider input[type="range"] { width:60px; height:3px; -webkit-appearance:none; background:var(--text-secondary); border-radius:2px; outline:none; }
        .taskbar-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--primary); cursor:pointer; }
        .taskbar-slider span { font-size:11px; }

        .start-menu {
            position:absolute; left:10px; width:380px; max-height:70vh;
            overflow-y:auto; background:var(--menu-bg); backdrop-filter:blur(40px);
            border-radius:20px; border:1px solid rgba(255,255,255,.4);
            box-shadow:0 20px 40px rgba(0,0,0,.15); padding:10px;
            z-index:300; opacity:0; transform:scale(.95); pointer-events:none;
            transition:opacity .25s cubic-bezier(.34,1.56,.64,1), transform .25s cubic-bezier(.34,1.56,.64,1);
            display:flex; flex-direction:column; gap:3px;
        }
        .start-menu { top:48px; transform-origin:top left; transform:translateY(-10px) scale(.95); }
        .start-menu.active { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
        .start-menu-category { font-size:11px; font-weight:700; color:var(--text-secondary); padding:4px 10px 2px; border-bottom:1px solid rgba(0,0,0,.05); margin-top:3px; }
        .start-menu-item { padding:6px 10px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:.2s; font-size:13px; color:var(--text); }
        .start-menu-item .icon-img { font-size:18px; }
        .start-menu-item:hover { background:rgba(126,180,242,.2); }
        #startMenuSearch { width:100%; padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.3); outline:none; font-size:13px; color:var(--text); margin-bottom:6px; }
        #startMenuSearch:focus { border-color:var(--primary); background:rgba(255,255,255,0.5); }

        /* ===== 窗口 ===== */
        .window {
            position:absolute; min-width:240px; min-height:160px;

        var DB_NAME = 'hcos-fs',
            STORE_NAME = 'files',
            CHUNK_STORE = 'chunks',
            CHUNK_SIZE = 1024 * 1024;
        var db = null;

        function openDB() {
            return new Promise(function(resolve) {
                try {
                    var r = indexedDB.open(DB_NAME, 2);
                    r.onupgradeneeded = function(e) {
                        var d = e.target.result;
                        if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        if (!d.objectStoreNames.contains(CHUNK_STORE)) d.createObjectStore(CHUNK_STORE, { keyPath: [
                                'fileId', 'chunkIndex'
                            ] });
                    };
                    r.onsuccess = function(e) { db = e.target.result;
                        resolve(db); };
                    r.onerror = function() { resolve(null); };
                } catch (e) { resolve(null); }
            });
        }
        var fileSystem = {
            version: CURRENT_VERSION,
            root: {
                '文档': { type: 'folder', children: { '欢迎.txt': { type: 'file', content: '欢迎使用 HCOS！' } } },
                '图片': { type: 'folder', children: {} },

                '桌面': { type: 'folder', children: {} },
                '音乐': { type: 'folder', children: {} }
            }
        };

        async function loadFS() {
            try {
                var dbInstance = await openDB();
                if (!dbInstance) return;
                return new Promise(function(resolve) {
                    var tx = dbInstance.transaction(STORE_NAME, 'readonly');
                    var store = tx.objectStore(STORE_NAME);
                    var req = store.get('filesystem');
                    req.onsuccess = function() { if (req.result) fileSystem = req.result.data;
                        resolve(); };
                    req.onerror = function() { resolve(); };
                });
            } catch (e) {}
        }

        async function saveFS() {
            try {
                if (!db) { var d = await openDB(); if (!d) return;
                    db = d; }
                var tx = db.transaction(STORE_NAME, 'readwrite');
                var store = tx.objectStore(STORE_NAME);
                store.put({ id: 'filesystem', data: fileSystem });
            } catch (e) {}
        }

        async function getFileContent(pathArr, name) {
            try {
                var current = fileSystem.root;
                for (var i = 0; i < pathArr.length; i++) {
                    if (!current[pathArr[i]] || current[pathArr[i]].type !== 'folder') return null;
                    current = current[pathArr[i]].children;
                }
                var file = current[name];
                if (!file) return null;
                if (!file.chunked) return file.content || '';
                if (!db) await openDB();
                if (!db) return null;
                var tx = db.transaction(CHUNK_STORE, 'readonly');
                var store = tx.objectStore(CHUNK_STORE);
                var chunks = [];
                for (var j = 0; j < file.chunks; j++) {
                    var req = store.get([file.id, j]);
                    await new Promise(function(res) { req.onsuccess = function() { chunks[j] = req.result ? req.result
                            .data : '';
                        res(); };
                        req.onerror = res; });
                }
                return chunks.join('');
            } catch (e) { return null; }
        }

        async function setFileByPath(pathArr, name, content) {
            try {
                var current = fileSystem.root;
                for (var i = 0; i < pathArr.length; i++) {
                    if (!current[pathArr[i]]) current[pathArr[i]] = { type: 'folder', children: {} };
                    current = current[pathArr[i]].children;
                }
                var fileId = Date.now().toString(36) + Math.random().toString(36);
                var file = { type: 'file', content: '', id: fileId, chunked: false, chunks: 0, size: content.length,
                    modified: new Date().toISOString() };
                if (content.length <= CHUNK_SIZE) {
                    file.content = content;
                } else {
                    if (!db) await openDB();
                    if (!db) return;
                    var tx = db.transaction(CHUNK_STORE, 'readwrite');
                    var store = tx.objectStore(CHUNK_STORE);
                    var chunks = Math.ceil(content.length / CHUNK_SIZE);
                    file.chunked = true;
                    file.chunks = chunks;
                    for (var j = 0; j < chunks; j++) {
                        store.put({ fileId: fileId, chunkIndex: j, data: content.substring(j * CHUNK_SIZE, (j + 1) *
                                CHUNK_SIZE) });
                    }
                }
                current[name] = file;
                await saveFS();
            } catch (e) {}
        }

        async function deleteRecursive(current, pathArr, name) {
            try {
                var folder = pathArr.reduce(function(o, k) { return o[k].children; }, fileSystem.root);
                var item = folder[name];
                if (!item) return;
                if (item.type === 'folder') {
                    var children = item.children || {};
                    for (var childName in children) {
                        await deleteRecursive(folder, [...pathArr, name], childName);
                    }
                    delete folder[name];
                } else {
                    if (item.chunked && db) {
                        var tx = db.transaction(CHUNK_STORE, 'readwrite');
                        var store = tx.objectStore(CHUNK_STORE);
                        for (var i = 0; i < item.chunks; i++) {
                            store.delete([item.id, i]);
                        }
                    }
                    delete folder[name];
                }
                await saveFS();
            } catch (e) {}
        }

        function stableStringify(obj) {
            if (obj === undefined || obj === null) return 'null';
            if (typeof obj === 'string') return JSON.stringify(obj);
            if (typeof obj === 'object') {

        function findAvailablePosition(width, height) {
            var sw = window.innerWidth,
                sh = window.innerHeight;
            var existingWindows = windows.filter(function(w) { return w.parentNode; });
            var positions = existingWindows.map(function(w) {
                var rect = w.getBoundingClientRect();
                return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
            });
            var centerX = (sw - width) / 2,
                centerY = (sh - height) / 2;
            var step = 28,
                maxSteps = 120;
            for (var i = 0; i < maxSteps; i++) {
                var angle = i * 0.45;
                var radius = i * step / 8;
                var x = centerX + radius * Math.cos(angle);
                var y = centerY + radius * Math.sin(angle);
                x = Math.max(10, Math.min(x, sw - width - 10));
                y = Math.max(10, Math.min(y, sh - height - 40));
                var overlapping = false;
                for (var j = 0; j < positions.length; j++) {
                    var p = positions[j];
                    if (x < p.left + p.width + 10 && x + width + 10 > p.left &&
                        y < p.top + p.height + 10 && y + height + 10 > p.top) {
                        overlapping = true;
                        break;
                    }
                }
                if (!overlapping) {
                    return { left: x, top: y };
                }
            }
            return {
                left: Math.random() * (sw - width - 20) + 10,
                top: Math.random() * (sh - height - 50) + 10
            };
        }

                defaultHeight = 320;

            win.style.left = pos.left + 'px';

            win.style.width = defaultWidth + 'px';
            win.style.height = defaultHeight + 'px';
            var loadingHTML = '<div class="app-loading"><div class="spinner"></div><span>正在启动 ' + title + '...</span></div>';

                loadingHTML + '</div><div class="resize-handle" style="position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,0.06) 50%);border-radius:0 0 12px 0;"></div>';

                closeWindow(win); });
            win.querySelector('[data-action="minimize"]').addEventListener('click', function(e) { e.stopPropagation();
                minimizeWindow(win); });
            win.querySelector('[data-action="maximize"]').addEventListener('click', function(e) {
                e.stopPropagation();
                var mW = window.innerWidth,
                    mH = window.innerHeight - 32;
                if (win.dataset.prevSize) {
                    var p = JSON.parse(win.dataset.prevSize);
                    win.style.left = p.left;
                    win.style.top = p.top;
                    win.style.width = p.width;
                    win.style.height = p.height;
                    delete win.dataset.prevSize;
                } else {
                    win.dataset.prevSize = JSON.stringify({ left: win.style.left, top: win.style.top, width: win
                            .style.width, height: win.style.height });
                    win.style.width = mW + 'px';
                    win.style.height = mH + 'px';

            win.addEventListener('mousedown', function(e) {

            win.querySelector('.resize-handle').addEventListener('mousedown', function(e) { e.stopPropagation();
                initResize(e, win); });
            win.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e
                    .preventDefault();

            var ro = new ResizeObserver(function() {

        function closeWindow(win) {
            if (win._keydownHandler) document.removeEventListener('keydown', win._keydownHandler);
            if (win._taskmgrInterval) clearInterval(win._taskmgrInterval);
            if (win._uptimeInterval) clearInterval(win._uptimeInterval);
            if (win._clockInterval) clearInterval(win._clockInterval);
            if (win._monitorInterval) clearInterval(win._monitorInterval);
            if (win._browserCheckInterval) clearInterval(win._browserCheckInterval);
            if (win._previewInterval) clearInterval(win._previewInterval);
            if (win._resizeObserver) win._resizeObserver.disconnect();
            windows = windows.filter(function(w) { return w !== win; });

        function bringToFront(win, hideOthers) {
            if (hideOthers === undefined) hideOthers = true;

        function initDrag(e) {
            var win = e.target.closest('.window');
            if (!win) return;
            win.classList.add('dragging');
            var rect = win.getBoundingClientRect(),
                offX = e.clientX - rect.left,
                offY = e.clientY - rect.top;
            var mv = function(e) {
                win.style.left = (e.clientX - offX) + 'px';
                win.style.top = (e.clientY - offY) + 'px';
                var snapThreshold = 20,
                    wW = window.innerWidth,
                    wH = window.innerHeight;
                if (e.clientX < snapThreshold) win.style.left = '0px';
                else if (e.clientX > wW - snapThreshold) win.style.left = (wW - rect.width) + 'px';
                if (e.clientY < snapThreshold) win.style.top = '0px';
                else if (e.clientY > wH - snapThreshold) win.style.top = (wH - rect.height) + 'px';
            };
            var up = function() {
                document.removeEventListener('mousemove', mv);
                document.removeEventListener('mouseup', up);
                win.classList.remove('dragging');
                var rect2 = win.getBoundingClientRect();
                var wW2 = window.innerWidth,
                    wH2 = window.innerHeight;
                var snap = 30;
                if (rect2.left < snap) {
                    win.style.left = '0px';
                    win.style.width = (wW2 / 2) + 'px';
                    win.style.height = (wH2 - 46) + 'px';
                } else if (rect2.right > wW2 - snap) {
                    win.style.left = (wW2 / 2) + 'px';
                    win.style.width = (wW2 / 2) + 'px';
                    win.style.height = (wH2 - 46) + 'px';
                }
                saveSession();
            };
            document.addEventListener('mousemove', mv);
            document.addEventListener('mouseup', up);
        }

        function initResize(e, win) {

                startY = e.clientY,
                startW = parseInt(getComputedStyle(win).width),
                startH = parseInt(getComputedStyle(win).height);
            var mv = function(e) {
                win.style.width = (startW + e.clientX - startX) + 'px';
                win.style.height = (startH + e.clientY - startY) + 'px';
            };
            var up = function() {
                document.removeEventListener('mousemove', mv);
                document.removeEventListener('mouseup', up);
                var ev = new Event('resize');
                win.querySelector('.window-content').dispatchEvent(ev);

        var _openAppPending = {};

        function openApp(appId, params, forceMulti) {
            forceMulti = forceMulti || false;
            var app = appRegistry[appId];
            if (!app) { console.warn('应用未注册:', appId); return; }
            var key = appId + '_' + stableStringify(params);
            if (_openAppPending[key]) return;
            _openAppPending[key] = true;
            setTimeout(function() { _openAppPending[key] = false; }, 400);
            if (!forceMulti && !app.multiInstance) {
                var existing = windows.find(function(w) {
                    if (w.dataset.app !== appId) return false;
                    var wParams = w.dataset.params || 'null';
                    var p = (params !== undefined && params !== null) ? stableStringify(params) : 'null';
                    return wParams === p;
                });
                if (existing) { bringToFront(existing, true); return; }
            }
            var instanceId = Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            var title = typeof app.title === 'function' ? (app.title(params) || appId) : (app.title || appId);
            var sameAppWindows = windows.filter(function(w) { return w.dataset.app === appId; });
            if (sameAppWindows.length > 0 && (forceMulti || app.multiInstance)) {
                title += ' (' + (sameAppWindows.length + 1) + ')';
            }
            var win = createWindow(appId, title, '', params);
            win.dataset.instanceId = instanceId;
            windows.push(win);
            requestAnimationFrame(function() {
                win.classList.add('active');
                win.classList.add('focused');
            });
            setTimeout(function() {
                var realContent = typeof app.content === 'function' ? app.content(params) : app.content;
                var contentDiv = win.querySelector('.window-content');
                contentDiv.innerHTML = realContent;
                if (typeof app.bind === 'function') app.bind(win, params);
                var ev = new Event('resize');
                contentDiv.dispatchEvent(ev);
                updateTaskbarApps();
                saveSession();
            }, 300);
            updateTaskbarApps();
            saveSession();
            return win;
        }

        function renderDesktopIcons() {
            ensureAllAppsRegistered();
            var container = document.getElementById('desktopIcons');
            if (!container) return;
            container.innerHTML = '';
            var order = (settings.desktopOrder && settings.desktopOrder.length) ? settings.desktopOrder :
            desktopIconList;
            order = [...new Set(order)];
            order = order.filter(function(id) { return desktopIconList.includes(id); });
            if (order.length === 0) order = desktopIconList.slice();

            var positions = settings.desktopPositions || {};
            var containerWidth = container.clientWidth || window.innerWidth;
            var gridSize = 68,
                padding = 0,
                iconWidth = 54;
            var cols = Math.max(1, Math.floor((containerWidth - padding * 2) / gridSize));
            var gridSlots = [];
            for (var row = 0; row < 20; row++) {
                for (var col = 0; col < cols; col++) {
                    gridSlots.push({ x: padding + col * gridSize, y: padding + row * gridSize });
                }
            }

            var usedPositions = [];
            var needAssign = [];
            order.forEach(function(appId) {
                var def = appRegistry[appId];
                if (!def) return;
                var pos = positions[appId];
                if (pos && pos.x >= 0 && pos.y >= 0 &&
                    pos.x + iconWidth <= containerWidth - padding &&
                    !usedPositions.some(function(p) { return Math.abs(p.x - pos.x) < 5 && Math.abs(p.y - pos
                            .y) < 5; })) {
                    usedPositions.push({ x: pos.x, y: pos.y, appId: appId });
                } else {
                    needAssign.push(appId);
                }
            });

            var slotIndex = 0;
            needAssign.forEach(function(appId) {
                var def = appRegistry[appId];
                if (!def) return;
                var assigned = false;
                while (slotIndex < gridSlots.length) {
                    var slot = gridSlots[slotIndex];
                    var occupied = usedPositions.some(function(p) {
                        return Math.abs(p.x - slot.x) < 5 && Math.abs(p.y - slot.y) < 5;
                    });
                    if (!occupied) {
                        positions[appId] = { x: slot.x, y: slot.y };
                        usedPositions.push({ x: slot.x, y: slot.y, appId: appId });
                        slotIndex++;
                        assigned = true;
                        break;
                    }
                    slotIndex++;
                }
                if (!assigned) {
                    var last = usedPositions[usedPositions.length - 1];
                    var newX = (last ? last.x + gridSize : 0);
                    if (newX + iconWidth > containerWidth - padding) newX = padding;
                    var newY = (last ? last.y + gridSize : 0);
                    positions[appId] = { x: newX, y: newY };
                    usedPositions.push({ x: newX, y: newY, appId: appId });
                }
            });

            settings.desktopPositions = positions;
            saveSettings();

            order.forEach(function(appId) {
                var def = appRegistry[appId];
                if (!def) return;
                var pos = positions[appId] || { x: padding, y: padding };
                var div = document.createElement('div');
                div.className = 'desktop-icon';
                div.dataset.app = appId;
                div.draggable = true;
                var title = typeof def.title === 'function' ? (def.title() || appId) : (def.title || appId);
                div.innerHTML = '<span class="icon-img">' + def.icon + '</span><span>' + title + '</span>';
                div.style.left = pos.x + 'px';
                div.style.top = pos.y + 'px';
                var clickTimer = null;
                div.addEventListener('click', function(e) {
                    if (clickTimer) { clearTimeout(clickTimer);
                        clickTimer = null; }
                    clickTimer = setTimeout(function() {
                        var forceMulti = e.ctrlKey || e.metaKey;
                        openApp(appId, null, forceMulti);
                        clickTimer = null;
                    }, 150);
                });
                div.addEventListener('contextmenu', function(e) { e.preventDefault();
                    showDesktopCtx(e.clientX, e.clientY, appId); });
                div.addEventListener('dragstart', function(e) {
                    div.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', appId);
                });
                div.addEventListener('dragend', function(e) {
                    div.classList.remove('dragging');
                    document.querySelectorAll('.desktop-icon.drag-over').forEach(function(el) { el.classList
                            .remove('drag-over'); });
                    var rect = div.getBoundingClientRect();
                    var containerRect = container.getBoundingClientRect();
                    var x = rect.left - containerRect.left + window.scrollX;
                    var y = rect.top - containerRect.top + window.scrollY;
                    var snap = function(v) { return Math.round(v / gridSize) * gridSize; };
                    x = Math.max(0, snap(x));
                    y = Math.max(0, snap(y));
                    if (x + iconWidth > containerWidth - padding) x = containerWidth - iconWidth - padding;
                    if (isNaN(x) || x < 0) x = padding;
                    if (isNaN(y) || y < 0) y = padding;
                    div.style.left = x + 'px';
                    div.style.top = y + 'px';
                    settings.desktopPositions[appId] = { x: x, y: y };
                    saveSettings();
                });
                div.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    document.querySelectorAll('.desktop-icon.drag-over').forEach(function(el) { el.classList
                            .remove('drag-over'); });
                    div.classList.add('drag-over');
                });
                div.addEventListener('dragleave', function() { div.classList.remove('drag-over'); });
                div.addEventListener('drop', function(e) {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    var draggedApp = e.dataTransfer.getData('text/plain');
                    if (draggedApp && draggedApp !== appId && desktopIconList.includes(draggedApp)) {
                        var pos1 = settings.desktopPositions[draggedApp] || { x: padding, y: padding };
                        var pos2 = settings.desktopPositions[appId] || { x: padding, y: padding };
                        settings.desktopPositions[draggedApp] = pos2;
                        settings.desktopPositions[appId] = pos1;
                        var orderArr = settings.desktopOrder;
                        var idx1 = orderArr.indexOf(draggedApp);
                        var idx2 = orderArr.indexOf(appId);
                        if (idx1 > -1 && idx2 > -1) {
                            [orderArr[idx1], orderArr[idx2]] = [orderArr[idx2], orderArr[idx1]];
                        }
                        saveSettings();
                        renderDesktopIcons();
                    }
                });
                container.appendChild(div);
            });
            var newOrder = Array.from(container.querySelectorAll('.desktop-icon')).map(function(el) { return el.dataset
                    .app; });
            settings.desktopOrder = [...new Set(newOrder)];
            saveSettings();
        }

        function makeWidgetDraggable(widget) {
            var isDragging = false,
                startX = 0,
                startY = 0,
                origLeft = 0,
                origTop = 0;

            function onStart(e) {
                if (e.target.closest('.widget-close') || e.target.closest('.widget-resize-handle')) return;
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                origLeft = parseInt(widget.style.left) || 0;
                origTop = parseInt(widget.style.top) || 0;
                isDragging = true;
                widget.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
            }

            function onMove(e) {
                if (!isDragging) return;
                var dx = e.clientX - startX,
                    dy = e.clientY - startY;
                widget.style.left = (origLeft + dx) + 'px';
                widget.style.top = (origTop + dy) + 'px';
                widget.style.right = 'auto';
            }

            function onEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                widget.style.cursor = 'default';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                var id = widget.dataset.widgetId;
                var w = settings.widgets.find(function(ww) { return ww.id === id; });
                if (w) {
                    w.left = parseInt(widget.style.left);
                    w.top = parseInt(widget.style.top);
                    saveSettings();
                }
            }
            widget.addEventListener('mousedown', onStart);
            widget.addEventListener('touchstart', function(e) {
                if (e.target.closest('.widget-close') || e.target.closest('.widget-resize-handle')) return;
                var touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                origLeft = parseInt(widget.style.left) || 0;
                origTop = parseInt(widget.style.top) || 0;
                isDragging = true;
                widget.style.cursor = 'grabbing';
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd, { passive: false });
            }, { passive: true });

            function onTouchMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                var touch = e.touches[0];
                var dx = touch.clientX - startX,
                    dy = touch.clientY - startY;
                widget.style.left = (origLeft + dx) + 'px';
                widget.style.top = (origTop + dy) + 'px';
                widget.style.right = 'auto';
            }

            function onTouchEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                widget.style.cursor = 'default';
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
                var id = widget.dataset.widgetId;
                var w = settings.widgets.find(function(ww) { return ww.id === id; });
                if (w) {
                    w.left = parseInt(widget.style.left);
                    w.top = parseInt(widget.style.top);
                    saveSettings();
                }
            }
        }

        function initWidgetResize(widget, wData) {

            var startX, startY, startW, startH;
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                startX = e.clientX;
                startY = e.clientY;
                startW = parseInt(widget.style.width) || wData.width;
                startH = parseInt(widget.style.height) || wData.height;
                var mv = function(ev) {
                    var newW = Math.max(100, startW + ev.clientX - startX);
                    var newH = Math.max(70, startH + ev.clientY - startY);
                    widget.style.width = newW + 'px';
                    widget.style.height = newH + 'px';
                };
                var up = function() {
                    document.removeEventListener('mousemove', mv);
                    document.removeEventListener('mouseup', up);
                    var id = widget.dataset.widgetId;
                    var w = settings.widgets.find(function(ww) { return ww.id === id; });
                    if (w) {
                        w.width = parseInt(widget.style.width);
                        w.height = parseInt(widget.style.height);
                        saveSettings();
                    }
                };
                document.addEventListener('mousemove', mv);
                document.addEventListener('mouseup', up);
            });

        function bindWidgetContent(wData) {
            var type = widgetTypes[wData.type];
            if (!type) return;
            if (wData.type === 'clock') {
                var canvas = document.getElementById('widgetClockCanvas_' + wData.id);
                var digitalEl = document.getElementById('widgetClockDigital_' + wData.id);
                var tzEl = document.getElementById('widgetClockTz_' + wData.id);
                if (canvas) {
                    var ctx = canvas.getContext('2d');
                    var size = 90;

                    function drawClock() {
                        var now = new Date();
                        var offset = parseInt(settings.timezone.replace('UTC', ''));
                        var localTime = getTimeWithTimezone(offset);
                        var h = localTime.getHours() % 12,
                            m = localTime.getMinutes(),
                            s = localTime.getSeconds();
                        var radius = size / 2 - 6;
                        var cx = size / 2,
                            cy = size / 2;
                        ctx.clearRect(0, 0, size, size);
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(200,200,200,0.4)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        for (var i = 0; i < 12; i++) {
                            var angle = i * Math.PI / 6 - Math.PI / 2;
                            var len = i % 3 === 0 ? 5 : 3;
                            ctx.beginPath();
                            ctx.moveTo(cx + (radius - 6) * Math.cos(angle), cy + (radius - 6) * Math.sin(angle));
                            ctx.lineTo(cx + (radius - 6 + len) * Math.cos(angle), cy + (radius - 6 + len) * Math
                                .sin(angle));
                            ctx.strokeStyle = 'rgba(80,80,80,0.7)';
                            ctx.lineWidth = i % 3 === 0 ? 2 : 1;
                            ctx.stroke();
                            if (i % 3 === 0) {
                                var num = i === 0 ? 12 : i;
                                ctx.fillStyle = 'rgba(60,60,60,0.8)';
                                ctx.font = '8px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(num, cx + (radius - 12) * Math.cos(angle), cy + (radius - 12) * Math
                                    .sin(angle));
                            }
                        }
                        var hourAngle = (h + m / 60) * Math.PI / 6 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.4 * Math.cos(hourAngle), cy + radius * 0.4 * Math.sin(
                        hourAngle));
                        ctx.strokeStyle = '#2c3e7a';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        var minAngle = (m + s / 60) * Math.PI / 30 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.6 * Math.cos(minAngle), cy + radius * 0.6 * Math.sin(
                        minAngle));
                        ctx.strokeStyle = '#444';
                        ctx.lineWidth = 1.8;
                        ctx.stroke();
                        var secAngle = s * Math.PI / 30 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.7 * Math.cos(secAngle), cy + radius * 0.7 * Math.sin(
                        secAngle));
                        ctx.strokeStyle = '#e74c3c';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
                        ctx.fillStyle = '#e74c3c';
                        ctx.fill();
                        if (digitalEl) digitalEl.textContent = localTime.toLocaleTimeString('zh-CN', { hour12: false });
                        if (tzEl) tzEl.textContent = settings.timezone;
                    }
                    drawClock();
                    if (wData._clockInterval) clearInterval(wData._clockInterval);
                    wData._clockInterval = setInterval(drawClock, 1000);
                }
            } else if (wData.type === 'weather') {
                var iconEl = document.getElementById('widgetWeatherIcon_' + wData.id);
                var tempEl = document.getElementById('widgetWeatherTemp_' + wData.id);
                var descEl = document.getElementById('widgetWeatherDesc_' + wData.id);
                var humEl = document.getElementById('widgetWeatherHum_' + wData.id);
                var aqiEl = document.getElementById('widgetWeatherAqi_' + wData.id);
                if (iconEl) {
                    async function updateWeather() {
                        try {
                            var resp = await fetch(
                                'https://api.open-meteo.com/v1/forecast?latitude=31.2&longitude=121.5&current_weather=true'
                                );
                            if (!resp.ok) throw new Error('API失败');
                            var data = await resp.json();
                            var cur = data.current_weather;

                                desc = '雾'; } else if (wcode <= 55) { icon = '🌦️';
                                desc = '毛毛雨'; } else if (wcode <= 65) { icon = '🌧️';
                                desc = '雨'; } else if (wcode <= 77) { icon = '❄️';
                                desc = '雪'; } else if (wcode <= 82) { icon = '🌦️';
                                desc = '阵雨'; } else if (wcode <= 86) { icon = '🌨️';
                                desc = '阵雪'; } else if (wcode <= 99) { icon = '⛈️';
                                desc = '雷暴'; }
                            iconEl.textContent = icon;
                            tempEl.textContent = Math.round(cur.temperature) + '°C';
                            descEl.textContent = desc;

        function getSystemUptime() {
            var uptime = Math.floor(performance.now() / 1000);
            var h = Math.floor(uptime / 3600);
            var m = Math.floor((uptime % 3600) / 60);
            var s = uptime % 60;
            return h + 'h ' + m + 'm ' + s + 's';
        }

        var batteryLevel = 1,

        async function updateBattery() {
            try {
                if (navigator.getBattery) {
                    var battery = await navigator.getBattery();
                    batteryLevel = battery.level;
                    batteryCharging = battery.charging;
                    battery.addEventListener('levelchange', function() { batteryLevel = battery.level;
                        updateBatteryUI(); });
                    battery.addEventListener('chargingchange', function() { batteryCharging = battery.charging;
                        updateBatteryUI(); });
                }
            } catch (e) {}
            updateBatteryUI();
        }

        function updateBatteryUI() {
            var el = document.getElementById('batteryIcon');
            if (!el) return;
            var pct = Math.round(batteryLevel * 100);
            var icon = batteryCharging ? '🔌' : '🔋';
            el.textContent = icon + ' ' + pct + '%';
            el.title = t('battery') + ': ' + pct + '%' + (batteryCharging ? ' (充电)' : '');
        }

        function updateMemory() {
            var el = document.getElementById('memoryDisplay');
            if (!el) return;
            var used = 0,
                total = 2048;
            if (performance.memory) {
                used = performance.memory.usedJSHeapSize / (1024 * 1024);
            } else {
                used = Math.round(Math.random() * 500 + 200);
            }
            used = Math.min(used, total);
            var usedStr = used >= 1024 ? (used / 1024).toFixed(1) + 'G' : Math.round(used) + 'M';
            var totalStr = total >= 1024 ? (total / 1024).toFixed(0) + 'G' : total + 'M';
            el.textContent = '内存: ' + usedStr + '/' + totalStr;
            el.title = t('memory') + ': ' + usedStr + ' / ' + totalStr;
        }

                '</div>';
            var typeSelect = content.querySelector('#ucType');

            var fromSelect = content.querySelector('#ucFrom');
            var toSelect = content.querySelector('#ucTo');
            var resultInput = content.querySelector('#ucResult');
            var formulaDiv = content.querySelector('#ucFormula');
            var units = {
                length: { units: ['毫米', '厘米', '分米', '米', '千米', '英寸', '英尺', '码', '英里'], factors: [1, 10, 100, 1000,
                        1000000, 25.4, 304.8, 914.4, 1609344
                    ] },
                weight: { units: ['毫克', '克', '千克', '吨', '盎司', '磅'], factors: [1, 1000, 1000000, 1000000000,
                        28349.5, 453592
                    ] },
                temperature: {
                    units: ['摄氏度', '华氏度', '开尔文'],
                    convert: function(val, from, to) {
                        var celsius;
                        if (from === '摄氏度') celsius = val;
                        else if (from === '华氏度') celsius = (val - 32) * 5 / 9;
                        else celsius = val - 273.15;
                        if (to === '摄氏度') return celsius;
                        else if (to === '华氏度') return celsius * 9 / 5 + 32;
                        else return celsius + 273.15;
                    }
                }
            };

            function populateSelects(type) {
                var u = units[type];
                var opts = u.units.map(function(u) { return '<option value="' + u + '">' + u + '</option>'; }).join('');
                fromSelect.innerHTML = opts;
                toSelect.innerHTML = opts;
                if (type === 'temperature') { fromSelect.value = '摄氏度';
                    toSelect.value = '华氏度'; } else { fromSelect.value = u.units[0];
                    toSelect.value = u.units[1] || u.units[0]; }
                convert();
            }

            function convert() {
                var type = typeSelect.value;
                var val = parseFloat(valueInput.value) || 0;
                var from = fromSelect.value,
                    to = toSelect.value;
                var result, formula = '';
                if (type === 'temperature') {
                    result = units.temperature.convert(val, from, to);
                    formula = val + ' ' + from + ' = ' + result.toFixed(2) + ' ' + to;
                } else {
                    var u = units[type];
                    var fromIdx = u.units.indexOf(from),
                        toIdx = u.units.indexOf(to);
                    if (fromIdx === -1 || toIdx === -1) return;
                    result = val * u.factors[fromIdx] / u.factors[toIdx];
                    formula = val + ' ' + from + ' = ' + result.toFixed(4) + ' ' + to;
                }
                resultInput.value = result.toFixed(4);
                formulaDiv.textContent = formula;
            }
            typeSelect.addEventListener('change', function() { populateSelects(this.value); });
            valueInput.addEventListener('input', convert);
            fromSelect.addEventListener('change', convert);
            toSelect.addEventListener('change', convert);
            populateSelects('length');
        }

        function bindClock(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:10px;">' +
                '<canvas id="clockCanvas" width="180" height="180" style="width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.05);"></canvas>' +
                '<div style="font-size:28px;font-weight:300;margin-top:6px;" id="clockDigitalFull">00:00:00</div>' +
                '<div style="font-size:14px;color:var(--text-secondary);margin-top:2px;" id="clockTzFull">' + settings
                .timezone + '</div>' +
                '</div>';
            var canvas = content.querySelector('#clockCanvas');
            var ctx = canvas.getContext('2d');
            var digitalEl = content.querySelector('#clockDigitalFull');
            var tzEl = content.querySelector('#clockTzFull');
            var size = 180;

            function drawClock() {
                var offset = parseInt(settings.timezone.replace('UTC', ''));
                var now = getTimeWithTimezone(offset);
                var h = now.getHours() % 12,
                    m = now.getMinutes(),
                    s = now.getSeconds();
                var radius = size / 2 - 14;
                var cx = size / 2,
                    cy = size / 2;
                ctx.clearRect(0, 0, size, size);
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(200,200,200,0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                for (var i = 0; i < 12; i++) {
                    var angle = i * Math.PI / 6 - Math.PI / 2;
                    var len = i % 3 === 0 ? 10 : 5;
                    ctx.beginPath();
                    ctx.moveTo(cx + (radius - 12) * Math.cos(angle), cy + (radius - 12) * Math.sin(angle));
                    ctx.lineTo(cx + (radius - 12 + len) * Math.cos(angle), cy + (radius - 12 + len) * Math.sin(
                        angle));
                    ctx.strokeStyle = 'rgba(80,80,80,0.6)';
                    ctx.lineWidth = i % 3 === 0 ? 2 : 1;
                    ctx.stroke();
                    if (i % 3 === 0) {
                        var num = i === 0 ? 12 : i;
                        ctx.fillStyle = 'rgba(60,60,60,0.8)';
                        ctx.font = '14px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        var nr = radius - 22;
                        ctx.fillText(num, cx + nr * Math.cos(angle), cy + nr * Math.sin(angle));
                    }
                }
                var hourAngle = (h + m / 60) * Math.PI / 6 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.4 * Math.cos(hourAngle), cy + radius * 0.4 * Math.sin(hourAngle));
                ctx.strokeStyle = '#2c3e7a';
                ctx.lineWidth = 3.5;
                ctx.stroke();
                var minAngle = (m + s / 60) * Math.PI / 30 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.6 * Math.cos(minAngle), cy + radius * 0.6 * Math.sin(minAngle));
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                var secAngle = s * Math.PI / 30 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.7 * Math.cos(secAngle), cy + radius * 0.7 * Math.sin(secAngle));
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
                if (digitalEl) digitalEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                if (tzEl) tzEl.textContent = settings.timezone;
            }
            drawClock();
            if (win._clockInterval) clearInterval(win._clockInterval);
            win._clockInterval = setInterval(drawClock, 1000);
            content.addEventListener('resize', function() {
                drawClock();
            });
        }

            function playCurrent() {

            function nextTrack() {
                if (playlist.length === 0) return;

                    while (idx === currentIndex && playlist.length > 1) idx = Math.floor(Math.random() * playlist
                        .length);
                    currentIndex = idx;

                    currentIndex = (currentIndex + 1) % playlist.length;

            audio.addEventListener('ended', function() {

        function bindCalendar(win) {
            var content = win.querySelector('.window-content');

                month = now.getMonth();

                '4-1': '愚人节',

            var selectedDate = null;

            function renderCalendar() {
                var firstDay = new Date(year, month, 1).getDay();
                var daysInMonth = new Date(year, month + 1, 0).getDate();
                var today = new Date();
                var html = '<div class="calendar-modern">' +
                    '<div class="cal-header-modern">' +
                    '<button id="calPrevM">◀</button>' +
                    '<span class="cal-title">' + year + '年' + (month + 1) + '月</span>' +

                    '</div>' +
                    '<div class="cal-grid-modern">';
                ['日', '一', '二', '三', '四', '五', '六'].forEach(function(d) {
                    html += '<div style="text-align:center;font-weight:bold;font-size:11px;color:var(--text-secondary);padding:2px;">' +
                        d + '</div>';
                });
                for (var i = 0; i < firstDay; i++) html += '<div></div>';
                for (var d = 1; d <= daysInMonth; d++) {
                    var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2,
                    '0');
                    var isToday = (d === today.getDate() && month === today.getMonth() && year === today
                        .getFullYear());
                    var holiday = holidays[(month + 1) + '-' + d] || '';
                    var hasEvents = events[dateStr] && events[dateStr].length > 0;
                    var cls = 'cal-cell';
                    if (isToday) cls += ' today';
                    if (holiday) cls += ' holiday';
                    html += '<div class="' + cls + '" data-date="' + dateStr + '">' +
                        d +
                        (holiday ? '<span class="holiday-label">' + holiday + '</span>' : '') +
                        (hasEvents ? '<span class="event-dot"></span>' : '') +
                        '</div>';
                }
                html += '</div><div class="cal-events-modern" id="calEventsM"></div>' +
                    '<div class="cal-add-event"><input id="calEventInputM" placeholder="' + t('event_placeholder') +
                    '">' +
                    '<button id="calAddEventM">' + t('add_event') + '</button></div></div>';
                content.innerHTML = html;
                document.getElementById('calPrevM').addEventListener('click', function() {
                    month--;
                    if (month < 0) { month = 11;
                        year--; }
                    renderCalendar();
                });
                document.getElementById('calNextM').addEventListener('click', function() {
                    month++;
                    if (month > 11) { month = 0;
                        year++; }
                    renderCalendar();
                });
                content.querySelectorAll('.cal-cell').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var date = this.dataset.date;
                        selectedDate = date;
                        renderEvents(date);
                        content.querySelectorAll('.cal-cell').forEach(function(c) { c.style.outline =
                            'none'; });
                        this.style.outline = '2px solid var(--primary)';
                    });
                });
                var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' +
                    String(today.getDate()).padStart(2, '0');
                var todayEl = content.querySelector('.cal-cell[data-date="' + todayStr + '"]');
                if (todayEl) todayEl.click();
                else { var firstEl = content.querySelector('.cal-cell'); if (firstEl) firstEl.click(); }
                document.getElementById('calAddEventM').addEventListener('click', function() {
                    var input = document.getElementById('calEventInputM');
                    if (input.value.trim() && selectedDate) {
                        if (!events[selectedDate]) events[selectedDate] = [];
                        events[selectedDate].push(input.value.trim());
                        safeSetJSON('calendar_events', events);
                        input.value = '';
                        renderCalendar();
                        renderEvents(selectedDate);
                    }
                });
                document.getElementById('calEventInputM').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') document.getElementById('calAddEventM').click();
                });
            }

            function renderEvents(date) {
                var evDiv = document.getElementById('calEventsM');
                if (!evDiv) return;
                var evs = events[date] || [];
                if (evs.length === 0) {
                    evDiv.innerHTML = '<div style="opacity:0.5;padding:4px;">暂无日程</div>';
                    return;
                }
                evDiv.innerHTML = evs.map(function(e, i) {
                    return '<div class="event-item"><span>' + e + '</span><span class="del-event" data-idx="' +
                        i + '">✕</span></div>';
                }).join('');
                evDiv.querySelectorAll('.del-event').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var idx = parseInt(this.dataset.idx);
                        if (events[date]) {
                            events[date].splice(idx, 1);
                            if (events[date].length === 0) delete events[date];
                            safeSetJSON('calendar_events', events);
                            renderCalendar();
                            renderEvents(date);
                        }
                    });
                });
            }
            renderCalendar();
        }

        function bindPaint(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;padding:5px;">' +
                '<div style="display:flex;gap:6px;padding:3px;flex-wrap:wrap;align-items:center;">' +
                '<button id="paintClear" style="background:#e74c3c;color:white;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px;">清除</button>' +
                '<label style="font-size:12px;">颜色 <input type="color" id="paintColor" value="#000000" style="width:24px;height:24px;border:none;padding:0;cursor:pointer;"></label>' +
                '<label style="font-size:12px;">大小 <input type="range" id="paintSize" min="1" max="20" value="3" style="width:60px;"></label>' +
                '</div>' +
                '<canvas id="paintCanvas" style="flex:1;border:1px solid rgba(255,255,255,0.2);border-radius:4px;cursor:crosshair;touch-action:none;"></canvas></div>';
            var canvas = content.querySelector('#paintCanvas');
            var ctx = canvas.getContext('2d');
            var clearBtn = content.querySelector('#paintClear');
            var colorInput = content.querySelector('#paintColor');
            var sizeInput = content.querySelector('#paintSize');
            var drawing = false,
                lastX = 0,
                lastY = 0;

            function resizeCanvas() {
                var rect = canvas.parentElement.getBoundingClientRect();
                var w = canvas.parentElement.clientWidth - 10;
                var h = canvas.parentElement.clientHeight - 50;
                if (w < 10) w = 200;
                if (h < 10) h = 200;
                canvas.width = w;
                canvas.height = h;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, w, h);
                canvas._w = w;
                canvas._h = h;
            }
            resizeCanvas();

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var x = (e.clientX - rect.left);
                var y = (e.clientY - rect.top);
                return { x: Math.max(0, Math.min(x, canvas._w || canvas.width)), y: Math.max(0, Math.min(y, canvas
                        ._h || canvas.height)) };
            }

            function startDraw(e) {
                e.preventDefault();
                drawing = true;
                var pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            }

            function draw(e) {
                e.preventDefault();
                if (!drawing) return;
                var pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = colorInput.value;
                ctx.lineWidth = parseInt(sizeInput.value);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                            '</span>'; })
                        .replace(/(".*?"|'.*?')/g, function(m) { return '<span style="color:#ce9178;">' + m +
