                        .replace(
                            /\b(const|let|var|function|return|if|else|for|while|class|new|this|try|catch|throw|async|await|import|export|from|default|typeof|instanceof|switch|case|break|continue|do|finally|with|yield|delete|in|of|void|typeof|instanceof|new)\b/g,
                            function(m) { return '<span style="color:#c586c0;">' + m + '</span>'; })
                        .replace(
                            /\b(console|log|document|window|Math|JSON|Array|Object|String|Number|Boolean|Promise|fetch|setTimeout|setInterval|clearTimeout|clearInterval)\b/g,
                            function(m) { return '<span style="color:#4ec9b0;">' + m + '</span>'; });
                } else if (lang === 'html') {
                    return code.replace(/(&lt;\/?[\w\s-]+&gt;)/g, function(m) { return '<span style="color:#569cd6;">' +
                            m + '</span>'; })
                        .replace(/(&lt;[\w\s-]+)/g, function(m) { return '<span style="color:#569cd6;">' + m +

                            function(m) { return '<span style="color:#9cdcfe;">' + m + '</span>'; });
                } else if (lang === 'css') {
                    return code.replace(/(\.[\w-]+)/g, function(m) { return '<span style="color:#d7ba7d;">' + m +
                            '</span>'; })
                        .replace(/(#[\w-]+)/g, function(m) { return '<span style="color:#d7ba7d;">' + m + '</span>'; })

                        .replace(/(".*?")/g, function(m) { return '<span style="color:#ce9178;">' + m + '</span>'; });

                        t('lock_pw') + '</label><input type="password" id="lockPasswordSetup" value="' + settings
                        .lockPassword +
                        '" style="width:100%;padding:6px 10px;border-radius:6px;border:1px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.6);color:var(--welcome-text);"></div></div>';
                    break;
                case 6:
                    h = '<div class="check-icon">✓</div><div class="step-title">' + t('ready_title') +
                        '</div><div class="step-subtitle">' + t('welcome_ready') + '</div>';
                    break;
            }
            h += '<div class="btn-group">';
            if (!isFirst) h += '<button class="btn btn-glass" id="prevStep">' + prevLabel + '</button>';
            h += '<button class="btn btn-primary" id="nextStep">' + nextLabel + '</button>';
            h += '</div>';
            c.innerHTML = h;
            updateDots(s);
            bindStepEvents(s);
        }

        function updateDots(s) {
            document.querySelectorAll('#stepDots .dot').forEach(function(d, i) { d.classList.toggle('active', i === s); });
        }

        function bindStepEvents(s) {
            var prevBtn = document.getElementById('prevStep');
            var nextBtn = document.getElementById('nextStep');
            if (prevBtn) prevBtn.addEventListener('click', function() { if (s > 0) goToStep(s - 1); });
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    if (s === 6) {
                        settings.isSetupComplete = true;
                        saveSettings();
                        hideWelcomeScreen();
                        lockScreen();
                        return;
                    }
                    if (s === 1) { goToStep(s + 1); } else if (s === 2) {
                        settings.timezone = document.getElementById('timezoneSelect').value;
                        saveSettings();
                        goToStep(s + 1);
                    } else if (s === 3) {
                        var check = document.getElementById('privacyCheck');
                        if (!check.checked) { alert(t('privacy_agree_required')); return; }
                        settings.privacyAgreed = true;
                        saveSettings();
                        goToStep(s + 1);
                    } else if (s === 4) { goToStep(s + 1); } else if (s === 5) {
                        var n = document.getElementById('nicknameInput').value;
                        if (n) settings.nickname = n;
                        var pw = document.getElementById('lockPasswordSetup').value;
                        if (pw && pw.length > 0) settings.lockPassword = pw;
                        saveSettings();
                        goToStep(s + 1);
                    } else { goToStep(s + 1); }
                });
            }
            document.querySelectorAll('.lang-card').forEach(function(c) {
                c.addEventListener('click', function() {
                    var lang = this.dataset.lang;
                    setLanguage(lang);
                    document.querySelectorAll('.lang-card').forEach(function(el) { el.classList.remove(
                        'selected'); });
                    this.classList.add('selected');
                    renderStep(currentStep);
                });
            });
            document.querySelectorAll('.wallpaper-thumb').forEach(function(t) {
                t.addEventListener('click', function() {
                    settings.wallpaper = this.dataset.wallpaper;
                    updateWelcomeWallpaper();
                    updateLockWallpaper();
                    document.querySelectorAll('.wallpaper-thumb').forEach(function(el) { el.classList.remove(
                        'selected'); });
                    this.classList.add('selected');
                    saveSettings();
                });
            });
            document.querySelectorAll('.color-dot').forEach(function(dot) {
                dot.addEventListener('click', function() {
                    settings.accentColor = colors[parseInt(this.dataset.color)];
                    document.documentElement.style.setProperty('--primary', settings.accentColor);
                    document.querySelectorAll('.color-dot').forEach(function(el) { el.classList.remove(
                        'selected'); });
                    this.classList.add('selected');
                    saveSettings();
                });
            });
            var avatar = document.getElementById('avatarWrapper');
            if (avatar) {
                avatar.addEventListener('click', function() {
                    settings.avatarSeed = Math.random().toString(36).substring(7);
                    this.innerHTML = genAvatar();
                    saveSettings();
                });
            }
        }

        // ---- 桌面初始化 ----
        async function initDesktop() {
            if (desktopInitialized) return;
            desktopInitialized = true;
            ensureAllAppsRegistered();
            await loadFS();
            var desktop = document.getElementById('desktop');
            applyTheme();
            applyWallpaper(settings.wallpaper, desktop);
            document.documentElement.style.setProperty('--primary', settings.accentColor);
            renderDesktopIcons();
            setTimeout(function() {
                renderDesktopIcons();
            }, 100);
            ensureDefaultWidgets();
            renderWidgets();
            rebuildStartMenu();
            initDesktopContext();

            var startBtn = document.getElementById('startBtn');
            if (startBtn) {
                startBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var menu = document.getElementById('startMenu');
                    if (menu) {
                        menu.classList.toggle('active');
                    }
                });
            }
            document.getElementById('lockIcon').addEventListener('click', lockScreen);
            document.getElementById('notificationIcon').addEventListener('click', function() { var nc = document
                    .getElementById('notificationCenter');
                nc.style.display = nc.style.display === 'block' ? 'none' : 'block'; });
            document.getElementById('mobileStartBtn').addEventListener('click', function() { document.getElementById(
                    'startMenu').classList.toggle('active'); });
            document.getElementById('mobileAppsBtn').addEventListener('click', function() { openApp('store'); });
            document.getElementById('mobileNotifBtn').addEventListener('click', function() { var nc = document
                    .getElementById('notificationCenter');
                nc.style.display = nc.style.display === 'block' ? 'none' : 'block'; });

            document.addEventListener('contextmenu', function(e) {
                var target = e.target.closest('.taskbar-app');
                if (target) {
                    e.preventDefault();
                    var win = windows.find(function(w) { return w.dataset.app === target.dataset.app; });
                    if (win) showTaskbarCtx(e.clientX, e.clientY, win);
                }
            });
            document.addEventListener('click', function() { document.getElementById('taskbarContext').style.display =
                    'none'; });

            setInterval(function() {
                var offset = parseInt(settings.timezone.replace('UTC', ''));
                var now = getTimeWithTimezone(offset);
                document.getElementById('liveTime').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
            }, 1000);

            var volSlider = document.getElementById('volumeSlider');
            if (volSlider) {
                volSlider.value = Math.round((settings.volume || 0.8) * 100);
                volSlider.addEventListener('input', function() {
                    settings.volume = parseInt(this.value) / 100;
                    applyVolume();
                    saveSettings();
                });
            }
            var brightSlider = document.getElementById('brightnessSlider');
            if (brightSlider) {
                brightSlider.value = Math.round((settings.brightness || 1.0) * 100);
                brightSlider.addEventListener('input', function() {
                    settings.brightness = parseInt(this.value) / 100;
                    applyBrightness();
                    saveSettings();
                });
            }
            await updateBattery();
            updateMemory();
            setInterval(updateMemory, 5000);
            updateNotifCenter();
        }

        function showDesktopCtx(x, y, appId) {
            var menu = document.getElementById('taskbarContext');
            var isOnDesktop = settings.desktopOrder.includes(appId);
            var isInstalled = safeGetJSON('hcos-installed', []).includes(appId);
            menu.innerHTML = '<div class="taskbar-context-item" data-action="open">' + t('new_window') + '</div>' +
                '<div class="taskbar-context-item" data-action="sort-name">' + t('sort_name') + '</div>' +
                '<div class="taskbar-context-item" data-action="sort-type">' + t('sort_type') + '</div>' +
                '<div class="taskbar-context-item" data-action="toggle-desktop">' + (isOnDesktop ? t(
                    'remove_from_desktop') : t('add_to_desktop')) + '</div>' +
                (isInstalled ? '<div class="taskbar-context-item" data-action="uninstall">' + t('uninstall') +
                    '</div>' : '');
            menu.style.left = Math.min(x, window.innerWidth - 120) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - 100) + 'px';
            menu.style.display = 'block';
            menu.querySelector('[data-action="open"]').onclick = function() { openApp(appId, null, true);
                menu.style.display = 'none'; };
            menu.querySelector('[data-action="sort-name"]').onclick = function() { settings.desktopSortBy = 'name';
                saveSettings();
                renderDesktopIcons();
                menu.style.display = 'none'; };
            menu.querySelector('[data-action="sort-type"]').onclick = function() { settings.desktopSortBy = 'type';
                saveSettings();
                renderDesktopIcons();
                menu.style.display = 'none'; };
            menu.querySelector('[data-action="toggle-desktop"]').onclick = function() {
                var order = settings.desktopOrder;
                if (isOnDesktop) { var idx = order.indexOf(appId); if (idx > -1) order.splice(idx, 1); } else { if (!order
                        .includes(appId)) order.push(appId); }
                settings.desktopOrder = [...new Set(order)];
                saveSettings();
                renderDesktopIcons();
                menu.style.display = 'none';
            };
            var uninstallBtn = menu.querySelector('[data-action="uninstall"]');
            if (uninstallBtn) {
                uninstallBtn.onclick = function() { /* uninstall logic */ menu.style.display = 'none'; };
            }
        }

        function showTaskbarCtx(x, y, win) {
            var m = document.getElementById('taskbarContext');
            m.innerHTML = '<div class="taskbar-context-item" data-action="restore">' + t('restore') + '</div>' +
                '<div class="taskbar-context-item" data-action="minimize">' + t('minimize') + '</div>' +
                '<div class="taskbar-context-item" data-action="close">' + t('close') + '</div>' +
                '<div class="taskbar-context-item" data-action="new">' + t('new_window') + '</div>';
            m.style.left = Math.min(x, window.innerWidth - 120) + 'px';
            m.style.top = Math.min(y, window.innerHeight - 100) + 'px';
            m.style.display = 'block';
            m.querySelector('[data-action="restore"]').onclick = function() { bringToFront(win, true);
                m.style.display = 'none'; };
            m.querySelector('[data-action="minimize"]').onclick = function() { minimizeWindow(win);
                m.style.display = 'none'; };
            m.querySelector('[data-action="close"]').onclick = function() { closeWindow(win);
                m.style.display = 'none'; };
            m.querySelector('[data-action="new"]').onclick = function() { openApp(win.dataset.app, null, true);
                m.style.display = 'none'; };
        }

        // ---- 启动入口 ----
        (function() {
            var bootScreen = document.getElementById('bootScreen');
            var desktop = document.getElementById('desktop');
            var progressFill = document.getElementById('progressFill');
            var progressWrapper = document.getElementById('progressWrapper');
            var logoContainer = document.getElementById('logoContainer');
            var particlesContainer = document.getElementById('particlesContainer');

            if (particlesContainer) {
                var colors = ['#4a6cf7', '#7b4fff', '#3b82f6', '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e'];
                for (var i = 0; i < 60; i++) {
                    var p = document.createElement('div');
                    p.className = 'particle colored';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = (30 + Math.random() * 50) + '%';
                    p.style.animationDelay = Math.random() * 6 + 's';
                    p.style.animationDuration = (3 + Math.random() * 4) + 's';
                    p.style.width = p.style.height = (2 + Math.random() * 6) + 'px';
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.boxShadow = '0 0 10px ' + p.style.background;
                    particlesContainer.appendChild(p);
                }
            }

            progressWrapper.classList.add('active');
            logoContainer.classList.add('visible');

            var progress = 0;
            var totalDuration = 5800;
            var startTime = Date.now();

            function updateProgress() {
                var elapsed = Date.now() - startTime;
                progress = Math.min(100, (elapsed / totalDuration) * 100);
                progressFill.style.width = progress + '%';
                if (progress < 100) {
                    requestAnimationFrame(updateProgress);
                } else {
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 200);
                }
            }
            requestAnimationFrame(updateProgress);

            function enterSystem() {
                showWelcomeScreen();
                desktop.style.opacity = '0';
                desktop.classList.add('active');
                initDesktop().then(function() {});
                document.getElementById('skipAllBtn').addEventListener('click', function() {
                    hideWelcomeScreen();
                    saveSettings();
                    lockScreen();
                });
            }

            setTimeout(function() {
                if (!bootScreen.classList.contains('fade-out')) {
                    progressFill.style.width = '100%';
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 400);
                }
            }, 8000);

            var skipBoot = function() {
                if (!bootScreen.classList.contains('fade-out')) {
                    progressFill.style.width = '100%';
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 400);
                }
            };
            document.addEventListener('click', skipBoot);
            document.addEventListener('keydown', skipBoot);
        })();

        console.log('HCOS 1.0.1 完整加载成功（设置中移除亮度/音量滑块，新增HC新闻应用，使用真实API）');
    </script>
</body>
