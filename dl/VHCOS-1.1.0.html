<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HCOS 1.1.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #7eb4f2;
            --primary-hover: #6ba3e8;
            --text: #1e2a3a;
            --text-secondary: #4a5c6d;
            --bg: linear-gradient(145deg, #e6ecf5, #d5dde8);
            --taskbar-bg: rgba(255,255,255,0.68);
            --menu-bg: rgba(255,255,255,0.30);
            --window-bg: rgba(255,255,255,0.78);
            --toast-bg: rgba(30,30,40,0.88);
            --border: rgba(255,255,255,0.6);
            --editor-bg: rgba(255,255,255,0.5);
            --widget-bg: rgba(255,255,255,0.15);
            --welcome-card-bg: rgba(255,255,255,0.75);
            --welcome-text: #1e2a3a;
            --welcome-sub: #4a5c6d;
            --shadow: 0 12px 40px rgba(0,0,0,0.12);
            --radius: 18px;
            --font-size-base: 14px;
            --window-opacity: 0.88;
            --taskbar-height: 48px;
            --dock-height: 64px;
            --dock-item-size: 52px;
        }
        .dark-theme {
            --primary: #5a8fd4;
            --primary-hover: #4a7fc4;
            --text: #e8e8e8;
            --text-secondary: #aab;
            --bg: linear-gradient(145deg, #1a1a2e, #16213e);
            --taskbar-bg: rgba(30,30,50,0.78);
            --menu-bg: rgba(30,30,50,0.40);
            --window-bg: rgba(40,40,60,0.82);
            --toast-bg: rgba(20,20,30,0.9);
            --border: rgba(255,255,255,0.15);
            --editor-bg: rgba(255,255,255,0.06);
            --widget-bg: rgba(255,255,255,0.08);
            --welcome-card-bg: rgba(40,40,60,0.75);
            --welcome-text: #e8e8e8;
            --welcome-sub: #aab;
            --shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:100vw; height:100vh; overflow:hidden; font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#0a0a0f; font-size:var(--font-size-base); user-select:none; }
        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.12); border-radius:8px; }
        ::-webkit-scrollbar-thumb:hover { background:rgba(0,0,0,0.25); }

        @keyframes windowOpen { 0% { transform:scale(.92) translateY(10px); opacity:0; } 100% { transform:scale(1) translateY(0); opacity:1; } }
        @keyframes windowClose { 0% { transform:scale(1); opacity:1; } 100% { transform:scale(.92) translateY(10px); opacity:0; } }
        @keyframes minimizeToTaskbar { 0% { transform:scale(1) translateY(0); opacity:1; } 100% { transform:scale(.2) translateY(60px); opacity:0; } }
        @keyframes floatLight { 0% { transform:translate(0,0) scale(1); } 100% { transform:translate(40px,-30px) scale(1.2); } }
        @keyframes floatParticle { 0% { opacity:0; transform:translateY(0) scale(.5); } 20% { opacity:.8; } 100% { opacity:0; transform:translateY(-120px) scale(1.2); } }
        @keyframes dotPulse { 0% { box-shadow:0 0 0 0 rgba(126,180,242,.7); } 70% { box-shadow:0 0 0 8px rgba(126,180,242,0); } 100% { box-shadow:0 0 0 0 rgba(126,180,242,0); } }
        @keyframes checkPop { 0% { transform:scale(.6); opacity:0; } 100% { transform:scale(1); opacity:1; } }
        @keyframes dockAppear { 0% { transform:translateY(70px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }

        .boot-screen { position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, #0b0d1a 0%, #030308 100%); transition:opacity .8s ease; }
        .boot-screen.fade-out { opacity:0; pointer-events:none; }
        .boot-bg-lights { position:absolute; inset:0; overflow:hidden; }
        .boot-bg-light { position:absolute; border-radius:50%; filter:blur(120px); opacity:.25; animation:floatLight 8s infinite alternate ease-in-out; }
        .boot-bg-light:nth-child(1) { width:500px; height:500px; background:#4a6cf7; top:-200px; left:-150px; animation-duration:10s; }
        .boot-bg-light:nth-child(2) { width:450px; height:450px; background:#7b4fff; bottom:-180px; right:-120px; animation-duration:12s; animation-delay:-3s; }
        .boot-bg-light:nth-child(3) { width:350px; height:350px; background:#3b82f6; top:50%; left:50%; transform:translate(-50%,-50%); animation-duration:15s; animation-delay:-6s; opacity:.15; }
        .particles { position:absolute; inset:0; pointer-events:none; z-index:5; }
        .particle { position:absolute; width:4px; height:4px; border-radius:50%; opacity:0; animation:floatParticle 4s infinite ease-in; }
        .particle.colored { width:6px; height:6px; }
        .logo-container { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; opacity:0; transform:scale(.9); transition:opacity .6s ease, transform .6s ease; }
        .logo-container.visible { opacity:1; transform:scale(1); }
        .logo-glass { padding:28px 56px; background:rgba(255,255,255,.04); backdrop-filter:blur(40px); border:1px solid rgba(255,255,255,.10); border-radius:60px; box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1); display:flex; align-items:baseline; gap:6px; }
        .logo-hc { font-size:70px; font-weight:700; color:#fff; text-shadow:0 0 40px rgba(255,255,255,.7); }
        .logo-os { font-size:70px; font-weight:700; color:#7CB9FF; text-shadow:0 0 50px rgba(126,180,242,.9); }
        .powered-by { margin-top:20px; font-size:16px; color:rgba(255,255,255,.5); background:rgba(255,255,255,.04); backdrop-filter:blur(16px); padding:8px 28px; border-radius:30px; border:1px solid rgba(255,255,255,.08); }
        .progress-wrapper { margin-top:50px; width:220px; height:4px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.10); opacity:0; transition:opacity .5s; }
        .progress-wrapper.active { opacity:1; }
        .progress-fill { height:100%; width:0%; background:linear-gradient(90deg, rgba(124,185,255,.9), rgba(165,140,255,.95)); border-radius:4px; box-shadow:0 0 20px rgba(124,185,255,.7); transition:width .3s ease; }
        .boot-version { position:absolute; bottom:24px; right:32px; color:rgba(255,255,255,.25); font-size:11px; z-index:15; letter-spacing:.5px; user-select:none; pointer-events:none; }

        .lock-screen { position:fixed; inset:0; z-index:600; display:flex; align-items:center; justify-content:center; background-size:cover; background-position:center; opacity:0; pointer-events:none; transition:opacity .4s ease; backdrop-filter:blur(10px); }
        .lock-screen.active { opacity:1; pointer-events:auto; }
        .lock-screen::before { content:''; position:absolute; inset:0; backdrop-filter:blur(30px) brightness(.5); z-index:0; }
        .lock-card { position:relative; z-index:1; background:rgba(255,255,255,.08); backdrop-filter:blur(60px); border-radius:40px; border:1px solid rgba(255,255,255,.12); box-shadow:0 40px 80px rgba(0,0,0,.5); padding:40px 48px; text-align:center; color:#fff; width:480px; max-width:92vw; display:flex; flex-direction:column; gap:14px; }
        .lock-greeting { font-size:22px; opacity:0.9; font-weight:300; }
        .lock-avatar { width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,var(--primary),#a08bc9); margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:34px; box-shadow:0 12px 30px rgba(0,0,0,.4); }
        .lock-time { font-size:58px; font-weight:300; letter-spacing:4px; text-shadow:0 0 30px rgba(255,255,255,.4); line-height:1; }
        .lock-date { font-size:17px; opacity:.75; }
        .lock-info-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin:4px 0; }
        .lock-info-item { background:rgba(255,255,255,.08); border-radius:16px; padding:8px 4px; backdrop-filter:blur(4px); font-size:13px; }
        .lock-info-item .label { opacity:0.5; font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
        .lock-info-item .value { font-weight:500; }
        .lock-notif-list { background:rgba(0,0,0,.25); border-radius:16px; padding:4px 12px; max-height:80px; overflow-y:auto; text-align:left; font-size:12px; }
        .lock-notif-list .notif-entry { padding:3px 0; border-bottom:1px solid rgba(255,255,255,.05); display:flex; justify-content:space-between; }
        .lock-music { background:rgba(255,255,255,.08); border-radius:16px; padding:8px 14px; display:flex; align-items:center; gap:12px; }
        .lock-music .music-icon { font-size:22px; }
        .lock-music .music-info { flex:1; text-align:left; font-size:13px; }
        .lock-music .music-info .title { font-weight:500; }
        .lock-music .music-info .artist { opacity:0.6; font-size:11px; }
        .lock-music .music-controls button { background:rgba(255,255,255,.12); border:none; border-radius:50%; width:30px; height:30px; color:#fff; font-size:14px; cursor:pointer; transition:.2s; }
        .lock-music .music-controls button:hover { background:rgba(255,255,255,.25); transform:scale(1.05); }
        .lock-input-group { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; position:relative; }
        .lock-input-group input { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:12px 20px; font-size:16px; color:#fff; outline:none; text-align:center; width:200px; transition:.2s; padding-right:40px; }
        .lock-input-group input:focus { border-color:var(--primary); background:rgba(255,255,255,.15); }
        .lock-input-group .toggle-pwd { position:absolute; right:70px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:rgba(255,255,255,0.6); cursor:pointer; font-size:18px; padding:4px; }
        .lock-input-group .toggle-pwd:hover { color:#fff; }
        .lock-input-group button { background:var(--primary); border:none; color:#fff; border-radius:20px; padding:12px 24px; font-size:16px; cursor:pointer; transition:.2s; box-shadow:0 8px 24px rgba(0,0,0,.3); }
        .lock-input-group button:hover { background:var(--primary-hover); transform:scale(1.02); }
        .lock-error { color:#ff7c7c; font-size:13px; min-height:20px; }

        .welcome-screen { position:fixed; inset:0; z-index:250; display:none; flex-direction:column; align-items:center; justify-content:center; transition:opacity .5s ease; background-size:cover; background-position:center; }
        .welcome-screen.active { display:flex; }
        .skip-all { position:absolute; top:24px; right:30px; color:var(--welcome-text); font-size:14px; cursor:pointer; background:var(--welcome-card-bg); backdrop-filter:blur(20px); padding:8px 22px; border-radius:30px; border:1px solid rgba(255,255,255,.6); z-index:30; transition:all .25s; }
        .skip-all:hover { background:rgba(255,255,255,.85); transform:scale(1.02); }
        .welcome-card { background:var(--welcome-card-bg); backdrop-filter:blur(40px); border:1px solid rgba(255,255,255,.4); border-radius:40px; box-shadow:0 30px 80px rgba(0,0,0,.15); padding:48px 56px; width:620px; max-width:92vw; text-align:center; transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1); margin-top:50px; position:relative; z-index:5; color:var(--welcome-text); max-height:85vh; overflow-y:auto; }
        .step-content { transition:opacity .3s ease; animation:fadeSlideUp .3s ease; }
        @keyframes fadeSlideUp { 0% { opacity:0; transform:translateY(12px); } 100% { opacity:1; transform:translateY(0); } }
        .step-title { font-size:32px; font-weight:700; margin-bottom:10px; }
        .step-subtitle { font-size:17px; color:var(--welcome-sub); margin-bottom:30px; }
        .btn-group { display:flex; justify-content:center; gap:16px; margin-top:30px; flex-wrap:wrap; }
        .btn { padding:12px 32px; border-radius:30px; font-size:15px; font-weight:600; border:none; cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1); }
        .btn:active { transform:scale(.95); }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 8px 24px rgba(126,180,242,.35); }
        .btn-primary:hover { background:var(--primary-hover); transform:translateY(-2px); }
        .btn-glass { background:rgba(255,255,255,.5); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.7); color:var(--welcome-text); }
        .btn-glass:hover { background:rgba(255,255,255,.7); }
        .btn-success { background:#2ecc71; color:#fff; box-shadow:0 8px 24px rgba(46,204,113,.35); }
        .btn-success:hover { background:#27ae60; transform:translateY(-2px); }
        .step-dots { display:flex; gap:14px; margin-top:28px; justify-content:center; align-items:center; }
        .dot { width:10px; height:10px; border-radius:50%; background:rgba(44,62,80,.2); transition:all .3s; }
        .dot.active { background:var(--primary); transform:scale(1.5); box-shadow:0 0 0 0 rgba(126,180,242,.7); animation:dotPulse 1.8s infinite; }
        .dot-line { width:24px; height:1.5px; background:rgba(44,62,80,.12); }

        .language-options { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:16px 0 10px; }
        .lang-card { padding:10px 24px; border-radius:30px; background:rgba(255,255,255,0.4); border:2px solid rgba(0,0,0,0.08); cursor:pointer; font-size:16px; font-weight:500; transition:all .25s; color:var(--welcome-text); backdrop-filter:blur(4px); user-select:none; }
        .lang-card:hover { transform:scale(1.04); background:rgba(255,255,255,0.6); }
        .lang-card.selected { border-color:var(--primary); background:rgba(126,180,242,0.25); box-shadow:0 0 0 3px rgba(126,180,242,0.15); transform:scale(1.04); }

        .privacy-scroll { max-height:180px; overflow-y:auto; padding:16px 20px; margin:8px 0 16px; border:2px solid rgba(126,180,242,0.35); border-radius:16px; background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); font-size:14px; line-height:1.7; text-align:left; color:var(--welcome-text); box-shadow:0 2px 12px rgba(0,0,0,0.04); }
        .privacy-scroll::-webkit-scrollbar { width:4px; }
        .privacy-scroll::-webkit-scrollbar-thumb { background:rgba(126,180,242,0.4); border-radius:4px; }

        .wallpaper-options { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:12px 0 6px; }
        .wallpaper-thumb { width:64px; height:64px; border-radius:14px; cursor:pointer; border:3px solid transparent; transition:all .25s; background-size:cover; background-position:center; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .wallpaper-thumb:hover { transform:scale(1.08); box-shadow:0 4px 16px rgba(0,0,0,0.12); }
        .wallpaper-thumb.selected { border-color:var(--primary); transform:scale(1.08); box-shadow:0 0 0 3px rgba(126,180,242,0.2); }

        .color-options { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin:8px 0 4px; }
        .color-dot { width:36px; height:36px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:all .25s; position:relative; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .color-dot:hover { transform:scale(1.12); }
        .color-dot.selected { border-color:#fff; transform:scale(1.12); box-shadow:0 0 0 3px var(--primary), 0 4px 16px rgba(0,0,0,0.12); }

        .nickname-input { padding:12px 20px; border-radius:40px !important; border:2px solid rgba(0,0,0,0.08); background:rgba(255,255,255,0.5); font-size:16px; width:100%; max-width:320px; outline:none; transition:all .25s; color:var(--welcome-text); text-align:center; backdrop-filter:blur(4px); }
        .nickname-input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(126,180,242,0.15); background:rgba(255,255,255,0.7); }
        .avatar-wrapper { cursor:pointer; transition:transform .25s; width:80px; height:80px; border-radius:50%; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.1); border:3px solid rgba(255,255,255,0.3); }
        .avatar-wrapper:hover { transform:scale(1.05); }
        .avatar-wrapper svg { width:100%; height:100%; display:block; }
        .check-icon { font-size:64px; color:#2ecc71; animation:checkPop .5s cubic-bezier(.34,1.56,.64,1); margin-bottom:8px; }

        .pwd-wrapper { position:relative; display:inline-block; width:100%; max-width:320px; }
        .pwd-wrapper input { width:100%; padding:10px 16px; padding-right:40px; border-radius:30px; border:2px solid rgba(0,0,0,0.08); background:rgba(255,255,255,0.5); font-size:15px; color:var(--welcome-text); outline:none; transition:all .25s; }
        .pwd-wrapper input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(126,180,242,0.15); background:rgba(255,255,255,0.7); }
        .pwd-wrapper .toggle-pwd { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:transparent; border:none; cursor:pointer; color:var(--text-secondary); font-size:18px; padding:4px; }
        .pwd-wrapper .toggle-pwd:hover { color:var(--text); }

        .desktop { position:fixed; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column; opacity:0; transition:opacity .3s ease; }
        .desktop.active { display:flex; opacity:1; }

        .taskbar { height:var(--taskbar-height); background:var(--taskbar-bg); backdrop-filter:blur(40px) saturate(1.2); display:flex; align-items:center; padding:0 14px; color:var(--text); font-size:13px; box-shadow:0 1px 0 rgba(0,0,0,0.04); z-index:200; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,0.15); position:relative; }
        .start-btn { background:rgba(91,155,213,.2); border-radius:30px; padding:4px 16px; margin-right:12px; font-weight:700; color:var(--primary); border:none; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:18px; transition:background .2s; flex-shrink:0; }
        .start-btn:hover { background:rgba(91,155,213,.35); }
        .taskbar-apps { display:flex; gap:4px; flex:1; overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:none; -ms-overflow-style:none; padding:2px 4px; justify-content:flex-start; align-items:center; min-width:0; }
        .taskbar-apps::-webkit-scrollbar { display:none; }
        /* ===== 修复：任务栏项样式，防止文字溢出 ===== */
        .taskbar-app { display:flex; align-items:center; gap:4px; padding:2px 10px; background:rgba(255,255,255,.35); border-radius:20px; border:1px solid rgba(255,255,255,.4); cursor:pointer; font-size:12px; color:var(--text); transition:.2s ease; flex:0 1 auto; min-width:32px; max-width:110px; height:28px; position:relative; overflow:hidden; flex-shrink:1; }
        .taskbar-app .icon-img { font-size:12px; flex-shrink:0; }
        .taskbar-app span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
        .taskbar-app:hover { transform:scale(1.04); background:rgba(255,255,255,.6); }
        .taskbar-app.active { background:rgba(126,180,242,.3); border-color:var(--primary); }
        .taskbar-app .running-indicator { position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--primary); opacity:0; transition:opacity .2s; }
        .taskbar-app.active .running-indicator { opacity:1; }
        .taskbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--text-secondary); flex-shrink:0; font-size:13px; }
        .tray-icon { cursor:pointer; padding:4px 6px; border-radius:8px; transition:background .2s; font-size:14px; position:relative; }
        .tray-icon:hover { background:rgba(255,255,255,.3); }
        .tray-icon .badge { position:absolute; top:-4px; right:-4px; background:#e74c3c; color:#fff; font-size:9px; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-weight:600; }
        .taskbar-slider { display:flex; align-items:center; gap:4px; }
        .taskbar-slider input[type="range"] { width:50px; height:3px; -webkit-appearance:none; background:var(--text-secondary); border-radius:2px; outline:none; }
        .taskbar-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px; border-radius:50%; background:var(--primary); cursor:pointer; }
        .show-desktop-btn { background:rgba(255,255,255,0.2); border:none; border-radius:6px; padding:3px 6px; cursor:pointer; color:var(--text); font-size:13px; transition:background .2s; }
        .show-desktop-btn:hover { background:rgba(255,255,255,0.4); }

        .dock-wrapper { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); z-index:199; animation:dockAppear .5s ease; pointer-events:none; }
        .dock { background:var(--dock-bg); backdrop-filter:blur(50px) saturate(1.3); border-radius:30px; border:1px solid rgba(255,255,255,0.20); box-shadow:0 12px 48px rgba(0,0,0,0.20); padding:8px 12px; display:flex; align-items:flex-end; gap:4px; pointer-events:auto; }
        .dock-item { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:4px 8px; border-radius:16px; cursor:pointer; transition:all .15s cubic-bezier(.34,1.56,.64,1); position:relative; min-width:48px; height:var(--dock-item-size); }
        .dock-item .icon-img { font-size:26px; line-height:1; color:var(--text); transition:transform .15s cubic-bezier(.34,1.56,.64,1); }
        .dock-item span { font-size:10px; color:var(--text-secondary); margin-top:2px; opacity:0.85; transition:opacity .2s; white-space:nowrap; font-weight:500; }
        .dock-item:hover { transform:translateY(-8px) scale(1.08); background:rgba(255,255,255,0.15); }
        .dock-item:hover .icon-img { transform:scale(1.15); }
        .dock-item:hover span { opacity:1; }
        .dock-item .dock-indicator { position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--primary); opacity:0; transition:opacity .2s; }
        .dock-item.active .dock-indicator { opacity:1; }

        // ========== 密码存储逻辑 ==========
        function saveSettings() {
            var data = JSON.parse(JSON.stringify(settings));
            if (data.lockPassword && !data.passwordEncoded) {
                data.lockPassword = encodeBase64(data.lockPassword);
                data.passwordEncoded = true;
            } else if (!data.lockPassword) {
                data.passwordEncoded = false;
            }
            safeSetJSON('hcos-settings', data);
        }

        function loadSettings() {
            try {
                var s = safeGetJSON('hcos-settings', null);
                if (s) {
                    settings = Object.assign(settings, s);
                    if (settings.passwordEncoded && settings.lockPassword) {
                        try {
                            settings.lockPassword = decodeBase64(settings.lockPassword);
                            settings.passwordEncoded = false;
                        } catch (e) {
                            settings.lockPassword = '';
                            settings.passwordEncoded = false;
                            console.warn('密码解码失败，已重置');
                        }
                    }
                    if (!settings.desktopPositions) settings.desktopPositions = {};
                    if (!settings.widgets) settings.widgets = [];
                    if (!settings.desktopOrder) settings.desktopOrder = [];
                    if (!settings.bookmarks) settings.bookmarks = [];
                    if (!settings.windowTransparencies) settings.windowTransparencies = {};
                    if (!settings.alwaysOnTop) settings.alwaysOnTop = {};

        function openDB() { return new Promise(function(resolve) { try { var r = indexedDB.open(DB_NAME, 2); r

                        d.createObjectStore(STORE_NAME, { keyPath: 'id' }); if (!d.objectStoreNames.contains(CHUNK_STORE))
                        d.createObjectStore(CHUNK_STORE, { keyPath: ['fileId', 'chunkIndex'] }); }; r.onsuccess =
                    function(e) { db = e.target.result;
                        resolve(db); }; r.onerror = function() { resolve(null); }; } catch (e) { resolve(null); } }); }
        var fileSystem = { version: CURRENT_VERSION, root: { '文档': { type: 'folder', children: { '欢迎.txt': { type: 'file',

                    children: {} }, '桌面': { type: 'folder', children: {} }, '音乐': { type: 'folder', children: {} } } };
        async function loadFS() { try { var dbInstance = await openDB(); if (!dbInstance) return; return new Promise(
                function(resolve) { var tx = dbInstance.transaction(STORE_NAME, 'readonly'); var store = tx
                    .objectStore(STORE_NAME); var req = store.get('filesystem'); req.onsuccess = function() { if (req
                        .result) fileSystem = req.result.data;
                        resolve(); }; req.onerror = function() { resolve(); }; }); } catch (e) {} }

                db = d; } var tx = db.transaction(STORE_NAME, 'readwrite'); var store = tx.objectStore(STORE_NAME); store
                .put({ id: 'filesystem', data: fileSystem }); } catch (e) {} }

                    .length; i++) { if (!current[pathArr[i]] || current[pathArr[i]].type !== 'folder') return null;
                    current = current[pathArr[i]].children; } var file = current[name]; if (!file) return null; if (!file
                    .chunked) return file.content || ''; if (!db) await openDB(); if (!db) return null; var tx = db
                    .transaction(CHUNK_STORE, 'readonly'); var store = tx.objectStore(CHUNK_STORE); var chunks = []; for (
                    var j = 0; j < file.chunks; j++) { var req = store.get([file.id, j]); await new Promise(function(
                        res) { req.onsuccess = function() { chunks[j] = req.result ? req.result.data : '';
                        res(); }; req.onerror = res; }); } return chunks.join(''); } catch (e) { return null; } }
        async function setFileByPath(pathArr, name, content) { try { var current = fileSystem.root; for (var i = 0; i <
                    pathArr.length; i++) { if (!current[pathArr[i]]) current[pathArr[i]] = { type: 'folder',
                        children: {} };
                    current = current[pathArr[i]].children; } var fileId = Date.now().toString(36) + Math.random()
                    .toString(36); var file = { type: 'file', content: '', id: fileId, chunked: false, chunks: 0,
                    size: content.length, modified: new Date().toISOString() }; if (content.length <= CHUNK_SIZE) {
                    file.content = content; } else { if (!db) await openDB(); if (!db) return; var tx = db
                        .transaction(CHUNK_STORE, 'readwrite'); var store = tx.objectStore(CHUNK_STORE); var chunks =
                        Math.ceil(content.length / CHUNK_SIZE);

                    file.chunks = chunks; for (var j = 0; j < chunks; j++) { store.put({ fileId: fileId,

                    current = current[pathArr[i]].children; } if (current[name]) { if (current[name].type === 'file') {

                        walk(item.children, path + key + '/'); } } } walk(fileSystem.root, ''); return files; }

            toast.className = 'toast';

            document.getElementById('toastContainer').appendChild(toast);

                    cat + ' (' + items.length + ')</div><div class="notif-group-body" style="display:none;padding-left:8px;">';

                        n.time + '</span></div>'; });

            list.innerHTML = html || '<div class="notification-item" style="font-size:12px;">暂无通知</div>';

        // -------- 窗口管理 --------
        var windows = [],

            appRegistry[id] = config; }

        function stableStringify(obj) { if (obj === undefined || obj === null) return 'null'; if (typeof obj === 'string')
                return JSON.stringify(obj); if (typeof obj === 'object') { var sorted = {};
                Object.keys(obj).sort().forEach(function(k) { sorted[k] = obj[k]; }); return JSON.stringify(sorted); }

        function saveSession() {
            var session = windows.filter(function(w) { return w.parentNode; }).map(function(w) {
                return { appId: w.dataset.app, params: w.dataset.params || '', left: w.style.left, top: w.style.top,
                    width: w.style.width, height: w.style.height, minimized: w.style.display === 'none',

        function findAvailablePosition(width, height) {
            var sw = window.innerWidth,
                sh = window.innerHeight - 48 - 64;
            var existing = windows.filter(function(w) { return w.parentNode && w.style.display !== 'none'; });
            var positions = existing.map(function(w) { var rect = w.getBoundingClientRect(); return { left: rect.left,
                    top: rect.top, width: rect.width, height: rect.height }; });
            var centerX = (sw - width) / 2,
                centerY = (sh - height) / 2;
            var step = 28,
                maxSteps = 120;
            for (var i = 0; i < maxSteps; i++) {
                var angle = i * 0.45;
                var radius = i * step / 8;
                var x = centerX + radius * Math.cos(angle);
                var y = centerY + radius * Math.sin(angle);
                x = Math.max(10, Math.min(x, sw - width - 10));
                y = Math.max(10, Math.min(y, sh - height - 20));
                var overlapping = false;
                for (var j = 0; j < positions.length; j++) { var p = positions[j]; if (x < p.left + p.width + 10 && x +
                        width + 10 > p.left && y < p.top + p.height + 10 && y + height + 10 > p.top) { overlapping =
                        true; break; } }
                if (!overlapping) { return { left: x, top: y }; }
            }
            return { left: Math.random() * (sw - width - 20) + 10, top: Math.random() * (sh - height - 30) + 10 };
        }

        function createWindow(appId, title, params) {
            var win = document.createElement('div');
            win.className = 'window active';
            win.dataset.app = appId;

            win._id = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            win.style.zIndex = ++zIndexCounter;
            var defaultWidth = 400,
                defaultHeight = 320;
            var pos = findAvailablePosition(defaultWidth, defaultHeight);
            win.style.left = pos.left + 'px';
            win.style.top = pos.top + 'px';
            win.style.width = defaultWidth + 'px';
            win.style.height = defaultHeight + 'px';
            var iconHtml = appRegistry[appId] ? appRegistry[appId].icon : '<i class="fas fa-cube"></i>';
            var loadingHTML = '<div class="app-loading"><div class="spinner"></div><span>正在启动 ' + title + '...</span></div>';
            win.innerHTML =
                '<div class="window-title"><div class="title-left"><span class="icon-img">' + iconHtml +
                '</span><span class="title-text">' + title +
                '</span><span class="help-btn"><i class="fas fa-question-circle"></i></span></div><div class="window-controls"><button data-action="minimize"><i class="fas fa-minus"></i></button><button data-action="maximize"><i class="fas fa-expand"></i></button><button data-action="close"><i class="fas fa-times"></i></button></div></div><div class="window-content">' +
                loadingHTML + '<div class="window-help-overlay" id="helpOverlay_' + win._id +
                '"><div class="window-help-card"><h3 id="helpTitle_' + win._id +
                '"><i class="fas fa-question-circle"></i> 帮助</h3><div id="helpContent_' + win._id +
                '"><p>加载中...</p></div><button class="close-help" data-winid="' + win._id +
                '">知道了</button></div></div></div><div class="resize-handle"></div>';
            document.body.appendChild(win);

            var titleBar = win.querySelector('.window-title');
            titleBar.addEventListener('dblclick', function(e) {
                var maxBtn = win.querySelector('[data-action="maximize"]');
                if (maxBtn) maxBtn.click();
            });

            titleBar.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                bringToFront(win, false);
                if (win.dataset.prevSize) return;
                initDrag(e, win);
            });

            win.querySelector('[data-action="close"]').addEventListener('click', function(e) { e.stopPropagation();
                closeWindow(win); });
            win.querySelector('[data-action="minimize"]').addEventListener('click', function(e) { e.stopPropagation();
                minimizeWindow(win); });

            win.querySelector('[data-action="maximize"]').addEventListener('click', function(e) {
                e.stopPropagation();
                if (win.dataset.prevSize) {
                    var taskbar = document.getElementById('taskbar');
                    var dock = document.querySelector('.dock-wrapper');
                    if (taskbar) taskbar.style.display = '';
                    if (dock) dock.style.display = '';
                    var p = JSON.parse(win.dataset.prevSize);
                    win.style.position = 'absolute';
                    win.style.left = p.left;
                    win.style.top = p.top;
                    win.style.width = p.width;
                    win.style.height = p.height;
                    win.style.borderRadius = 'var(--radius)';
                    delete win.dataset.prevSize;
                    win.classList.remove('maximized');
                    win.querySelector('[data-action="maximize"] i').className = 'fas fa-expand';
                } else {
                    var taskbar = document.getElementById('taskbar');
                    var dock = document.querySelector('.dock-wrapper');
                    if (taskbar) taskbar.style.display = 'none';
                    if (dock) dock.style.display = 'none';
                    win.dataset.prevSize = JSON.stringify({
                        left: win.style.left,
                        top: win.style.top,
                        width: win.style.width,
                        height: win.style.height,
                        position: win.style.position || 'absolute'
                    });
                    win.style.position = 'fixed';
                    win.style.left = '0px';
                    win.style.top = '0px';
                    win.style.width = '100vw';
                    win.style.height = '100vh';

                    win.classList.add('maximized');

            win.addEventListener('mousedown', function(e) { if (e.target.closest('.window-title')) return;

            var resizeHandle = win.querySelector('.resize-handle');

            win.querySelector('.window-title').addEventListener('contextmenu', function(e) {

                        .preventDefault();

            var ro = new ResizeObserver(function() { var ev = new Event('resize');
                win.querySelector('.window-content').dispatchEvent(ev); });
            ro.observe(win.querySelector('.window-content'));
            win._resizeObserver = ro;
            return win;
        }

        // -------- 拖拽定位 --------
        function initDrag(e, win) {
            if (win.dataset.prevSize) return;
            win.classList.add('dragging');
            var rect = win.getBoundingClientRect(),
                offX = e.clientX - rect.left,
                offY = e.clientY - rect.top,
                startX = e.clientX,
                startY = e.clientY;
            var startLeft = rect.left,
                startTop = rect.top;

            var mv = function(e) {
                var newLeft = startLeft + e.clientX - startX;
                var newTop = startTop + e.clientY - startY;
                var maxX = window.innerWidth - parseInt(win.style.width) - 10;
                var maxY = window.innerHeight - 48 - 64 - parseInt(win.style.height) - 10;
                newLeft = Math.max(0, Math.min(newLeft, maxX));
                newTop = Math.max(0, Math.min(newTop, maxY));
                win.style.left = newLeft + 'px';
                win.style.top = newTop + 'px';

                var wW = window.innerWidth,
                    wH = window.innerHeight - 48 - 64;
                var threshold = 30;
                if (e.clientX < threshold && e.clientY < threshold) {
                    win.style.left = '0px';
                    win.style.top = '0px';
                    win.style.width = (wW / 2) + 'px';
                    win.style.height = (wH / 2) + 'px';
                } else if (e.clientX > wW - threshold && e.clientY < threshold) {
                    win.style.left = (wW / 2) + 'px';
                    win.style.top = '0px';
                    win.style.width = (wW / 2) + 'px';
                    win.style.height = (wH / 2) + 'px';
                } else if (e.clientX < threshold && e.clientY > wH - threshold) {
                    win.style.left = '0px';
                    win.style.top = (wH / 2) + 'px';
                    win.style.width = (wW / 2) + 'px';
                    win.style.height = (wH / 2) + 'px';
                } else if (e.clientX > wW - threshold && e.clientY > wH - threshold) {
                    win.style.left = (wW / 2) + 'px';
                    win.style.top = (wH / 2) + 'px';
                    win.style.width = (wW / 2) + 'px';
                    win.style.height = (wH / 2) + 'px';
                } else if (e.clientX < threshold) {
                    win.style.left = '0px';
                    win.style.width = (wW / 2) + 'px';
                    win.style.height = (wH) + 'px';
                } else if (e.clientX > wW - threshold) {
                    win.style.left = (wW / 2) + 'px';
                    win.style.width = (wW / 2) + 'px';
                    win.style.height = (wH) + 'px';
                } else if (e.clientY < threshold) {
                    win.style.top = '0px';
                    win.style.width = (wW) + 'px';
                    win.style.height = (wH / 2) + 'px';
                } else if (e.clientY > wH - threshold) {
                    win.style.top = (wH / 2) + 'px';
                    win.style.width = (wW) + 'px';
                    win.style.height = (wH / 2) + 'px';
                }
            };

            var up = function() {
                document.removeEventListener('mousemove', mv);
                document.removeEventListener('mouseup', up);
                win.classList.remove('dragging');
                saveSession();
            };
            document.addEventListener('mousemove', mv);
            document.addEventListener('mouseup', up);
        }

        function initResize(e, win) {
            e.stopPropagation();
            var startX = e.clientX,
                startY = e.clientY;
            var startW = parseInt(getComputedStyle(win).width);
            var startH = parseInt(getComputedStyle(win).height);
            var mv = function(ev) {
                var newW = Math.max(280, startW + ev.clientX - startX);
                var newH = Math.max(180, startH + ev.clientY - startY);
                win.style.width = newW + 'px';
                win.style.height = newH + 'px';
            };
            var up = function() {
                document.removeEventListener('mousemove', mv);
                document.removeEventListener('mouseup', up);
                var ev = new Event('resize');
                win.querySelector('.window-content').dispatchEvent(ev);
                saveSession();
            };
            document.addEventListener('mousemove', mv);
            document.addEventListener('mouseup', up);
        }

                (isOnTop ? '取消置顶' : '始终置顶') +

                opacityPercent +

            m.style.left = Math.min(x, window.innerWidth - 180) + 'px';

                        .style.display = 'flex';

            var opacitySlider = m.querySelector('input[type="range"]');

            opacitySlider.addEventListener('input', function() {

            });
            document.addEventListener('click', function closeCtx() { m.style.display = 'none';
                document.removeEventListener('click', closeCtx); });
        }

        function minimizeWindow(win) {
            win.classList.add('minimizing');
            setTimeout(function() {
                win.style.display = 'none';
                win.classList.remove('minimizing');
                win.classList.remove('active');
                win.classList.remove('focused');
                updateTaskbarApps();
                saveSession();

        function closeWindow(win) {
            if (win._keydownHandler) document.removeEventListener('keydown', win._keydownHandler);
            if (win._taskmgrInterval) clearInterval(win._taskmgrInterval);
            if (win._uptimeInterval) clearInterval(win._uptimeInterval);
            if (win._clockInterval) clearInterval(win._clockInterval);
            if (win._monitorInterval) clearInterval(win._monitorInterval);
            if (win._browserCheckInterval) clearInterval(win._browserCheckInterval);
            if (win._previewInterval) clearInterval(win._previewInterval);
            if (win._resizeObserver) win._resizeObserver.disconnect();
            var id = win._id;
            if (settings.windowTransparencies) delete settings.windowTransparencies[id];
            if (settings.alwaysOnTop) delete settings.alwaysOnTop[id];
            saveSettings();
            windows = windows.filter(function(w) { return w !== win; });
            win.classList.add('closing');
            setTimeout(function() {
                if (win.parentNode) win.remove();
                updateTaskbarApps();
                saveSession();
                var overlay = document.getElementById('taskViewOverlay'); if (overlay.classList.contains('active')) {
                    openTaskView(); }

        }

        function bringToFront(win, hideOthers) {
            if (hideOthers === undefined) hideOthers = true;
            if (!win.parentNode) return;
            if (win.style.display === 'none') { win.style.display = 'flex';
                win.classList.add('active'); }
            if (settings.alwaysOnTop && settings.alwaysOnTop[win._id]) {
                win.style.zIndex = 500;
            } else {
                win.style.zIndex = ++zIndexCounter;
            }
            win.classList.add('focused');
            if (hideOthers) { windows.forEach(function(w) { if (w !== win) { w.classList.remove('focused'); } }); }
            win.classList.add('active');
            updateTaskbarApps();
            saveSession();
        }

        var _openAppPending = {};

        function openApp(appId, params, forceMulti) {
            forceMulti = forceMulti || false;
            var app = appRegistry[appId];
            if (!app) { console.warn('应用未注册:', appId); return; }
            var key = appId + '_' + stableStringify(params);
            if (_openAppPending[key]) return;
            _openAppPending[key] = true;
            setTimeout(function() { _openAppPending[key] = false; }, 400);
            if (!forceMulti && !app.multiInstance) {
                var existing = windows.find(function(w) {
                    if (w.dataset.app !== appId) return false;
                    var wParams = w.dataset.params || 'null';
                    var p = (params !== undefined && params !== null) ? stableStringify(params) : 'null';
                    return wParams === p;
                });
                if (existing) { bringToFront(existing, true); return; }
            }
            var instanceId = Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            var title = typeof app.title === 'function' ? (app.title(params) || appId) : (app.title || appId);
            var sameAppWindows = windows.filter(function(w) { return w.dataset.app === appId; });
            if (sameAppWindows.length > 0 && (forceMulti || app.multiInstance)) { title += ' (' + (sameAppWindows.length +
                    1) + ')'; }
            var win = createWindow(appId, title, params);
            win.dataset.instanceId = instanceId;
            windows.push(win);
            requestAnimationFrame(function() { win.classList.add('active');
                win.classList.add('focused'); });
            setTimeout(function() {
                try {
                    var contentDiv = win.querySelector('.window-content');
                    var helpOverlay = contentDiv.querySelector('.window-help-overlay');
                    contentDiv.innerHTML = '';
                    if (helpOverlay) {
                        contentDiv.appendChild(helpOverlay);
                    }
                    if (typeof app.bind === 'function') {
                        app.bind(win, params);
                    } else {
                        contentDiv.innerHTML =
                            '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;color:var(--text-secondary);">' +
                            (t(appId) || appId) + '</div>';
                    }
                    var ev = new Event('resize');
                    contentDiv.dispatchEvent(ev);
                } catch (e) {
                    console.error('应用启动错误:', e);
                    var contentDiv2 = win.querySelector('.window-content');
                    contentDiv2.innerHTML =
                        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);padding:20px;text-align:center;flex-direction:column;gap:8px;"><i class="fas fa-exclamation-triangle" style="font-size:32px;"></i><span>应用加载失败，请重试</span></div>';
                }
                updateTaskbarApps();
                saveSession();
            }, 300);
            updateTaskbarApps();
            saveSession();
            return win;
        }

            container.innerHTML = '';
            var activeWindows = windows.filter(function(w) { return w.parentNode; });

                var selectedCount = document.getElementById('taskSelectedCount');

                uniqueWindows.forEach(function(win, index) {
                    var appDef = appRegistry[win.dataset.app];
                    var icon = appDef ? appDef.icon : '<i class="fas fa-cube"></i>';
                    var title = win.querySelector('.window-title .title-text') ? win.querySelector(
                        '.window-title .title-text').textContent : win.dataset.app;
                    var sameApp = uniqueWindows.filter(function(w) { return w.dataset.app === win.dataset.app; });
                    if (sameApp.length > 1) { var idx = sameApp.indexOf(win) + 1;
                        title = title.replace(/ \(\d+\)$/, '') + ' (' + idx + ')'; }
                    var div = document.createElement('div');
                    div.className = 'task-view-item';
                    div.style.transitionDelay = (index * 0.05) + 's';
                    div.innerHTML =
                        '<div class="icon">' + icon + '</div><div class="title">' + title +
                        '</div><div class="preview">' + icon +
                        '</div><button class="close-btn" data-window-id="' + win._id + '">✕</button>' +
                        '<div class="checkbox-wrap"><input type="checkbox" data-window-id="' + win._id +
                        '"></div>';
                    div.addEventListener('click', function(e) {

                        bringToFront(win, true);
                        overlay.classList.remove('active');
                    });
                    var closeBtn = div.querySelector('.close-btn');
                    closeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();

                        var targetWin = windows.find(function(w) { return w._id === winId; });
                        if (targetWin) { closeWindow(targetWin);

                    var cb = div.querySelector('input[type="checkbox"]');

                function updateSelectedCount() {
                    var checked = document.querySelectorAll('#taskViewContainer input[type="checkbox"]:checked')
                        .length;

                    var checkedAll = document.querySelectorAll(
                        '#taskViewContainer input[type="checkbox"]:checked');
                    selectAll.checked = (all.length > 0 && checkedAll.length === all.length);
                }

                selectAll.onchange = function() {

                    cb) {

                        '#taskViewContainer input[type="checkbox"]:checked');

                        pushNotification('任务视图', '请至少选择一个窗口');
                        return;

                    if (confirm('确定关闭所选 ' + selected.length + ' 个窗口吗？')) {

                        t('right_tile') +

                        t('quarter_tile') + '</div>';
                    m.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
                    m.style.top = Math.min(e.clientY, window.innerHeight - 180) + 'px';
                    m.style.display = 'block';
                    m.querySelector('[data-action="restore"]').onclick = function() { bringToFront(win, true);
                        m.style.display = 'none'; };
                    m.querySelector('[data-action="minimize"]').onclick = function() { minimizeWindow(win);
                        m.style.display = 'none'; };
                    m.querySelector('[data-action="close"]').onclick = function() { closeWindow(win);
                        m.style.display = 'none'; };
                    m.querySelector('[data-action="new"]').onclick = function() { openApp(win.dataset.app, null,
                            true);
                        m.style.display = 'none'; };
                    m.querySelector('[data-action="left-tile"]').onclick = function() {
                        var wW = window.innerWidth,
                            wH = window.innerHeight - 48 - 64;

        // -------- 渲染桌面图标 --------
        function renderDesktopIcons() {
            ensureAllAppsRegistered();
            var container = document.getElementById('desktopIcons');
            if (!container) return;
            container.innerHTML = '';
            var order = (settings.desktopOrder && settings.desktopOrder.length) ? settings.desktopOrder :
                desktopIconList;
            desktopIconList.forEach(function(id) { if (!order.includes(id)) { order.push(id); } });
            order = order.filter(function(id) { return desktopIconList.includes(id); });
            order = [...new Set(order)];
            settings.desktopOrder = order;
            saveSettings();

            var positions = settings.desktopPositions || {};
            var containerWidth = container.clientWidth || window.innerWidth;
            var gridSize = 72,
                padding = 12,
                iconWidth = 64;
            var cols = Math.max(1, Math.floor((containerWidth - padding * 2) / gridSize));
            var gridSlots = [];
            for (var row = 0; row < 20; row++) { for (var col = 0; col < cols; col++) { gridSlots.push({ x: padding +
                            col * gridSize, y: padding + row * gridSize }); } }
            var usedPositions = [];
            var needAssign = [];
            order.forEach(function(appId) {
                var def = appRegistry[appId];
                if (!def) return;
                var pos = positions[appId];
                if (pos && pos.x >= 0 && pos.y >= 0 && pos.x + iconWidth <= containerWidth - padding && !usedPositions
                    .some(function(p) { return Math.abs(p.x - pos.x) < 5 && Math.abs(p.y - pos.y) < 5; })) {
                    usedPositions.push({ x: pos.x, y: pos.y, appId: appId });
                } else { needAssign.push(appId); }
            });
            var slotIndex = 0;
            needAssign.forEach(function(appId) {
                var def = appRegistry[appId];
                if (!def) return;
                var assigned = false;
                while (slotIndex < gridSlots.length) {
                    var slot = gridSlots[slotIndex];
                    var occupied = usedPositions.some(function(p) { return Math.abs(p.x - slot.x) < 5 && Math
                            .abs(p.y - slot.y) < 5; });
                    if (!occupied) { positions[appId] = { x: slot.x, y: slot.y };
                        usedPositions.push({ x: slot.x, y: slot.y, appId: appId });
                        slotIndex++;
                        assigned = true; break; }
                    slotIndex++;
                }
                if (!assigned) { var last = usedPositions[usedPositions.length - 1]; var newX = (last ? last.x +
                        gridSize : padding); if (newX + iconWidth > containerWidth - padding) newX = padding;
                    var newY = (last ? last.y + gridSize : padding);
                    positions[appId] = { x: newX, y: newY };
                    usedPositions.push({ x: newX, y: newY, appId: appId }); }
            });
            settings.desktopPositions = positions;
            saveSettings();
            order.forEach(function(appId) {
                var def = appRegistry[appId];
                if (!def) return;
                var pos = positions[appId] || { x: padding, y: padding };
                var div = document.createElement('div');
                div.className = 'desktop-icon';
                div.dataset.app = appId;
                var title = typeof def.title === 'function' ? (def.title() || appId) : (def.title || appId);
                var nameSpan = document.createElement('span');
                nameSpan.textContent = title;
                nameSpan.dataset.appId = appId;
                nameSpan.className = 'icon-name';
                div.innerHTML = '<span class="icon-img">' + def.icon + '</span>';
                div.appendChild(nameSpan);
                div.style.left = pos.x + 'px';
                div.style.top = pos.y + 'px';

                nameSpan.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    var currentName = this.textContent;
                    var input = document.createElement('input');
                    input.type = 'text';
                    input.value = currentName;
                    input.style.cssText =
                        'font-size:10px;color:var(--text);background:rgba(255,255,255,0.9);border:1px solid var(--primary);border-radius:10px;padding:0 6px;width:56px;text-align:center;outline:none;font-weight:500;height:20px;';
                    this.style.display = 'none';
                    this.parentNode.appendChild(input);
                    input.focus();
                    input.select();
                    input.addEventListener('blur', function() {
                        var newName = this.value.trim() || currentName;
                        if (appRegistry[appId]) {
                            appRegistry[appId].title = function() { return newName; };
                            var span = this.parentNode.querySelector('.icon-name');
                            span.textContent = newName;
                            span.style.display = 'block';
                            updateTaskbarApps();
                            windows.forEach(function(w) {
                                if (w.dataset.app === appId) {
                                    var titleSpan = w.querySelector(
                                        '.window-title .title-text');
                                    if (titleSpan) {
                                        var sameApp = windows.filter(function(ww) {
                                            return ww.dataset.app === appId;
                                        });
                                        if (sameApp.length > 1) {
                                            var idx = sameApp.indexOf(w) + 1;
                                            titleSpan.textContent = newName + ' (' +
                                                idx + ')';
                                        } else {
                                            titleSpan.textContent = newName;
                                        }

                            var parent = this.parentNode;

                            this.remove();

                });

                var clickTimer = null;
                div.addEventListener('click', function(e) {
                    if (e.target.closest('input')) return;

                    .app; });

        function makeWidgetDraggable(widget) {
            var isDragging = false,
                startX = 0,
                startY = 0,
                origLeft = 0,
                origTop = 0;

            function onStart(e) { if (e.target.closest('.widget-close') || e.target.closest(
                    '.widget-resize-handle')) return;
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                origLeft = parseInt(widget.style.left) || 0;
                origTop = parseInt(widget.style.top) || 0;
                isDragging = true;
                widget.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd); }

            function onMove(e) { if (!isDragging) return; var dx = e.clientX - startX,
                    dy = e.clientY - startY;
                widget.style.left = (origLeft + dx) + 'px';
                widget.style.top = (origTop + dy) + 'px';
                widget.style.right = 'auto'; }

            function onEnd(e) { if (!isDragging) return;
                isDragging = false;
                widget.style.cursor = 'default';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                var id = widget.dataset.widgetId;
                var w = settings.widgets.find(function(ww) { return ww.id === id; }); if (w) { w.left = parseInt(widget
                        .style.left);
                    w.top = parseInt(widget.style.top);
                    saveSettings(); } }
            widget.addEventListener('mousedown', onStart);
            widget.addEventListener('touchstart', function(e) {
                if (e.target.closest('.widget-close') || e.target.closest('.widget-resize-handle')) return;
                var touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                origLeft = parseInt(widget.style.left) || 0;
                origTop = parseInt(widget.style.top) || 0;
                isDragging = true;
                widget.style.cursor = 'grabbing';
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd, { passive: false });
            }, { passive: true });

            function onTouchMove(e) { if (!isDragging) return;
                e.preventDefault();
                var touch = e.touches[0];
                var dx = touch.clientX - startX,
                    dy = touch.clientY - startY;
                widget.style.left = (origLeft + dx) + 'px';
                widget.style.top = (origTop + dy) + 'px';
                widget.style.right = 'auto'; }

            function onTouchEnd(e) { if (!isDragging) return;
                isDragging = false;
                widget.style.cursor = 'default';
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
                var id = widget.dataset.widgetId;
                var w = settings.widgets.find(function(ww) { return ww.id === id; }); if (w) { w.left = parseInt(widget
                        .style.left);
                    w.top = parseInt(widget.style.top);
                    saveSettings(); } }
        }

        function initWidgetResize(widget, wData) {

                e.stopPropagation();
                startX = e.clientX;
                startY = e.clientY;
                startW = parseInt(widget.style.width) || wData.width;
                startH = parseInt(widget.style.height) || wData.height;
                var mv = function(ev) { var newW = Math.max(100, startW + ev.clientX - startX); var newH = Math
                        .max(70, startH + ev.clientY - startY);
                    widget.style.width = newW + 'px';
                    widget.style.height = newH + 'px'; };
                var up = function() { document.removeEventListener('mousemove', mv);
                    document.removeEventListener('mouseup', up);
                    var id = widget.dataset.widgetId;
                    var w = settings.widgets.find(function(ww) { return ww.id === id; }); if (w) { w.width = parseInt(
                            widget.style.width);
                        w.height = parseInt(widget.style.height);
                        saveSettings(); } };
                document.addEventListener('mousemove', mv);
                document.addEventListener('mouseup', up);
            });

        function bindWidgetContent(wData) {
            var type = widgetTypes[wData.type];
            if (!type) return;
            if (wData.type === 'clock') {
                var canvas = document.getElementById('widgetClockCanvas_' + wData.id);
                var digitalEl = document.getElementById('widgetClockDigital_' + wData.id);
                var tzEl = document.getElementById('widgetClockTz_' + wData.id);
                if (canvas) {
                    var ctx = canvas.getContext('2d');
                    var size = 90;

                    function drawClock() {
                        var offset = parseInt(settings.timezone.replace('UTC', ''));
                        var localTime = getTimeWithTimezone(offset);
                        var h = localTime.getHours() % 12,
                            m = localTime.getMinutes(),
                            s = localTime.getSeconds();
                        var radius = size / 2 - 6,
                            cx = size / 2,
                            cy = size / 2;
                        ctx.clearRect(0, 0, size, size);
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(200,200,200,0.4)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        for (var i = 0; i < 12; i++) { var angle = i * Math.PI / 6 - Math.PI / 2; var len = i % 3 ===
                                0 ? 5 : 3;
                            ctx.beginPath();
                            ctx.moveTo(cx + (radius - 6) * Math.cos(angle), cy + (radius - 6) * Math.sin(angle));
                            ctx.lineTo(cx + (radius - 6 + len) * Math.cos(angle), cy + (radius - 6 + len) * Math
                                .sin(angle));
                            ctx.strokeStyle = 'rgba(80,80,80,0.7)';
                            ctx.lineWidth = i % 3 === 0 ? 2 : 1;
                            ctx.stroke(); if (i % 3 === 0) { var num = i === 0 ? 12 : i;
                                ctx.fillStyle = 'rgba(60,60,60,0.8)';
                                ctx.font = '8px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(num, cx + (radius - 12) * Math.cos(angle), cy + (radius - 12) * Math
                                    .sin(angle)); } }
                        var hourAngle = (h + m / 60) * Math.PI / 6 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.4 * Math.cos(hourAngle), cy + radius * 0.4 * Math.sin(
                        hourAngle));
                        ctx.strokeStyle = '#2c3e7a';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        var minAngle = (m + s / 60) * Math.PI / 30 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.6 * Math.cos(minAngle), cy + radius * 0.6 * Math.sin(
                        minAngle));
                        ctx.strokeStyle = '#444';
                        ctx.lineWidth = 1.8;
                        ctx.stroke();
                        var secAngle = s * Math.PI / 30 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.7 * Math.cos(secAngle), cy + radius * 0.7 * Math.sin(
                        secAngle));
                        ctx.strokeStyle = '#e74c3c';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
                        ctx.fillStyle = '#e74c3c';
                        ctx.fill();
                        if (digitalEl) digitalEl.textContent = localTime.toLocaleTimeString('zh-CN', { hour12: false });
                        if (tzEl) tzEl.textContent = settings.timezone;
                    }
                    drawClock();
                    if (wData._clockInterval) clearInterval(wData._clockInterval);
                    wData._clockInterval = setInterval(drawClock, 1000);
                }
            } else if (wData.type === 'weather') {
                var iconEl = document.getElementById('widgetWeatherIcon_' + wData.id);
                var tempEl = document.getElementById('widgetWeatherTemp_' + wData.id);
                var descEl = document.getElementById('widgetWeatherDesc_' + wData.id);
                var humEl = document.getElementById('widgetWeatherHum_' + wData.id);
                var aqiEl = document.getElementById('widgetWeatherAqi_' + wData.id);
                if (iconEl) {
                    async function updateWeather() {
                        try {
                            var resp = await fetch(
                                'https://api.open-meteo.com/v1/forecast?latitude=31.2&longitude=121.5&current_weather=true'
                                );
                            if (!resp.ok) throw new Error('API失败');
                            var data = await resp.json();
                            var cur = data.current_weather;
                            if (!cur) throw new Error('无数据');
                            var wcode = cur.weathercode;
                            var icon = '☀️',
                                desc = '晴朗';
                            if (wcode <= 3) { icon = '⛅';
                                desc = '多云'; } else if (wcode <= 48) { icon = '🌫️';
                                desc = '雾'; } else if (wcode <= 55) { icon = '🌦️';
                                desc = '毛毛雨'; } else if (wcode <= 65) { icon = '🌧️';
                                desc = '雨'; } else if (wcode <= 77) { icon = '❄️';
                                desc = '雪'; } else if (wcode <= 82) { icon = '🌦️';
                                desc = '阵雨'; } else if (wcode <= 86) { icon = '🌨️';
                                desc = '阵雪'; } else if (wcode <= 99) { icon = '⛈️';
                                desc = '雷暴'; }
                            iconEl.textContent = icon;
                            tempEl.textContent = Math.round(cur.temperature) + '°C';
                            descEl.textContent = desc;
                            var hum = Math.round(Math.random() * 40 + 45);
                            humEl.textContent = '💧 ' + hum + '%';
                            var aqi = ['优', '良', '轻度污染'][Math.floor(Math.random() * 3)];
                            aqiEl.textContent = '🌿 ' + aqi;
                        } catch (e) { iconEl.textContent = '⚠️';
                            tempEl.textContent = '--°C';
                            descEl.textContent = '加载失败'; }
                    }
                    updateWeather();
                    if (wData._weatherInterval) clearInterval(wData._weatherInterval);
                    wData._weatherInterval = setInterval(updateWeather, 600000);
                }
            }
        }

        function addWidget(type) { var def = widgetTypes[type]; if (!def) return; var id = 'widget_' + Date.now();

        function ensureDefaultWidgets() {

                    150, top: wh - 260, width: 120, height: 120 }); }
            if (!hasWeather) { settings.widgets.push({ id: 'widget_weather_' + Date.now(), type: 'weather', left: ww -
                    170, top: wh - 130, width: 140, height: 120 }); }

            if (clock && clock.id.startsWith('widget_clock_')) { clock.left = ww - 150;
                clock.top = wh - 260; }

                weather.top = wh - 130; }
            saveSettings();
            renderWidgets();
        });

        // -------- 系统信息 --------
        function getSystemUptime() { var uptime = Math.floor(performance.now() / 1000); var h = Math.floor(uptime /
            3600); var m = Math.floor((uptime % 3600) / 60); var s = uptime % 60; return h + 'h ' + m + 'm ' + s +

                ['日', '一', '二', '三', '四', '五', '六'].forEach(function(d) { html +=

                        month = 0;

                content.querySelectorAll('.cal-cell').forEach(function(el) {

        // -------- Music --------
        function bindMusic(win) {

            var audio = content.querySelector('#musicAudio');

            function renderPlaylist() {

                        (idx === currentIndex ? 'background:rgba(126,180,242,0.3);' : '') + '" data-idx="' + idx +
                        '"><span>' + item.name + '</span><span style="color:var(--text-secondary);font-size:10px;">' +
                        (idx === currentIndex ? '▶' : '') + '</span></div>'; }).join('');
                playlistDiv.querySelectorAll('[data-idx]').forEach(function(el) {

                if (playlist.length === 0) playlistDiv.innerHTML =
                    '<div style="opacity:0.5;padding:8px;">暂无歌曲，点击导入歌曲添加</div>';
            }

            function playCurrent() {
                if (currentIndex < 0 || currentIndex >= playlist.length) return;
                var item = playlist[currentIndex];
                if (item.dataUrl) {
                    audio.src = item.dataUrl;
                    audio.play().catch(function() {});
                    nowPlaying.textContent = '正在播放: ' + item.name;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    renderPlaylist();

                                renderPlaylist();

                    })();

            }

            function nextTrack() {
                if (playlist.length === 0) return;
                if (shuffle) {
                    var idx = Math.floor(Math.random() * playlist.length);
                    while (idx === currentIndex && playlist.length > 1) idx = Math.floor(Math.random() * playlist
                        .length);
                    currentIndex = idx;
                } else {
                    currentIndex = (currentIndex + 1) % playlist.length;
                }
                playCurrent();
            }
            audio.addEventListener('ended', function() { if (loop) { audio.currentTime = 0;
                    audio.play(); } else { nextTrack(); } });
            audio.addEventListener('play', function() { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
            audio.addEventListener('pause', function() { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });
            playBtn.addEventListener('click', function() { if (currentIndex < 0 && playlist.length > 0) { currentIndex =

            prevBtn.addEventListener('click', function() { if (playlist.length === 0) return;

                    audio.volume = val / 100;

                    saveSettings(); });
            }
            importBtn.addEventListener('click', function() { var input = document.createElement('input');
                input.type = 'file';
                input.accept = 'audio/*';
                input.multiple = true;
                input.onchange = function() { var files = this.files; for (var f = 0; f < files.length; f++) { var
                            file = files[f]; var reader = new FileReader();
                        reader.onload = function(ev) { var dataUrl = ev.target.result; var fileName = file
                                .name;

                                currentIndex = 0;

                            pushNotification('音乐播放器', '已导入 ' + fileName); };
                        reader.readAsDataURL(file); } };
                input.click(); });
            renderPlaylist();
            if (playlist.length > 0 && currentIndex === -1) currentIndex = 0;
            if (currentIndex >= 0) playCurrent();
            audio.volume = settings.volume;
            volSlider.value = Math.round(settings.volume * 100);
        }

        // -------- Clock --------
        function bindClock(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML =
                '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:10px;"><canvas id="clockCanvas" width="180" height="180" style="width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.05);"></canvas><div style="font-size:28px;font-weight:300;margin-top:6px;" id="clockDigitalFull">00:00:00</div><div style="font-size:14px;color:var(--text-secondary);margin-top:2px;" id="clockTzFull">' +
                settings.timezone + '</div></div>';
            var canvas = content.querySelector('#clockCanvas');
            var ctx = canvas.getContext('2d');
            var digitalEl = content.querySelector('#clockDigitalFull');
            var tzEl = content.querySelector('#clockTzFull');
            var size = 180;

            function drawClock() {
                var offset = parseInt(settings.timezone.replace('UTC', ''));
                var now = getTimeWithTimezone(offset);
                var h = now.getHours() % 12,
                    m = now.getMinutes(),
                    s = now.getSeconds();
                var radius = size / 2 - 14,
                    cx = size / 2,
                    cy = size / 2;
                ctx.clearRect(0, 0, size, size);
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(200,200,200,0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                for (var i = 0; i < 12; i++) { var angle = i * Math.PI / 6 - Math.PI / 2; var len = i % 3 === 0 ? 10 :
                        5;
                    ctx.beginPath();
                    ctx.moveTo(cx + (radius - 12) * Math.cos(angle), cy + (radius - 12) * Math.sin(angle));
                    ctx.lineTo(cx + (radius - 12 + len) * Math.cos(angle), cy + (radius - 12 + len) * Math.sin(
                        angle));
                    ctx.strokeStyle = 'rgba(80,80,80,0.6)';
                    ctx.lineWidth = i % 3 === 0 ? 2 : 1;
                    ctx.stroke(); if (i % 3 === 0) { var num = i === 0 ? 12 : i;
                        ctx.fillStyle = 'rgba(60,60,60,0.8)';
                        ctx.font = '14px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        var nr = radius - 22;
                        ctx.fillText(num, cx + nr * Math.cos(angle), cy + nr * Math.sin(angle)); } }
                var hourAngle = (h + m / 60) * Math.PI / 6 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.4 * Math.cos(hourAngle), cy + radius * 0.4 * Math.sin(hourAngle));
                ctx.strokeStyle = '#2c3e7a';
                ctx.lineWidth = 3.5;
                ctx.stroke();
                var minAngle = (m + s / 60) * Math.PI / 30 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.6 * Math.cos(minAngle), cy + radius * 0.6 * Math.sin(minAngle));
                ctx.strokeStyle = '#444';

            var canvas = content.querySelector('#paintCanvas');

            var sizeInput = content.querySelector('#paintSize');
            var drawing = false,
                lastX = 0,

            function resizeCanvas() {
                var rect = canvas.parentElement.getBoundingClientRect();
                var w = canvas.parentElement.clientWidth - 10;
                var h = canvas.parentElement.clientHeight - 50;
                if (w < 10) w = 200;
                if (h < 10) h = 200;
                if (canvas.width > 0 && canvas.height > 0) {
                    savedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }
                canvas.width = w;
                canvas.height = h;

                canvas.style.height = h + 'px';
                if (savedImageData) {

                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, w, h);
                }
                canvas._w = w;
                canvas._h = h;

            resizeCanvas();

            function getPos(e) { var rect = canvas.getBoundingClientRect(); var x = (e.clientX - rect.left); var y = (e

            var typeSelect = content.querySelector('#ucType');

            var units = {
                length: { units: ['毫米', '厘米', '分米', '米', '千米', '英寸', '英尺', '码', '英里'], factors: [1, 10, 100,

                    ] },

                temperature: { units: ['摄氏度', '华氏度', '开尔文'], convert: function(val, from, to) { var celsius; if (
                            from === '摄氏度') celsius = val; else if (from === '华氏度') celsius = (val - 32) *
                            5 / 9; else celsius = val - 273.15; if (to === '摄氏度') return celsius; else if (

            };

                convert();
