            function convert() {
                var type = typeSelect.value;

        async function initDesktop() {
            if (desktopInitialized) return;
            desktopInitialized = true;
            ensureAllAppsRegistered();
            await loadFS();
            var desktop = document.getElementById('desktop');
            applyTheme();
            var wp = settings.customWallpaper || settings.wallpaper;
            applyWallpaper(wp, desktop);
            document.documentElement.style.setProperty('--primary', settings.accentColor);
            renderDesktopIcons();
            setTimeout(function() { renderDesktopIcons(); }, 100);
            ensureDefaultWidgets();
            renderWidgets();
            rebuildStartMenu();
            initDesktopContext();

            var startBtn = document.getElementById('startBtn');
            if (startBtn) { startBtn.addEventListener('click', function(e) { e.stopPropagation(); var menu =
                        document.getElementById('startMenu');
                    menu.classList.toggle('active'); }); }
            document.getElementById('lockIcon').addEventListener('click', lockScreen);
            document.getElementById('notificationIcon').addEventListener('click', function() { var nc = document
                        .getElementById('notificationCenter');
                    nc.style.display = nc.style.display === 'block' ? 'none' : 'block'; });
            document.addEventListener('click', function(e) {
                var menu = document.getElementById('startMenu');
                var startBtn = document.getElementById('startBtn');
                if (menu && menu.classList.contains('active')) {
                    if (!menu.contains(e.target) && !startBtn.contains(e.target)) {
                        menu.classList.remove('active');
                    }
                }
                document.getElementById('taskbarContext').style.display = 'none';
            });

            document.getElementById('showDesktopBtn').addEventListener('click', function() {
                var visibleWindows = windows.filter(function(w) { return w.style.display !== 'none' && w
                        .parentNode; });
                if (visibleWindows.length === 0) {
                    windows.forEach(function(w) { if (w.style.display === 'none') { w.style.display = 'flex';
                            w.classList.add('active'); } });
                    updateTaskbarApps();
                    pushNotification('桌面', '已恢复所有窗口');
                } else {
                    visibleWindows.forEach(function(w) { minimizeWindow(w); });
                    pushNotification('桌面', '已最小化所有窗口');
                }
            });

            document.querySelectorAll('.dock-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var appId = this.dataset.app;
                    if (appId && appRegistry[appId]) {
                        openApp(appId);
                    } else {
                        console.warn('Dock item未绑定应用:', appId);
                    }
                });
            });

            var timerCount = 0;
            setInterval(function() {
                timerCount++;
                if (timerCount % 2 === 0) {
                    var offset = parseInt(settings.timezone.replace('UTC', ''));
                    var now = getTimeWithTimezone(offset);
                    document.getElementById('liveTime').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                }
                if (timerCount % 10 === 0) {
                    updateMemory();
                }
                if (timerCount % 30 === 0) {
                    updateBatteryUI();
                }
            }, 500);
            var volSlider = document.getElementById('volumeSlider');
            if (volSlider) { volSlider.value = Math.round((settings.volume || 0.8) * 100);
                volSlider.addEventListener('input', function() { settings.volume = parseInt(this.value) / 100;
                    applyVolume();
                    saveSettings(); }); }
            var brightSlider = document.getElementById('brightnessSlider');
            if (brightSlider) { brightSlider.value = Math.round((settings.brightness || 1.0) * 100);
                brightSlider.addEventListener('input', function() { settings.brightness = parseInt(this.value) / 100;
                    applyBrightness();
                    saveSettings(); }); }
            await updateBattery();
            updateMemory();
            updateNotifCenter();
            if (document.getElementById('lockScreen').classList.contains('active')) { updateLockNews(); }
        }

                '<div class="desktop-context-item" data-action="uninstall"><i class="fas fa-trash"></i> ' + t(

            menu.querySelector('[data-action="open"]').onclick = function() { openApp(appId, null, true);
                menu.style.display = 'none'; };
            menu.querySelector('[data-action="sort-name"]').onclick = function() { settings.desktopSortBy = 'name';
                saveSettings();
                renderDesktopIcons();
                menu.style.display = 'none'; };
            menu.querySelector('[data-action="sort-type"]').onclick = function() { settings.desktopSortBy = 'type';
                saveSettings();
                renderDesktopIcons();
                menu.style.display = 'none'; };
            menu.querySelector('[data-action="toggle-desktop"]').onclick = function() { var order = settings
                    .desktopOrder; if (isOnDesktop) { var idx = order.indexOf(appId); if (idx > -1) order.splice(
                        idx, 1); } else { if (!order.includes(appId)) order.push(appId); }
                settings.desktopOrder = [...new Set(order)];
                saveSettings();
                renderDesktopIcons();
                menu.style.display = 'none'; };
            var uninstallBtn = menu.querySelector('[data-action="uninstall"]');
            if (uninstallBtn) { uninstallBtn.onclick = function() { menu.style.display = 'none'; }; }
        }

        // ================================================================
        // 启动流程
        // ================================================================
        (function() {
            var bootScreen = document.getElementById('bootScreen');
            var desktop = document.getElementById('desktop');
            var progressFill = document.getElementById('progressFill');
            var progressWrapper = document.getElementById('progressWrapper');
            var logoContainer = document.getElementById('logoContainer');
            var particlesContainer = document.getElementById('particlesContainer');

            if (particlesContainer) {
                var colors = ['#4a6cf7', '#7b4fff', '#3b82f6', '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e', '#00b894',
                    '#00cec9', '#0984e3', '#e17055', '#fdcb6e'
                ];
                for (var i = 0; i < 80; i++) {
                    var p = document.createElement('div');
                    p.className = 'particle colored';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = (20 + Math.random() * 60) + '%';
                    p.style.animationDelay = Math.random() * 7 + 's';
                    p.style.animationDuration = (3 + Math.random() * 5) + 's';
                    var size = 2 + Math.random() * 8;
                    p.style.width = p.style.height = size + 'px';
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.boxShadow = '0 0 15px ' + p.style.background;
                    p.style.opacity = 0.2 + Math.random() * 0.6;
                    particlesContainer.appendChild(p);
                }
            }

            progressWrapper.classList.add('active');
            logoContainer.classList.add('visible');

            var progress = 0;
            var totalDuration = 5800;
            var startTime = Date.now();

            var intervalId = setInterval(function() {
                var elapsed = Date.now() - startTime;
                progress = Math.min(100, (elapsed / totalDuration) * 100);
                progressFill.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(intervalId);
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 200);
                }
            }, 50);

            var timeoutId = setTimeout(function() {
                clearInterval(intervalId);
                if (progress < 100) {
                    progressFill.style.width = '100%';
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 400);
                }
            }, 8000);

            function enterSystem() {
                clearTimeout(timeoutId);
                showWelcomeScreen();
                desktop.style.opacity = '0';
                desktop.classList.add('active');
                initDesktop().then(function() {});
                document.getElementById('skipAllBtn').addEventListener('click', function() {
                    goToStep(5);
                    var pwInput = document.getElementById('lockPasswordSetup');
                    if (pwInput && pwInput.value.trim() === '') {
                        alert(t('password_required'));
                        return;
                    }
                    settings.isSetupComplete = true;
                    settings.lockPassword = pwInput ? pwInput.value.trim() : settings.lockPassword;
                    settings.passwordEncoded = false;
                    saveSettings();
                    hideWelcomeScreen();
                    lockScreen();
                });
            }
        })();

        console.log('HCOS 1.1.0 加载成功（所有BUG已修复，任务栏优化，电池显示修复）');
    </script>
</body>
</html>
