        function makeWidgetDraggable(widget) {
            var isDragging = false,
                startX = 0,
                startY = 0,
                origLeft = 0,
                origTop = 0;

            function onStart(e) {
                if (e.target.closest('.widget-close') || e.target.closest('.widget-resize-handle')) return;
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                origLeft = parseInt(widget.style.left) || 0;
                origTop = parseInt(widget.style.top) || 0;
                isDragging = true;
                widget.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
            }

            function onMove(e) {
                if (!isDragging) return;
                var dx = e.clientX - startX,
                    dy = e.clientY - startY;
                widget.style.left = (origLeft + dx) + 'px';
                widget.style.top = (origTop + dy) + 'px';
                widget.style.right = 'auto';
            }

            function onEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                widget.style.cursor = 'default';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                var id = widget.dataset.widgetId;
                var w = settings.widgets.find(function(ww) { return ww.id === id; });
                if (w) {
                    w.left = parseInt(widget.style.left);
                    w.top = parseInt(widget.style.top);
                    saveSettings();
                }
            }
            widget.addEventListener('mousedown', onStart);
            widget.addEventListener('touchstart', function(e) {
                if (e.target.closest('.widget-close') || e.target.closest('.widget-resize-handle')) return;
                var touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                origLeft = parseInt(widget.style.left) || 0;
                origTop = parseInt(widget.style.top) || 0;
                isDragging = true;
                widget.style.cursor = 'grabbing';
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd, { passive: false });
            }, { passive: true });

            function onTouchMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                var touch = e.touches[0];
                var dx = touch.clientX - startX,
                    dy = touch.clientY - startY;
                widget.style.left = (origLeft + dx) + 'px';
                widget.style.top = (origTop + dy) + 'px';
                widget.style.right = 'auto';
            }

            function onTouchEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                widget.style.cursor = 'default';
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
                var id = widget.dataset.widgetId;
                var w = settings.widgets.find(function(ww) { return ww.id === id; });
                if (w) {
                    w.left = parseInt(widget.style.left);
                    w.top = parseInt(widget.style.top);
                    saveSettings();
                }
            }
        }

        function renderWidgets() {
            var container = document.getElementById('widgetContainer');
            container.innerHTML = '';
            settings.widgets.forEach(function(w) {
                var type = widgetTypes[w.type];
                if (!type) return;
                var widget = document.createElement('div');
                widget.className = 'widget';
                widget.dataset.widgetId = w.id;
                widget.style.left = w.left + 'px';
                widget.style.top = w.top + 'px';
                widget.style.width = w.width + 'px';
                widget.style.height = w.height + 'px';
                var header = document.createElement('div');
                header.className = 'widget-header';
                header.innerHTML = '<span>' + type.icon + ' ' + type.name +
                    '</span><span class="widget-close" title="删除">✕</span>';
                header.querySelector('.widget-close').addEventListener('click', function(e) {
                    e.stopPropagation();
                    settings.widgets = settings.widgets.filter(function(ww) { return ww.id !== w.id; });
                    saveSettings();
                    renderWidgets();
                });
                widget.appendChild(header);
                var content = document.createElement('div');
                content.className = 'widget-content';
                content.innerHTML = type.content(w);
                widget.appendChild(content);
                var resize = document.createElement('div');
                resize.className = 'widget-resize-handle';
                widget.appendChild(resize);
                container.appendChild(widget);
                makeWidgetDraggable(widget);
                initWidgetResize(widget, w);

        function initWidgetResize(widget, wData) {
            var handle = widget.querySelector('.widget-resize-handle');
            var startX, startY, startW, startH;
            handle.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                startX = e.clientX;
                startY = e.clientY;
                startW = parseInt(widget.style.width) || wData.width;
                startH = parseInt(widget.style.height) || wData.height;
                var mv = function(ev) {
                    var newW = Math.max(100, startW + ev.clientX - startX);
                    var newH = Math.max(70, startH + ev.clientY - startY);
                    widget.style.width = newW + 'px';
                    widget.style.height = newH + 'px';
                };
                var up = function() {
                    document.removeEventListener('mousemove', mv);
                    document.removeEventListener('mouseup', up);
                    var id = widget.dataset.widgetId;
                    var w = settings.widgets.find(function(ww) { return ww.id === id; });
                    if (w) {
                        w.width = parseInt(widget.style.width);
                        w.height = parseInt(widget.style.height);
                        saveSettings();
                    }
                };
                document.addEventListener('mousemove', mv);
                document.addEventListener('mouseup', up);
            });
        }

        function bindWidgetContent(wData) {
            var type = widgetTypes[wData.type];
            if (!type) return;
            if (wData.type === 'clock') {
                var canvas = document.getElementById('widgetClockCanvas_' + wData.id);
                var digitalEl = document.getElementById('widgetClockDigital_' + wData.id);
                var tzEl = document.getElementById('widgetClockTz_' + wData.id);
                if (canvas) {
                    var ctx = canvas.getContext('2d');
                    var size = 90;

                    function drawClock() {
                        var now = new Date();
                        var offset = parseInt(settings.timezone.replace('UTC', ''));
                        var localTime = getTimeWithTimezone(offset);
                        var h = localTime.getHours() % 12,
                            m = localTime.getMinutes(),
                            s = localTime.getSeconds();
                        var radius = size / 2 - 6;
                        var cx = size / 2,
                            cy = size / 2;
                        ctx.clearRect(0, 0, size, size);
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(200,200,200,0.4)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        for (var i = 0; i < 12; i++) {
                            var angle = i * Math.PI / 6 - Math.PI / 2;
                            var len = i % 3 === 0 ? 5 : 3;
                            ctx.beginPath();
                            ctx.moveTo(cx + (radius - 6) * Math.cos(angle), cy + (radius - 6) * Math.sin(angle));
                            ctx.lineTo(cx + (radius - 6 + len) * Math.cos(angle), cy + (radius - 6 + len) * Math
                                .sin(angle));
                            ctx.strokeStyle = 'rgba(80,80,80,0.7)';
                            ctx.lineWidth = i % 3 === 0 ? 2 : 1;
                            ctx.stroke();
                            if (i % 3 === 0) {
                                var num = i === 0 ? 12 : i;
                                ctx.fillStyle = 'rgba(60,60,60,0.8)';
                                ctx.font = '8px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(num, cx + (radius - 12) * Math.cos(angle), cy + (radius - 12) * Math
                                    .sin(angle));
                            }
                        }
                        var hourAngle = (h + m / 60) * Math.PI / 6 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.4 * Math.cos(hourAngle), cy + radius * 0.4 * Math.sin(
                        hourAngle));
                        ctx.strokeStyle = '#2c3e7a';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        var minAngle = (m + s / 60) * Math.PI / 30 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.6 * Math.cos(minAngle), cy + radius * 0.6 * Math.sin(
                        minAngle));
                        ctx.strokeStyle = '#444';
                        ctx.lineWidth = 1.8;
                        ctx.stroke();
                        var secAngle = s * Math.PI / 30 - Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + radius * 0.7 * Math.cos(secAngle), cy + radius * 0.7 * Math.sin(
                        secAngle));
                        ctx.strokeStyle = '#e74c3c';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
                        ctx.fillStyle = '#e74c3c';
                        ctx.fill();
                        if (digitalEl) digitalEl.textContent = localTime.toLocaleTimeString('zh-CN', { hour12: false });
                        if (tzEl) tzEl.textContent = settings.timezone;
                    }
                    drawClock();
                    if (wData._clockInterval) clearInterval(wData._clockInterval);
                    wData._clockInterval = setInterval(drawClock, 1000);
                }
            } else if (wData.type === 'weather') {
                var iconEl = document.getElementById('widgetWeatherIcon_' + wData.id);
                var tempEl = document.getElementById('widgetWeatherTemp_' + wData.id);
                var descEl = document.getElementById('widgetWeatherDesc_' + wData.id);
                var humEl = document.getElementById('widgetWeatherHum_' + wData.id);
                var aqiEl = document.getElementById('widgetWeatherAqi_' + wData.id);
                if (iconEl) {
                    async function updateWeather() {
                        try {
                            var resp = await fetch(
                                'https://api.open-meteo.com/v1/forecast?latitude=31.2&longitude=121.5&current_weather=true'
                                );
                            if (!resp.ok) throw new Error('API失败');
                            var data = await resp.json();
                            var cur = data.current_weather;
                            if (!cur) throw new Error('无数据');
                            var wcode = cur.weathercode;
                            var icon = '☀️',
                                desc = '晴朗';
                            if (wcode <= 3) { icon = '⛅';
                                desc = '多云'; } else if (wcode <= 48) { icon = '🌫️';
                                desc = '雾'; } else if (wcode <= 55) { icon = '🌦️';
                                desc = '毛毛雨'; } else if (wcode <= 65) { icon = '🌧️';
                                desc = '雨'; } else if (wcode <= 77) { icon = '❄️';
                                desc = '雪'; } else if (wcode <= 82) { icon = '🌦️';
                                desc = '阵雨'; } else if (wcode <= 86) { icon = '🌨️';
                                desc = '阵雪'; } else if (wcode <= 99) { icon = '⛈️';
                                desc = '雷暴'; }
                            iconEl.textContent = icon;
                            tempEl.textContent = Math.round(cur.temperature) + '°C';
                            descEl.textContent = desc;
                            var hum = Math.round(Math.random() * 40 + 45);
                            humEl.textContent = '💧 ' + hum + '%';
                            var aqi = ['优', '良', '轻度污染'][Math.floor(Math.random() * 3)];
                            aqiEl.textContent = '🌿 ' + aqi;
                        } catch (e) {
                            iconEl.textContent = '⚠️';
                            tempEl.textContent = '--°C';
                            descEl.textContent = '加载失败';
                        }
                    }
                    updateWeather();
                    if (wData._weatherInterval) clearInterval(wData._weatherInterval);
                    wData._weatherInterval = setInterval(updateWeather, 600000);
                }
            }
        }

        // ---- 工具函数 ----
        function getSystemUptime() {
            var uptime = Math.floor(performance.now() / 1000);
            var h = Math.floor(uptime / 3600);
            var m = Math.floor((uptime % 3600) / 60);
            var s = uptime % 60;
            return h + 'h ' + m + 'm ' + s + 's';
        }

        var batteryLevel = 1,
            batteryCharging = false;

        async function updateBattery() {
            try {
                if (navigator.getBattery) {
                    var battery = await navigator.getBattery();
                    batteryLevel = battery.level;
                    batteryCharging = battery.charging;
                    battery.addEventListener('levelchange', function() { batteryLevel = battery.level;
                        updateBatteryUI(); });
                    battery.addEventListener('chargingchange', function() { batteryCharging = battery.charging;
                        updateBatteryUI(); });
                }
            } catch (e) {}
            updateBatteryUI();
        }

        function updateBatteryUI() {
            var el = document.getElementById('batteryIcon');
            if (!el) return;
            var pct = Math.round(batteryLevel * 100);
            var icon = batteryCharging ? '🔌' : '🔋';
            el.textContent = icon + ' ' + pct + '%';
            el.title = t('battery') + ': ' + pct + '%' + (batteryCharging ? ' (充电)' : '');
        }

        function updateMemory() {
            var el = document.getElementById('memoryDisplay');
            if (!el) return;
            var used = 0,
                total = 2048;
            if (performance.memory) {
                used = performance.memory.usedJSHeapSize / (1024 * 1024);
            } else {
                used = Math.round(Math.random() * 500 + 200);
            }
            used = Math.min(used, total);
            var usedStr = used >= 1024 ? (used / 1024).toFixed(1) + 'G' : Math.round(used) + 'M';
            var totalStr = total >= 1024 ? (total / 1024).toFixed(0) + 'G' : total + 'M';
            el.textContent = '内存: ' + usedStr + '/' + totalStr;
            el.title = t('memory') + ': ' + usedStr + ' / ' + totalStr;
        }

            var fromSelect = content.querySelector('#ucFrom');
            var toSelect = content.querySelector('#ucTo');
            var resultInput = content.querySelector('#ucResult');
            var formulaDiv = content.querySelector('#ucFormula');
            var units = {
                length: { units: ['毫米', '厘米', '分米', '米', '千米', '英寸', '英尺', '码', '英里'], factors: [1, 10, 100, 1000,
                        1000000, 25.4, 304.8, 914.4, 1609344
                    ] },
                weight: { units: ['毫克', '克', '千克', '吨', '盎司', '磅'], factors: [1, 1000, 1000000, 1000000000,
                        28349.5, 453592
                    ] },
                temperature: {
                    units: ['摄氏度', '华氏度', '开尔文'],
                    convert: function(val, from, to) {
                        var celsius;
                        if (from === '摄氏度') celsius = val;
                        else if (from === '华氏度') celsius = (val - 32) * 5 / 9;
                        else celsius = val - 273.15;
                        if (to === '摄氏度') return celsius;
                        else if (to === '华氏度') return celsius * 9 / 5 + 32;
                        else return celsius + 273.15;
                    }
                }
            };

            function populateSelects(type) {
                var u = units[type];
                var opts = u.units.map(function(u) { return '<option value="' + u + '">' + u + '</option>'; }).join('');
                fromSelect.innerHTML = opts;
                toSelect.innerHTML = opts;
                if (type === 'temperature') { fromSelect.value = '摄氏度';
                    toSelect.value = '华氏度'; } else { fromSelect.value = u.units[0];
                    toSelect.value = u.units[1] || u.units[0]; }
                convert();
            }

            function convert() {
                var type = typeSelect.value;
                var val = parseFloat(valueInput.value) || 0;
                var from = fromSelect.value,
                    to = toSelect.value;
                var result, formula = '';
                if (type === 'temperature') {
                    result = units.temperature.convert(val, from, to);
                    formula = val + ' ' + from + ' = ' + result.toFixed(2) + ' ' + to;
                } else {
                    var u = units[type];
                    var fromIdx = u.units.indexOf(from),
                        toIdx = u.units.indexOf(to);
                    if (fromIdx === -1 || toIdx === -1) return;
                    result = val * u.factors[fromIdx] / u.factors[toIdx];
                    formula = val + ' ' + from + ' = ' + result.toFixed(4) + ' ' + to;
                }
                resultInput.value = result.toFixed(4);
                formulaDiv.textContent = formula;
            }
            typeSelect.addEventListener('change', function() { populateSelects(this.value); });
            valueInput.addEventListener('input', convert);
            fromSelect.addEventListener('change', convert);
            toSelect.addEventListener('change', convert);
            populateSelects('length');
        }

        function bindClock(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:10px;">' +
                '<canvas id="clockCanvas" width="180" height="180" style="width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.05);"></canvas>' +
                '<div style="font-size:28px;font-weight:300;margin-top:6px;" id="clockDigitalFull">00:00:00</div>' +
                '<div style="font-size:14px;color:var(--text-secondary);margin-top:2px;" id="clockTzFull">' + settings
                .timezone + '</div>' +
                '</div>';
            var canvas = content.querySelector('#clockCanvas');
            var ctx = canvas.getContext('2d');
            var digitalEl = content.querySelector('#clockDigitalFull');
            var tzEl = content.querySelector('#clockTzFull');
            var size = 180;

            function drawClock() {
                var offset = parseInt(settings.timezone.replace('UTC', ''));
                var now = getTimeWithTimezone(offset);
                var h = now.getHours() % 12,
                    m = now.getMinutes(),
                    s = now.getSeconds();
                var radius = size / 2 - 14;
                var cx = size / 2,
                    cy = size / 2;
                ctx.clearRect(0, 0, size, size);
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(200,200,200,0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                for (var i = 0; i < 12; i++) {
                    var angle = i * Math.PI / 6 - Math.PI / 2;
                    var len = i % 3 === 0 ? 10 : 5;
                    ctx.beginPath();
                    ctx.moveTo(cx + (radius - 12) * Math.cos(angle), cy + (radius - 12) * Math.sin(angle));
                    ctx.lineTo(cx + (radius - 12 + len) * Math.cos(angle), cy + (radius - 12 + len) * Math.sin(
                        angle));
                    ctx.strokeStyle = 'rgba(80,80,80,0.6)';
                    ctx.lineWidth = i % 3 === 0 ? 2 : 1;
                    ctx.stroke();
                    if (i % 3 === 0) {
                        var num = i === 0 ? 12 : i;
                        ctx.fillStyle = 'rgba(60,60,60,0.8)';
                        ctx.font = '14px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        var nr = radius - 22;
                        ctx.fillText(num, cx + nr * Math.cos(angle), cy + nr * Math.sin(angle));
                    }
                }
                var hourAngle = (h + m / 60) * Math.PI / 6 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.4 * Math.cos(hourAngle), cy + radius * 0.4 * Math.sin(hourAngle));
                ctx.strokeStyle = '#2c3e7a';
                ctx.lineWidth = 3.5;
                ctx.stroke();
                var minAngle = (m + s / 60) * Math.PI / 30 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.6 * Math.cos(minAngle), cy + radius * 0.6 * Math.sin(minAngle));
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                var secAngle = s * Math.PI / 30 - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * 0.7 * Math.cos(secAngle), cy + radius * 0.7 * Math.sin(secAngle));
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
                if (digitalEl) digitalEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                if (tzEl) tzEl.textContent = settings.timezone;
            }
            drawClock();
            if (win._clockInterval) clearInterval(win._clockInterval);
            win._clockInterval = setInterval(drawClock, 1000);
            content.addEventListener('resize', function() {
                drawClock();
            });
        }

                '<button id="musicLoopBtn" style="background:rgba(255,255,255,0.2);border:none;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:13px;">🔁</button>' +
                '<button id="musicShuffleBtn" style="background:rgba(255,255,255,0.2);border:none;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:13px;">🔀</button>' +
                '<span id="musicNowPlaying" style="font-size:12px;flex:1;">未播放</span>' +
                '<label style="font-size:12px;">音量 <input type="range" min="0" max="100" id="musicVol" value="80" style="width:60px;"></label>' +
                '<button id="importMusicBtn" style="background:var(--primary);color:white;border:none;padding:4px 14px;border-radius:20px;cursor:pointer;font-size:12px;">📂 导入歌曲</button>' +
                '</div>' +
                '<div id="musicPlaylist" style="flex:1;overflow-y:auto;font-size:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:4px;"></div>' +
                '<audio id="musicAudio" style="width:100%;height:30px;"></audio></div>';
            var audio = content.querySelector('#musicAudio');
            var playBtn = content.querySelector('#musicPlayBtn');
            var prevBtn = content.querySelector('#musicPrevBtn');
            var nextBtn = content.querySelector('#musicNextBtn');
            var loopBtn = content.querySelector('#musicLoopBtn');
            var shuffleBtn = content.querySelector('#musicShuffleBtn');
            var nowPlaying = content.querySelector('#musicNowPlaying');
            var playlistDiv = content.querySelector('#musicPlaylist');
            var volSlider = content.querySelector('#musicVol');
            var importBtn = content.querySelector('#importMusicBtn');
            var playlist = safeGetJSON('hcos-music-playlist', []);
            var currentIndex = -1,
                loop = false,
                shuffle = false;

            function renderPlaylist() {
                playlistDiv.innerHTML = playlist.map(function(item, idx) {
                    return '<div style="display:flex;justify-content:space-between;padding:3px 4px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;' +
                        (idx === currentIndex ? 'background:rgba(126,180,242,0.3);' : '') + '" data-idx="' + idx +
                        '">' +
                        '<span>' + item.name + '</span>' +
                        '<span style="color:var(--text-secondary);font-size:10px;">' + (idx === currentIndex ?
                            '▶' : '') + '</span>' +
                        '</div>';
                }).join('');
                playlistDiv.querySelectorAll('[data-idx]').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var idx = parseInt(this.dataset.idx);
                        if (idx >= 0 && idx < playlist.length) { currentIndex = idx;
                            playCurrent();
                            renderPlaylist(); }
                    });
                });
                if (playlist.length === 0) playlistDiv.innerHTML =
                    '<div style="opacity:0.5;padding:8px;">暂无歌曲，点击导入歌曲添加</div>';
            }

            function playCurrent() {
                if (currentIndex < 0 || currentIndex >= playlist.length) return;
                var item = playlist[currentIndex];
                if (item.dataUrl) {
                    audio.src = item.dataUrl;
                    audio.play().catch(function() {});
                    nowPlaying.textContent = '正在播放: ' + item.name;
                    playBtn.textContent = '⏸';
                    renderPlaylist();
                    audio.volume = settings.volume;
                } else {
                    (function() {
                        var parts = item.path ? item.path.split('/') : ['音乐', item.name];
                        var name = parts.pop();
                        getFileContent(parts, name).then(function(content) {
                            if (content) {
                                item.dataUrl = content;
                                safeSetJSON('hcos-music-playlist', playlist);
                                audio.src = content;
                                audio.play().catch(function() {});
                                nowPlaying.textContent = '正在播放: ' + item.name;
                                playBtn.textContent = '⏸';
                                renderPlaylist();
                                audio.volume = settings.volume;
                            }
                        });
                    })();
                }
            }

            function nextTrack() {
                if (playlist.length === 0) return;
                if (shuffle) {
                    var idx = Math.floor(Math.random() * playlist.length);
                    while (idx === currentIndex && playlist.length > 1) idx = Math.floor(Math.random() * playlist
                        .length);
                    currentIndex = idx;
                } else {
                    currentIndex = (currentIndex + 1) % playlist.length;
                }
                playCurrent();
            }
            audio.addEventListener('ended', function() {
                if (loop) { audio.currentTime = 0;
                    audio.play(); } else { nextTrack(); }
            });
            audio.addEventListener('play', function() { playBtn.textContent = '⏸'; });
            audio.addEventListener('pause', function() { playBtn.textContent = '▶'; });
            playBtn.addEventListener('click', function() {
                if (currentIndex < 0 && playlist.length > 0) { currentIndex = 0;
                    playCurrent(); return; }
                if (audio.paused) { audio.play(); } else { audio.pause(); }
            });
            prevBtn.addEventListener('click', function() {
                if (playlist.length === 0) return;
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                playCurrent();
            });
            nextBtn.addEventListener('click', nextTrack);
            loopBtn.addEventListener('click', function() {
                loop = !loop;
                this.style.background = loop ? 'rgba(126,180,242,0.5)' : 'rgba(255,255,255,0.2)';
                pushNotification('音乐播放器', loop ? '循环播放已开启' : '循环播放已关闭');
            });
            shuffleBtn.addEventListener('click', function() {
                shuffle = !shuffle;
                this.style.background = shuffle ? 'rgba(126,180,242,0.5)' : 'rgba(255,255,255,0.2)';
                pushNotification('音乐播放器', shuffle ? '随机播放已开启' : '随机播放已关闭');
            });
            volSlider.addEventListener('input', function() {
                audio.volume = parseInt(this.value) / 100;
                var taskbarSlider = document.getElementById('volumeSlider');
                if (taskbarSlider) {
                    taskbarSlider.value = this.value;
                    settings.volume = parseInt(this.value) / 100;
                    saveSettings();
                    updateAboutVolume();
                }
            });
            var taskbarVol = document.getElementById('volumeSlider');
            if (taskbarVol) {
                taskbarVol.addEventListener('input', function() {
                    var val = parseInt(this.value);
                    volSlider.value = val;
                    audio.volume = val / 100;
                    settings.volume = val / 100;
                    saveSettings();
                    updateAboutVolume();
                });
            }
            importBtn.addEventListener('click', function() {
                var input = document.createElement('input');
                input.type = 'file';
                input.accept = 'audio/*';
                input.multiple = true;
                input.onchange = function() {
                    var files = this.files;
                    for (var f = 0; f < files.length; f++) {
                        var file = files[f];
                        var reader = new FileReader();
                        reader.onload = function(ev) {
                            var dataUrl = ev.target.result;
                            var fileName = file.name;
                            playlist.push({ name: fileName, path: '音乐/' + fileName, dataUrl: dataUrl });
                            safeSetJSON('hcos-music-playlist', playlist);
                            if (currentIndex < 0) currentIndex = 0;
                            renderPlaylist();
                            pushNotification('音乐播放器', '已导入 ' + fileName);
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });
            renderPlaylist();
            if (playlist.length > 0 && currentIndex === -1) currentIndex = 0;
            if (currentIndex >= 0) playCurrent();
            audio.volume = settings.volume;
            volSlider.value = Math.round(settings.volume * 100);
        }

        function bindCalendar(win) {
            var content = win.querySelector('.window-content');
            var events = safeGetJSON('calendar_events', {});
            var now = new Date();
            var year = now.getFullYear(),
                month = now.getMonth();
            var holidays = {
                '1-1': '元旦',
                '2-14': '情人节',
                '3-8': '妇女节',
                '4-1': '愚人节',
                '5-1': '劳动节',
                '6-1': '儿童节',
                '10-1': '国庆节',
                '12-25': '圣诞节',
                '4-4': '清明节',
                '5-5': '端午节',
                '7-7': '七夕节',
                '8-15': '中秋节',
                '9-9': '重阳节'
            };
            var selectedDate = null;

            function renderCalendar() {
                var firstDay = new Date(year, month, 1).getDay();
                var daysInMonth = new Date(year, month + 1, 0).getDate();
                var today = new Date();
                var html = '<div class="calendar-modern">' +
                    '<div class="cal-header-modern">' +
                    '<button id="calPrevM">◀</button>' +
                    '<span class="cal-title">' + year + '年' + (month + 1) + '月</span>' +
                    '<button id="calNextM">▶</button>' +
                    '</div>' +
                    '<div class="cal-grid-modern">';
                ['日', '一', '二', '三', '四', '五', '六'].forEach(function(d) {
                    html += '<div style="text-align:center;font-weight:bold;font-size:11px;color:var(--text-secondary);padding:2px;">' +
                        d + '</div>';
                });
                for (var i = 0; i < firstDay; i++) html += '<div></div>';
                for (var d = 1; d <= daysInMonth; d++) {
                    var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2,
                    '0');
                    var isToday = (d === today.getDate() && month === today.getMonth() && year === today
                        .getFullYear());
                    var holiday = holidays[(month + 1) + '-' + d] || '';
                    var hasEvents = events[dateStr] && events[dateStr].length > 0;
                    var cls = 'cal-cell';
                    if (isToday) cls += ' today';
                    if (holiday) cls += ' holiday';
                    html += '<div class="' + cls + '" data-date="' + dateStr + '">' +
                        d +
                        (holiday ? '<span class="holiday-label">' + holiday + '</span>' : '') +
                        (hasEvents ? '<span class="event-dot"></span>' : '') +
                        '</div>';
                }
                html += '</div><div class="cal-events-modern" id="calEventsM"></div>' +
                    '<div class="cal-add-event"><input id="calEventInputM" placeholder="' + t('event_placeholder') +
                    '">' +
                    '<button id="calAddEventM">' + t('add_event') + '</button></div></div>';
                content.innerHTML = html;
                document.getElementById('calPrevM').addEventListener('click', function() {
                    month--;
                    if (month < 0) { month = 11;
                        year--; }
                    renderCalendar();
                });
                document.getElementById('calNextM').addEventListener('click', function() {
                    month++;
                    if (month > 11) { month = 0;
                        year++; }
                    renderCalendar();
                });
                content.querySelectorAll('.cal-cell').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var date = this.dataset.date;
                        selectedDate = date;
                        renderEvents(date);
                        content.querySelectorAll('.cal-cell').forEach(function(c) { c.style.outline =
                            'none'; });
                        this.style.outline = '2px solid var(--primary)';
                    });
                });
                var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' +
                    String(today.getDate()).padStart(2, '0');
                var todayEl = content.querySelector('.cal-cell[data-date="' + todayStr + '"]');
                if (todayEl) todayEl.click();
                else { var firstEl = content.querySelector('.cal-cell'); if (firstEl) firstEl.click(); }
                document.getElementById('calAddEventM').addEventListener('click', function() {
                    var input = document.getElementById('calEventInputM');
                    if (input.value.trim() && selectedDate) {
                        if (!events[selectedDate]) events[selectedDate] = [];
                        events[selectedDate].push(input.value.trim());
                        safeSetJSON('calendar_events', events);
                        input.value = '';
                        renderCalendar();
                        renderEvents(selectedDate);
                    }
                });
                document.getElementById('calEventInputM').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') document.getElementById('calAddEventM').click();
                });
            }

            function renderEvents(date) {
                var evDiv = document.getElementById('calEventsM');
                if (!evDiv) return;
                var evs = events[date] || [];
                if (evs.length === 0) {
                    evDiv.innerHTML = '<div style="opacity:0.5;padding:4px;">暂无日程</div>';
                    return;
                }
                evDiv.innerHTML = evs.map(function(e, i) {
                    return '<div class="event-item"><span>' + e + '</span><span class="del-event" data-idx="' +
                        i + '">✕</span></div>';
                }).join('');
                evDiv.querySelectorAll('.del-event').forEach(function(el) {
                    el.addEventListener('click', function() {
                        var idx = parseInt(this.dataset.idx);
                        if (events[date]) {
                            events[date].splice(idx, 1);
                            if (events[date].length === 0) delete events[date];
                            safeSetJSON('calendar_events', events);
                            renderCalendar();
                            renderEvents(date);
                        }
                    });
                });
            }
            renderCalendar();
        }

        function bindPaint(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;padding:5px;">' +
                '<div style="display:flex;gap:6px;padding:3px;flex-wrap:wrap;align-items:center;">' +
                '<button id="paintClear" style="background:#e74c3c;color:white;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px;">清除</button>' +
                '<label style="font-size:12px;">颜色 <input type="color" id="paintColor" value="#000000" style="width:24px;height:24px;border:none;padding:0;cursor:pointer;"></label>' +
                '<label style="font-size:12px;">大小 <input type="range" id="paintSize" min="1" max="20" value="3" style="width:60px;"></label>' +
                '</div>' +
                '<canvas id="paintCanvas" style="flex:1;border:1px solid rgba(255,255,255,0.2);border-radius:4px;cursor:crosshair;touch-action:none;"></canvas></div>';
            var canvas = content.querySelector('#paintCanvas');
            var ctx = canvas.getContext('2d');
            var clearBtn = content.querySelector('#paintClear');
            var colorInput = content.querySelector('#paintColor');
            var sizeInput = content.querySelector('#paintSize');
            var drawing = false,
                lastX = 0,
                lastY = 0;

            function resizeCanvas() {
                var rect = canvas.parentElement.getBoundingClientRect();
                var w = canvas.parentElement.clientWidth - 10;
                var h = canvas.parentElement.clientHeight - 50;
                if (w < 10) w = 200;
                if (h < 10) h = 200;
                canvas.width = w;
                canvas.height = h;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, w, h);
                canvas._w = w;
                canvas._h = h;
            }
            resizeCanvas();

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                var x = (e.clientX - rect.left);
                var y = (e.clientY - rect.top);
                return { x: Math.max(0, Math.min(x, canvas._w || canvas.width)), y: Math.max(0, Math.min(y, canvas
                        ._h || canvas.height)) };
            }

            function startDraw(e) {
                e.preventDefault();
                drawing = true;
                var pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            }

            function draw(e) {
                e.preventDefault();
                if (!drawing) return;
                var pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = colorInput.value;
                ctx.lineWidth = parseInt(sizeInput.value);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            }

            function endDraw(e) { drawing = false; }
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                var touch = e.touches[0];
                var rect = canvas.getBoundingClientRect();
                var mouseEvent = new MouseEvent('mousedown', { clientX: touch.clientX, clientY: touch.clientY });
                canvas.dispatchEvent(mouseEvent);
            }, { passive: false });
            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                var touch = e.touches[0];
                var mouseEvent = new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY });
                canvas.dispatchEvent(mouseEvent);
            }, { passive: false });
            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                var mouseEvent = new MouseEvent('mouseup', {});
                canvas.dispatchEvent(mouseEvent);
            }, { passive: false });
            clearBtn.addEventListener('click', function() {
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas._w || canvas.width, canvas._h || canvas.height);
            });
            var resizeObserver = new ResizeObserver(function() { resizeCanvas(); });
            resizeObserver.observe(canvas.parentElement);
            content.addEventListener('resize', function() { resizeCanvas(); });
        }

        function bindTerminal(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="background:#1e1e2e;color:#d4d4d4;height:100%;padding:5px;font-family:monospace;">' +
                '<div id="termOutput" style="height:calc(100% - 30px);overflow-y:auto;white-space:pre-wrap;"></div>' +
                '<div style="display:flex;"><span style="color:#4caf50;">$</span><input id="termInput" type="text" style="flex:1;background:transparent;border:none;color:#d4d4d4;outline:none;font-family:monospace;"></div></div>';
            var output = content.querySelector('#termOutput');
            var input = content.querySelector('#termInput');
            output.textContent = 'HCOS Terminal v1.0\n';
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var cmd = this.value;
                    this.value = '';
                    output.textContent += '$ ' + cmd + '\n';
                    var resp = '';
                    if (cmd === 'help') resp = '可用命令: help, echo, ls, date, whoami, clear, calc <expr>';
                    else if (cmd.startsWith('echo ')) resp = cmd.substring(5);
                    else if (cmd === 'ls') resp = '文档  图片  下载  桌面  音乐';
                    else if (cmd === 'date') resp = new Date().toString();
                    else if (cmd === 'whoami') resp = settings.nickname || 'user';
                    else if (cmd === 'clear') { output.textContent = ''; return; } else if (cmd.startsWith('calc ')) {
                        try { resp = eval(cmd.substring(5)) || '0'; } catch (e) { resp = '错误'; }
                    } else resp = '未知命令: ' + cmd;
                    output.textContent += resp + '\n';
                    output.scrollTop = output.scrollHeight;
                }
            });
        }

        function bindTaskMgr(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="padding:5px;"><h4>正在运行的任务</h4><div id="taskList"></div></div>';
            var list = content.querySelector('#taskList');

            function renderTasks() {
                list.innerHTML = windows.filter(function(w) { return w.parentNode; }).map(function(w) {
                    var title = w.querySelector('.window-title span') ? w.querySelector('.window-title span')
                        .textContent : w.dataset.app;
                    return '<div style="display:flex;justify-content:space-between;padding:2px 0;"><span>' +
                        title + '</span><button data-window-id="' + w._id +
                        '" style="background:#e74c3c;color:white;border:none;border-radius:3px;padding:1px 5px;cursor:pointer;">关闭</button></div>';
                }).join('');
                list.querySelectorAll('button').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var win = windows.find(function(w) { return w._id === this.dataset.windowId; });
                        if (win) closeWindow(win);
                    });
                });
            }
            renderTasks();
            if (win._taskmgrInterval) clearInterval(win._taskmgrInterval);
            win._taskmgrInterval = setInterval(renderTasks, 1000);
        }

        function bindMonitor(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;font-size:14px;">' +
                '<div>CPU: ' + (navigator.hardwareConcurrency || '未知') + ' 核心</div>' +
                '<div>内存: <span id="monitorMem">--</span> / 2GB</div>' +
                '<div>运行时间: <span id="monitorUptime">' + getSystemUptime() + '</span></div>' +
                '</div>';
            var memEl = content.querySelector('#monitorMem');
            var uptimeEl = content.querySelector('#monitorUptime');
            if (memEl) {
                var updateMem = function() {
                    var used = '--';
                    if (performance.memory) used = (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(
                        0) + 'MB';
                    else used = Math.round(Math.random() * 500 + 200) + 'MB';
                    memEl.textContent = used;
                };
                updateMem();
                if (win._memInterval) clearInterval(win._memInterval);
                win._memInterval = setInterval(updateMem, 3000);
            }
            if (uptimeEl) {
                if (win._uptimeInterval) clearInterval(win._uptimeInterval);
                win._uptimeInterval = setInterval(function() {
                    if (win.parentNode && document.body.contains(win)) {
                        uptimeEl.textContent = getSystemUptime();
                    } else {
                        clearInterval(win._uptimeInterval);
                        win._uptimeInterval = null;
                    }
                }, 1000);
            }
        }

        function bindCodeEditor(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;padding:8px;">' +
                '<div style="display:flex;gap:4px;margin-bottom:4px;">' +
                '<select id="codeLang" style="padding:2px 6px;border-radius:4px;border:1px solid #ccc;background:rgba(255,255,255,0.3);font-size:12px;color:var(--text);">' +
                '<option value="javascript">JavaScript</option><option value="html">HTML</option><option value="css">CSS</option></select>' +
                '<button id="codeRun" style="background:var(--primary);color:white;border:none;padding:2px 12px;border-radius:4px;cursor:pointer;font-size:12px;">▶ 运行</button>' +
                '</div>' +
                '<div style="display:flex;flex:1;gap:4px;min-height:0;">' +
                '<textarea id="codeEditorText" style="flex:1;background:var(--editor-bg);border:none;border-radius:4px;padding:4px;font-family:monospace;font-size:12px;resize:none;color:var(--text);" placeholder="// 输入代码...">// 欢迎使用 HCOS 代码编辑器\nconsole.log("Hello HCOS!");</textarea>' +
                '<div id="codePreview" style="flex:1;background:rgba(0,0,0,0.04);border-radius:4px;padding:4px;font-family:monospace;font-size:12px;overflow:auto;white-space:pre-wrap;color:var(--text);"></div>' +
                '</div></div>';
            var textarea = content.querySelector('#codeEditorText');
            var preview = content.querySelector('#codePreview');
            var runBtn = content.querySelector('#codeRun');
            var langSelect = content.querySelector('#codeLang');

            function highlight(code, lang) {
                if (lang === 'javascript' || lang === 'js') {
                    return code.replace(/\/\/.*/g, function(m) { return '<span style="color:#6a9955;">' + m +
                            '</span>'; })
                        .replace(/(".*?"|'.*?')/g, function(m) { return '<span style="color:#ce9178;">' + m +
                                '</span>'; })
                        .replace(
                            /\b(const|let|var|function|return|if|else|for|while|class|new|this|try|catch|throw|async|await|import|export|from|default|typeof|instanceof|switch|case|break|continue|do|finally|with|yield|delete|in|of|void|typeof|instanceof|new)\b/g,
                            function(m) { return '<span style="color:#c586c0;">' + m + '</span>'; })
                        .replace(
                            /\b(console|log|document|window|Math|JSON|Array|Object|String|Number|Boolean|Promise|fetch|setTimeout|setInterval|clearTimeout|clearInterval)\b/g,
                            function(m) { return '<span style="color:#4ec9b0;">' + m + '</span>'; });
                } else if (lang === 'html') {
                    return code.replace(/(&lt;\/?[\w\s-]+&gt;)/g, function(m) { return '<span style="color:#569cd6;">' +
                            m + '</span>'; })
                        .replace(/(&lt;[\w\s-]+)/g, function(m) { return '<span style="color:#569cd6;">' + m +
                            '</span>'; })
                        .replace(/(".*?")/g, function(m) { return '<span style="color:#ce9178;">' + m + '</span>'; })
                        .replace(
                            /\b(class|id|style|src|href|type|name|value|placeholder|onclick|onchange)\b/g,
                            function(m) { return '<span style="color:#9cdcfe;">' + m + '</span>'; });
                } else if (lang === 'css') {
                    return code.replace(/(\.[\w-]+)/g, function(m) { return '<span style="color:#d7ba7d;">' + m +
                            '</span>'; })
                        .replace(/(#[\w-]+)/g, function(m) { return '<span style="color:#d7ba7d;">' + m + '</span>'; })
                        .replace(
                            /\b(background|color|font-size|font-family|margin|padding|border|display|position|top|left|right|bottom|width|height|flex|grid|gap|transform|transition|animation|hover|active|focus|before|after)\b/g,
                            function(m) { return '<span style="color:#9cdcfe;">' + m + '</span>'; })
                        .replace(/(".*?")/g, function(m) { return '<span style="color:#ce9178;">' + m + '</span>'; });
                }
                return code;
            }

            function renderPreview() {
                var code = textarea.value;
                var lang = langSelect.value;
                preview.innerHTML = highlight(code, lang);
            }
            textarea.addEventListener('input', renderPreview);
            langSelect.addEventListener('change', renderPreview);
            runBtn.addEventListener('click', function() {
                var code = textarea.value;
                var lang = langSelect.value;
                try {
                    if (lang === 'javascript' || lang === 'js') {
                        var result = eval(code);
                        pushNotification('代码执行', '结果: ' + result, '代码编辑器', 'codeeditor');
                    } else if (lang === 'html') {
                        var win2 = openApp('browser', null, true);
                        if (win2) {
                            var iframe = win2.querySelector('#browserFrames iframe');
                            if (iframe) {
                                var doc = iframe.contentDocument || iframe.contentWindow.document;
                                doc.open();
                                doc.write(code);
                                doc.close();
                            }
                        }
                    } else {
                        pushNotification('代码执行', '当前语言不支持运行', '代码编辑器', 'codeeditor');
                    }
                } catch (e) {
                    pushNotification('代码执行', '错误: ' + e.message, '代码编辑器', 'codeeditor');
                }
            });
            renderPreview();
        }

        function bindAPITester(win) {
            var content = win.querySelector('.window-content');
            content.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;padding:8px;">' +
                '<div style="display:flex;gap:4px;margin-bottom:4px;">' +
                '<input id="apiUrl" placeholder="https://api.example.com" style="flex:1;padding:4px 8px;border-radius:4px;border:1px solid #ccc;font-size:13px;color:var(--text);background:rgba(255,255,255,0.3);">' +
                '<button id="apiSend" style="background:var(--primary);color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:13px;">' +
                t('api_send') + '</button>' +
                '</div>' +
                '<div id="apiResult" style="flex:1;overflow-y:auto;font-size:12px;background:rgba(0,0,0,0.03);border-radius:4px;padding:6px;white-space:pre-wrap;"></div>' +
                '</div>';
            var urlInput = content.querySelector('#apiUrl');
            var sendBtn = content.querySelector('#apiSend');
            var resultDiv = content.querySelector('#apiResult');
            sendBtn.addEventListener('click', async function() {
                var url = urlInput.value.trim();
                if (!url) { pushNotification('API测试', '请输入URL'); return; }
                resultDiv.textContent = '请求中...';
                try {
                    var resp = await fetch(url);
                    var text = await resp.text();
                    resultDiv.textContent = '状态: ' + resp.status + ' ' + resp.statusText + '\n\n' + text;
                } catch (e) {
                    resultDiv.textContent = '请求失败: ' + e.message;
                }
            });
        }

        // ---- 启动流程 ----
        (function() {
            var bootScreen = document.getElementById('bootScreen');
            var welcomeScreen = document.getElementById('welcomeScreen');
            var desktop = document.getElementById('desktop');
            var progressFill = document.getElementById('progressFill');
            var progressWrapper = document.getElementById('progressWrapper');
            var logoContainer = document.getElementById('logoContainer');
            var particlesContainer = document.getElementById('particlesContainer');

            if (particlesContainer) {
                var colors = ['#4a6cf7', '#7b4fff', '#3b82f6', '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e'];
                for (var i = 0; i < 60; i++) {
                    var p = document.createElement('div');
                    p.className = 'particle colored';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = (30 + Math.random() * 50) + '%';
                    p.style.animationDelay = Math.random() * 6 + 's';
                    p.style.animationDuration = (3 + Math.random() * 4) + 's';
                    p.style.width = p.style.height = (2 + Math.random() * 6) + 'px';
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.boxShadow = '0 0 10px ' + p.style.background;
                    particlesContainer.appendChild(p);
                }
            }

            progressWrapper.classList.add('active');
            logoContainer.classList.add('visible');

            var progress = 0;
            var totalDuration = 5800;
            var startTime = Date.now();

            function updateProgress() {
                var elapsed = Date.now() - startTime;
                progress = Math.min(100, (elapsed / totalDuration) * 100);
                progressFill.style.width = progress + '%';
                if (progress < 100) {
                    requestAnimationFrame(updateProgress);
                } else {
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 200);
                }
            }
            requestAnimationFrame(updateProgress);

            function enterSystem() {
                if (!settings.isSetupComplete) {
                    welcomeScreen.classList.add('active');
                    desktop.classList.remove('active');
                    updateWelcomeWallpaper();
                    showStep(0);
                } else {
                    desktop.style.opacity = '0';
                    desktop.classList.add('active');
                    initDesktop().then(function() {
                        setTimeout(function() { desktop.style.opacity = '1'; }, 50);
                        setTimeout(function() { lockScreen(); }, 400);
                    });
                }
            }

            setTimeout(function() {
                if (!bootScreen.classList.contains('fade-out')) {
                    progressFill.style.width = '100%';
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 400);
                }
            }, 8000);

            var skipBoot = function() {
                if (!bootScreen.classList.contains('fade-out')) {
                    progressFill.style.width = '100%';
                    setTimeout(function() {
                        bootScreen.classList.add('fade-out');
                        setTimeout(function() {
                            bootScreen.style.display = 'none';
                            enterSystem();
                        }, 500);
                    }, 400);
                }
            };
            document.addEventListener('click', skipBoot);
            document.addEventListener('keydown', skipBoot);
        })();

        console.log('HCOS 1.0.0 Computer 正式版已加载（所有功能完善，准备发布）');
    </script>
