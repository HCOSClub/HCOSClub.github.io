<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HCOS 1.0.0 Computer</title>
    <style>
        /* ===== 全局样式 ===== */
        :root {
            --primary: #7eb4f2;
            --primary-hover: #6ba3e8;
            --text: #1e2a3a;
            --text-secondary: #4a5c6d;
            --bg: linear-gradient(145deg, #c2d7f0, #b0c8e5);
            --taskbar-bg: rgba(255, 255, 255, 0.85);
            --menu-bg: rgba(255, 255, 255, 0.30);
            --window-bg: rgba(255, 255, 255, 0.88);
            --toast-bg: rgba(30, 30, 40, 0.9);
            --border: rgba(255, 255, 255, 0.9);
            --editor-bg: rgba(255, 255, 255, 0.6);
            --widget-bg: rgba(255, 255, 255, 0.12);
            --welcome-card-bg: rgba(255, 255, 255, 0.70);
            --welcome-text: #1e2a3a;
            --welcome-sub: #4a5c6d;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --radius: 14px;
            --font-size-base: 14px;
            --window-opacity: 0.75;
        }
        .dark-theme {
            --primary: #5a8fd4;
            --primary-hover: #4a7fc4;
            --text: #e8e8e8;
            --text-secondary: #aab;
            --bg: linear-gradient(145deg, #1a1a2e, #16213e);
            --taskbar-bg: rgba(30, 30, 50, 0.85);
            --menu-bg: rgba(30, 30, 50, 0.40);
            --window-bg: rgba(40, 40, 60, 0.88);
            --toast-bg: rgba(20, 20, 30, 0.9);
            --border: rgba(255, 255, 255, 0.15);
            --editor-bg: rgba(255, 255, 255, 0.05);
            --widget-bg: rgba(255, 255, 255, 0.08);
            --welcome-card-bg: rgba(40, 40, 60, 0.70);
            --welcome-text: #e8e8e8;
            --welcome-sub: #aab;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            font-size: var(--font-size-base);
            user-select: none;
        }

        /* ===== 动画 ===== */
        @keyframes windowOpen {
            0% {
                transform: scale(.85);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes windowClose {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(.85);
                opacity: 0;
            }
        }
        @keyframes minimizeToTaskbar {
            0% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            100% {
                transform: scale(.2) translateY(80px);
                opacity: 0;
            }
        }
        @keyframes floatLight {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.2);
            }
        }
        @keyframes floatParticle {
            0% {
                opacity: 0;
                transform: translateY(0) scale(.5);
            }
            20% {
                opacity: .8;
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) scale(1.2);
            }
        }
        @keyframes dotPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(126, 180, 242, .7);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(126, 180, 242, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(126, 180, 242, 0);
            }
        }
        @keyframes checkPop {
            0% {
                transform: scale(.6);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .window.active {
            animation: windowOpen .3s cubic-bezier(.34, 1.56, .64, 1);
        }
        .window.closing {
            animation: windowClose .15s ease-in;
        }
        .window.minimizing {
            animation: minimizeToTaskbar .3s ease;
        }

        .lock-screen {
            transition: opacity .4s ease;
        }
        .lock-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lock-screen:not(.active) {
            opacity: 0;
            pointer-events: none;
        }

        .toast {
            transition: opacity .4s ease, transform .4s cubic-bezier(.34, 1.56, .64, 1);
            transform: translateX(60px);
        }
        .toast.show {
            transform: translateX(0);
        }

        #taskViewOverlay {
            transition: opacity .3s ease;
        }
        #taskViewOverlay:not(.active) {
            opacity: 0;
            pointer-events: none;
        }
        #taskViewOverlay.active {
            opacity: 1;
        }
        .task-view-item {
            transition: all .4s cubic-bezier(.34, 1.56, .64, 1);
        }

        /* ===== 启动画面 ===== */
        .boot-screen {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #0b0d1a 0%, #030308 100%);
            transition: opacity .8s ease;
        }
        .boot-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .boot-bg-lights {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .boot-bg-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .2;
            animation: floatLight 8s infinite alternate ease-in-out;
        }
        .boot-bg-light:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #4a6cf7;
            top: -200px;
            left: -150px;
            animation-duration: 10s;
        }
        .boot-bg-light:nth-child(2) {
            width: 450px;
            height: 450px;
            background: #7b4fff;
            bottom: -180px;
            right: -120px;
            animation-duration: 12s;
            animation-delay: -3s;
        }
        .boot-bg-light:nth-child(3) {
            width: 350px;
            height: 350px;
            background: #3b82f6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 15s;
            animation-delay: -6s;
            opacity: .15;
        }
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 4s infinite ease-in;
        }
        .particle.colored {
            width: 6px;
            height: 6px;
        }
        .logo-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(.9);
            transition: opacity .6s ease, transform .6s ease;
        }
        .logo-container.visible {
            opacity: 1;
            transform: scale(1);
        }
        .logo-glass {
            padding: 28px 56px;
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 36px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .1);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .logo-hc {
            font-size: 70px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 25px rgba(255, 255, 255, .7);
        }
        .logo-os {
            font-size: 70px;
            font-weight: 600;
            color: #7CB9FF;
            text-shadow: 0 0 30px rgba(126, 180, 242, .8);
        }
        .powered-by {
            margin-top: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, .6);
            background: rgba(255, 255, 255, .03);
            backdrop-filter: blur(12px);
            padding: 8px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, .05);
        }
        .progress-wrapper {
            margin-top: 50px;
            width: 220px;
            height: 5px;
            background: rgba(255, 255, 255, .08);
            border-radius: 5px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .12);
            opacity: 0;
            transition: opacity .5s;
        }
        .progress-wrapper.active {
            opacity: 1;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(124, 185, 255, .9), rgba(165, 140, 255, .95));
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(124, 185, 255, .7);
            transition: width .3s ease;
        }
        .boot-version {
            position: absolute;
            bottom: 24px;
            right: 32px;
            color: rgba(255, 255, 255, .3);
            font-size: 11px;
            z-index: 15;
            letter-spacing: .5px;
            user-select: none;
            pointer-events: none;
        }

        /* ===== 锁屏 ===== */
        .lock-screen {
            position: fixed;
            inset: 0;
            z-index: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s ease;
        }
        .lock-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lock-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(25px) brightness(.5);
            z-index: 0;
        }
        .lock-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(40px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 30px 50px rgba(0, 0, 0, .4), inset 0 0 20px rgba(255, 255, 255, .05);
            padding: 50px 60px;
            text-align: center;
            color: #fff;
            width: 400px;
            max-width: 90vw;
        }
        .lock-greeting {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .lock-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a08bc9);
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .3);
        }
        .lock-time {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 255, 255, .5);
            margin-bottom: 10px;
        }
        .lock-date {
            font-size: 16px;
            opacity: .8;
            margin-bottom: 5px;
        }
        .lock-notif-count {
            font-size: 14px;
            opacity: .7;
            margin-bottom: 20px;
        }
        .lock-input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }
        .lock-input-group input {
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 14px;
            padding: 12px 22px;
            font-size: 18px;
            color: #fff;
            outline: none;
            text-align: center;
            width: 200px;
            transition: .2s;
        }
        .lock-input-group input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, .2);
        }
        .lock-input-group button {
            background: var(--primary);
            border: none;
            color: #fff;
            border-radius: 14px;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 16px rgba(0, 0, 0, .3);
        }
        .lock-input-group button:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }
        .lock-error {
            color: #ff7c7c;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ===== 欢迎向导 ===== */
        .welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 250;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .5s ease;
            background-size: cover;
            background-position: center;
        }
        .welcome-screen.active {
            display: flex;
        }
        .welcome-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .skip-all {
            position: absolute;
            top: 24px;
            right: 30px;
            color: var(--welcome-text);
            font-size: 14px;
            cursor: pointer;
            background: var(--welcome-card-bg);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .7);
            z-index: 30;
            transition: all .25s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .05);
        }
        .skip-all:hover {
            background: rgba(255, 255, 255, .75);
            color: var(--welcome-text);
        }
        .welcome-card {
            background: var(--welcome-card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, .6);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(44, 62, 80, .08), 0 8px 16px rgba(44, 62, 80, .06), inset 0 1px 0 rgba(255, 255, 255, .9);
            padding: 44px 52px;
            width: 580px;
            max-width: 92vw;
            text-align: center;
            transition: opacity .35s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1);
            margin-top: 60px;
            position: relative;
            z-index: 5;
            color: var(--welcome-text);
            max-height: 85vh;
            overflow-y: auto;
        }
        .step-content {
            transition: opacity .3s ease;
        }
        .step-title {
            font-size: 30px;
            font-weight: 700;
            color: var(--welcome-text);
            margin-bottom: 10px;
        }
        .step-subtitle {
            font-size: 16px;
            color: var(--welcome-sub);
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
        }
        .btn:active {
            transform: scale(.96);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 8px 20px rgba(126, 180, 242, .35);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-glass {
            background: rgba(255, 255, 255, .55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .8);
            color: var(--welcome-text);
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, .75);
        }
        .step-dots {
            display: flex;
            gap: 14px;
            margin-top: 28px;
            justify-content: center;
            align-items: center;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(44, 62, 80, .25);
            transition: all .3s;
        }
        .dot.active {
            background: var(--primary);
            transform: scale(1.4);
            box-shadow: 0 0 0 0 rgba(126, 180, 242, .7);
            animation: dotPulse 1.8s infinite;
        }
        .dot-line {
            width: 20px;
            height: 1px;
            background: rgba(44, 62, 80, .15);
        }
        .language-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0 15px;
            flex-wrap: wrap;
        }
        .lang-card {
            background: rgba(255, 255, 255, .5);
            backdrop-filter: blur(12px);
            border: 2px solid transparent;
            border-radius: 18px;
            padding: 18px 24px;
            cursor: pointer;
            font-weight: 600;
            color: var(--welcome-text);
            transition: .2s;
        }
        .lang-card:hover {
            background: rgba(255, 255, 255, .75);
            transform: translateY(-2px);
        }
        .lang-card.selected {
            border-color: var(--primary);
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 0 0 4px rgba(126, 180, 242, .2);
        }
        .wallpaper-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 20px 0;
        }
        .wallpaper-thumb {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: .25s;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .wallpaper-thumb:hover {
            transform: translateY(-3px);
        }
        .wallpaper-thumb.selected {
            border-color: #fff;
            transform: scale(1.08);
        }
        .color-options {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 20px 0;
        }
        .color-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }
        .color-dot:hover {
            transform: scale(1.1);
        }
        .color-dot.selected {
            border-color: #fff;
            transform: scale(1.15);
        }
        .color-dot.selected::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
        }
        .avatar-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .6);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            cursor: pointer;
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
        }
        .nickname-input {
            background: rgba(255, 255, 255, .55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .7);
            border-radius: 16px;
            padding: 12px 18px;
            font-size: 16px;
            width: 240px;
            text-align: center;
            outline: none;
            color: var(--welcome-text);
            margin: 15px 0;
        }
        .check-icon {
            width: 72px;
            height: 72px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #fff;
            font-size: 38px;
            box-shadow: 0 12px 28px rgba(126, 180, 242, .45);
            animation: checkPop .5s cubic-bezier(.34, 1.56, .64, 1);
        }
        .privacy-scroll {
            height: 140px;
            overflow-y: auto;
            background: rgba(255, 255, 255, .35);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: left;
            color: var(--welcome-text);
            border: 1px solid rgba(255, 255, 255, .3);
            line-height: 1.7;
        }
        .privacy-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .privacy-scroll::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        /* ===== 桌面 ===== */
        .desktop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity .3s ease;
        }
        .desktop.active {
            display: flex;
            opacity: 1;
        }
        .desktop .desktop-icons {
            top: 46px;
            height: calc(100% - 46px);
        }
        .desktop .start-menu {
            top: 48px;
            bottom: auto;
        }
        .taskbar {
            border-bottom: none;
            border-top: none;
        }

        .desktop-icons {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            padding: 0 12px 6px 12px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .desktop-icon {
            position: absolute;
            width: 54px;
            height: 64px;
            background: rgba(255, 255, 255, .20);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, .4);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .06);
            cursor: grab;
            transition: transform .2s, box-shadow .2s, background .2s;
            user-select: none;
            padding: 3px 2px;
            z-index: 10;
            will-change: transform, left, top;
        }
        .desktop-icon:active {
            cursor: grabbing;
        }
        .desktop-icon .icon-img {
            font-size: 22px;
            line-height: 1;
        }
        .desktop-icon span {
            font-size: 9px;
            color: var(--text);
            margin-top: 2px;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
            max-width: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .desktop-icon:hover {
            transform: translateY(-2px) scale(1.05);
            background: rgba(255, 255, 255, .35);
            box-shadow: 0 8px 18px rgba(0, 0, 0, .12);
        }
        .desktop-icon.dragging {
            opacity: .6;
            transform: scale(.9);
            z-index: 100;
        }
        .desktop-icon.drag-over {
            border-color: var(--primary);
            background: rgba(126, 180, 242, .25);
            transform: scale(1.06);
        }

        #widgetContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
        }
        .widget {
            position: absolute;
            background: var(--widget-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 12px;
            pointer-events: auto;
            box-shadow: var(--shadow);
            transition: box-shadow .2s;
            min-width: 120px;
            min-height: 70px;
            overflow: hidden;
        }
        .widget:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
        }
        .widget .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            cursor: move;
        }
        .widget .widget-header .widget-close {
            cursor: pointer;
            opacity: .5;
            font-size: 13px;
        }
        .widget .widget-header .widget-close:hover {
            opacity: 1;
        }
        .widget .widget-resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 12px;
            height: 12px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, rgba(0, 0, 0, .08) 50%);
            border-radius: 0 0 var(--radius) 0;
        }
        .widget-content {
            font-size: 13px;
            color: var(--text);
        }

        .taskbar {
            height: 46px;
            background: var(--taskbar-bg);
            backdrop-filter: blur(28px);
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: var(--text);
            font-size: 13px;
            box-shadow: 0 0 15px rgba(0, 0, 0, .05);
            z-index: 200;
            flex-shrink: 0;
            position: relative;
        }
        .start-btn {
            background: rgba(91, 155, 213, .25);
            border-radius: 10px;
            padding: 3px 12px;
            margin-right: 10px;
            font-weight: 700;
            color: #5b9bd5;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(91, 155, 213, .6);
            box-shadow: inset 0 0 8px rgba(91, 155, 213, .2);
            transition: background .2s, box-shadow .2s;
            flex-shrink: 0;
        }
        .start-btn:hover {
            background: rgba(91, 155, 213, .4);
            box-shadow: inset 0 0 15px rgba(91, 155, 213, .5), 0 0 12px rgba(91, 155, 213, .6);
        }
        .taskbar-apps {
            display: flex;
            gap: 3px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 2px 0;
            justify-content: center;
        }
        .taskbar-apps::-webkit-scrollbar {
            display: none;
        }
        .taskbar-app {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: rgba(255, 255, 255, .4);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, .5);
            cursor: pointer;
            font-size: 11px;
            color: var(--text);
            transition: .2s ease;
            max-width: 130px;
            flex-shrink: 1;
            min-width: 0;
            height: 28px;
            position: relative;
        }
        .taskbar-app .icon-img {
            font-size: 13px;
            flex-shrink: 0;
        }
        .taskbar-app span:last-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .taskbar-app:hover {
            transform: scale(1.04);
            background: rgba(255, 255, 255, .7);
        }
        .taskbar-app.active {
            background: rgba(126, 180, 242, .4);
            border-color: var(--primary);
        }
        .taskbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            flex-shrink: 0;
            font-size: 13px;
        }
        .tray-icon {
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 5px;
            transition: background .2s;
            font-size: 14px;
        }
        .tray-icon:hover {
            background: rgba(255, 255, 255, .3);
        }
        .taskbar-slider {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .taskbar-slider input[type="range"] {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            background: var(--text-secondary);
            border-radius: 2px;
            outline: none;
        }
        .taskbar-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }
        .taskbar-slider span {
            font-size: 11px;
        }

        .start-menu {
            position: absolute;
            left: 10px;
            width: 380px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--menu-bg);
            backdrop-filter: blur(40px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .15);
            padding: 10px;
            z-index: 300;
            opacity: 0;
            transform: scale(.95);
            pointer-events: none;
            transition: opacity .25s cubic-bezier(.34, 1.56, .64, 1), transform .25s cubic-bezier(.34, 1.56, .64, 1);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .start-menu {
            top: 48px;
            transform-origin: top left;
            transform: translateY(-10px) scale(.95);
        }
        .start-menu.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .start-menu-category {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            padding: 4px 10px 2px;
            border-bottom: 1px solid rgba(0, 0, 0, .05);
            margin-top: 3px;
        }
        .start-menu-item {
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: .2s;
            font-size: 13px;
            color: var(--text);
        }
        .start-menu-item .icon-img {
            font-size: 18px;
        }
        .start-menu-item:hover {
            background: rgba(126, 180, 242, .2);
        }

        /* ===== 窗口 ===== */
        .window {
            position: absolute;
            min-width: 240px;
            min-height: 160px;
            background: var(--window-bg);
            backdrop-filter: blur(24px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            z-index: 200;
            overflow: hidden;
            transform: scale(0.92);
            opacity: 0.6;
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .25s ease, z-index 0s;
            pointer-events: auto;
        }
        .window.active {
            transform: scale(1);
            opacity: 1;
            z-index: 300;
            animation: windowOpen .3s cubic-bezier(.34, 1.56, .64, 1);
        }
        .window.focused {
            z-index: 400;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(126, 180, 242, 0.3);
        }
        .window.closing {
            animation: windowClose .15s ease-in;
            pointer-events: none;
        }
        .window.minimizing {
            animation: minimizeToTaskbar .3s ease;
            pointer-events: none;
        }
        .window-title {
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, .25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            cursor: move;
            user-select: none;
            font-weight: 600;
            color: var(--text);
            flex-shrink: 0;
            font-size: 13px;
        }
        .window-controls {
            display: flex;
            gap: 3px;
        }
        .window-controls button {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }
        .window-controls button:hover {
            background: rgba(0, 0, 0, .08);
        }
        .window-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
            padding: 4px;
        }
        .window-content>* {
            flex: 1;
            height: 100%;
        }

        /* ===== 文件管理器 ===== */
        .file-manager {
            display: flex;
            height: 100%;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.02);
        }
        .file-sidebar {
            width: 140px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }
        .file-sidebar-item {
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            margin-bottom: 2px;
        }
        .file-sidebar-item:hover {
            background: rgba(126, 180, 242, 0.25);
        }
        .file-sidebar-item.active {
            background: rgba(126, 180, 242, 0.35);
            font-weight: 600;
        }
        .file-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 4px;
        }
        .file-toolbar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 4px 6px;
        }
        .file-toolbar button {
            padding: 3px 8px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 10px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .file-toolbar button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
        }
        .file-toolbar input {
            padding: 3px 6px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            font-size: 10px;
            color: var(--text);
        }
        .file-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            padding: 4px;
        }
        .file-item {
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            transition: 0.15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .file-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .file-item.selected {
            background: rgba(126, 180, 242, 0.25);
        }
        .file-item .file-icon {
            font-size: 16px;
            flex-shrink: 0;
        }
        .file-item .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .file-item .file-info {
            font-size: 9px;
            color: var(--text-secondary);
            flex-shrink: 0;
            opacity: 0.7;
        }
        .file-item .download-icon {
            cursor: pointer;
            font-size: 12px;
            opacity: .6;
            flex-shrink: 0;
        }
        .file-item .download-icon:hover {
            opacity: 1;
        }
        .file-preview {
            height: 100px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px;
            overflow: auto;
            background: rgba(255, 255, 255, 0.06);
            display: none;
            flex-shrink: 0;
            border-radius: 0 0 6px 6px;
            margin-top: 4px;
        }
        .file-preview.active {
            display: block;
        }
        .file-preview img {
            max-width: 100%;
            max-height: 80px;
            object-fit: contain;
        }
        .file-preview pre {
            white-space: pre-wrap;
            font-size: 10px;
            margin: 0;
            max-height: 80px;
            overflow: auto;
        }

        /* ===== 浏览器 ===== */
        .browser-toolbar {
            display: flex;
            gap: 4px;
            padding: 4px 6px;
            background: rgba(255, 255, 255, .2);
            border-radius: 8px;
            margin-bottom: 4px;
            flex-wrap: nowrap;
            align-items: center;
            overflow-x: auto;
        }
        .browser-toolbar .url-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 3px;
            background: rgba(255, 255, 255, .5);
            border-radius: 6px;
            padding: 0 6px;
            height: 26px;
        }
        .browser-toolbar .url-wrap input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 11px;
            min-width: 40px;
            color: var(--text);
        }
        .browser-toolbar button {
            flex-shrink: 0;
            background: rgba(255, 255, 255, .4);
            border: none;
            border-radius: 5px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 12px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }
        .browser-toolbar button:hover {
            background: rgba(255, 255, 255, .7);
        }
        .browser-toolbar .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .browser-toolbar .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* ===== 时钟 ===== */
        .clock-face {
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
        }
        .clock-face canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        .clock-digital {
            text-align: center;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 4px;
            color: var(--text);
        }
        .clock-timezone {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ===== 日历 ===== */
        .calendar-modern {
            padding: 12px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .calendar-modern .cal-header-modern {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .calendar-modern .cal-header-modern button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background .2s;
        }
        .calendar-modern .cal-header-modern button:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .calendar-modern .cal-header-modern .cal-title {
            font-size: 18px;
            font-weight: 600;
        }
        .calendar-modern .cal-grid-modern {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            flex: 1;
        }
        .calendar-modern .cal-grid-modern .cal-cell {
            text-align: center;
            padding: 6px 2px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background .2s;
            position: relative;
        }
        .calendar-modern .cal-grid-modern .cal-cell:hover {
            background: rgba(126, 180, 242, 0.2);
        }
        .calendar-modern .cal-grid-modern .cal-cell.today {
            background: var(--primary);
            color: #fff;
        }
        .calendar-modern .cal-grid-modern .cal-cell.holiday {
            color: #e74c3c;
        }
        .calendar-modern .cal-grid-modern .cal-cell .holiday-label {
            font-size: 8px;
            display: block;
            color: #e74c3c;
        }
        .calendar-modern .cal-grid-modern .cal-cell .event-dot {
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }
        .calendar-modern .cal-events-modern {
            margin-top: 8px;
            max-height: 80px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
        }
        .calendar-modern .cal-events-modern .event-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .calendar-modern .cal-events-modern .event-item .del-event {
            cursor: pointer;
            opacity: 0.4;
        }
        .calendar-modern .cal-events-modern .event-item .del-event:hover {
            opacity: 1;
        }
        .calendar-modern .cal-add-event {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .calendar-modern .cal-add-event input {
            flex: 1;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: var(--text);
            outline: none;
        }
        .calendar-modern .cal-add-event button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* ===== 任务视图 ===== */
        #taskViewOverlay {
            position: fixed;
            inset: 0;
            z-index: 800;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s ease;
        }
        #taskViewOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #taskViewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 85vw;
            max-height: 75vh;
            overflow-y: auto;
            padding: 16px;
            justify-content: center;
        }
        .task-view-item {
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px;
            width: 150px;
            text-align: center;
            cursor: default;
            border: 2px solid transparent;
            transition: all .4s cubic-bezier(.34, 1.56, .64, 1);
            color: #fff;
            opacity: 0;
            transform: scale(.8) translateY(20px);
            position: relative;
        }
        .task-view-item.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .task-view-item:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .task-view-item .icon {
            font-size: 32px;
        }
        .task-view-item .title {
            font-size: 13px;
            margin-top: 4px;
        }
        .task-view-item .preview {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, .2);
            border-radius: 6px;
            margin-top: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
        }
        .task-view-item .close-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background: rgba(255, 0, 0, 0.6);
            border: none;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.2s;
        }
        .task-view-item:hover .close-btn {
            opacity: 1;
        }
        .task-view-item .close-btn:hover {
            background: rgba(255, 0, 0, 0.9);
            transform: scale(1.1);
        }
        #taskViewClose {
            position: absolute;
            top: 20px;
            right: 28px;
            background: rgba(255, 255, 255, .2);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }
        #taskViewClose:hover {
            background: rgba(255, 255, 255, .3);
            transform: rotate(90deg);
        }
        #taskViewTitle {
            color: #fff;
            font-size: 22px;
            margin-bottom: 12px;
        }

        /* ===== 通知中心 ===== */
        .mobile-nav {
            display: none !important;
        }
        @media(max-width:768px) {
            .taskbar {
                display: none;
            }
            .mobile-nav {
                display: flex !important;
            }
            .desktop {
                padding-bottom: 44px;
            }
            .window {
                min-width: 100vw;
                min-height: calc(100vh - 44px);
                width: 100vw !important;
                height: calc(100vh - 44px) !important;
                left: 0 !important;
                top: 0 !important;
            }
            .desktop-icon {
                width: 48px !important;
                height: 58px !important;
                font-size: 12px !important;
            }
            .start-menu {
                width: 90vw;
            }
            .widget {
                display: none;
            }
            .taskbar-slider input[type="range"] {
                width: 40px;
            }
        }
        .notification-center {
            position: fixed;
            top: 54px;
            right: 16px;
            width: 280px;
            max-height: 300px;
            background: var(--window-bg);
            backdrop-filter: blur(24px);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 10px;
            display: none;
            z-index: 400;
            overflow-y: auto;
        }
        .notif-clear {
            text-align: right;
            font-size: 10px;
            color: var(--primary);
            cursor: pointer;
            margin-bottom: 4px;
        }
        .notification-item {
            padding: 6px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, .3);
            border-radius: 8px;
            font-size: 11px;
            color: var(--text);
            display: flex;
            justify-content: space-between;

                }
            } catch (e) {}
            settings.theme = 'light';

            if (settings.version !== CURRENT_VERSION) {
                settings = JSON.parse(JSON.stringify(defaultSettings));
                settings.version = CURRENT_VERSION;
            }
            if (settings.isSetupComplete === undefined) settings.isSetupComplete = false;

            // ===== 关键修复：清除会话数据，确保每次启动都是全新的 =====

                settings.wallpaper = settings._savedWallpaper;

        var Clipboard = {
            text: '',
            set: function(v) { this.text = v; },
            get: function() { return this.text; },
            init: function() {
                var self = this;
                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                        var sel = window.getSelection().toString();
                        if (sel) self.text = sel;
                    } else if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
                        var active = document.activeElement;
                        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active
                            .isContentEditable)) {
                            e.preventDefault();
                            var start = active.selectionStart || 0,
                                end = active.selectionEnd || 0;
                            var before = active.value.substring(0, start),
                                after = active.value.substring(end);
                            active.value = before + self.text + after;
                            active.selectionStart = active.selectionEnd = start + self.text.length;
                        }
                    }
                });
            }
        };

        // ---- IndexedDB ----
        var DB_NAME = 'hcos-fs',
            STORE_NAME = 'files',
            CHUNK_STORE = 'chunks',
            CHUNK_SIZE = 1024 * 1024;
        var db = null;

        function openDB() {
            return new Promise(function(resolve) {
                try {
                    var r = indexedDB.open(DB_NAME, 2);
                    r.onupgradeneeded = function(e) {
                        var d = e.target.result;
                        if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        if (!d.objectStoreNames.contains(CHUNK_STORE)) d.createObjectStore(CHUNK_STORE, { keyPath: [
                                'fileId', 'chunkIndex'
                            ] });
                    };
                    r.onsuccess = function(e) { db = e.target.result;
                        resolve(db); };
                    r.onerror = function() { resolve(null); };
                } catch (e) { resolve(null); }
            });
        }
        var fileSystem = {
            version: CURRENT_VERSION,
            root: {
                '文档': { type: 'folder', children: { '欢迎.txt': { type: 'file', content: '欢迎使用 HCOS！' } } },
                '图片': { type: 'folder', children: {} },
                '下载': { type: 'folder', children: {} },
                '桌面': { type: 'folder', children: {} },
                '音乐': { type: 'folder', children: {} }
            }
        };

        async function loadFS() {
            try {
                var dbInstance = await openDB();
                if (!dbInstance) return;
                return new Promise(function(resolve) {
                    var tx = dbInstance.transaction(STORE_NAME, 'readonly');
                    var store = tx.objectStore(STORE_NAME);
                    var req = store.get('filesystem');
                    req.onsuccess = function() { if (req.result) fileSystem = req.result.data;
                        resolve(); };
                    req.onerror = function() { resolve(); };
                });
            } catch (e) {}
        }

        async function saveFS() {
            try {
                if (!db) { var d = await openDB(); if (!d) return;
                    db = d; }
                var tx = db.transaction(STORE_NAME, 'readwrite');
                var store = tx.objectStore(STORE_NAME);
                store.put({ id: 'filesystem', data: fileSystem });
            } catch (e) {}
        }

        async function getFileContent(pathArr, name) {
            try {
                var current = fileSystem.root;
                for (var i = 0; i < pathArr.length; i++) {
                    if (!current[pathArr[i]] || current[pathArr[i]].type !== 'folder') return null;
                    current = current[pathArr[i]].children;
                }
                var file = current[name];
                if (!file) return null;
                if (!file.chunked) return file.content || '';
                if (!db) await openDB();
                if (!db) return null;
                var tx = db.transaction(CHUNK_STORE, 'readonly');
                var store = tx.objectStore(CHUNK_STORE);
                var chunks = [];
                for (var j = 0; j < file.chunks; j++) {
                    var req = store.get([file.id, j]);
                    await new Promise(function(res) { req.onsuccess = function() { chunks[j] = req.result ? req.result
                            .data : '';
                        res(); };
                        req.onerror = res; });
                }
                return chunks.join('');
            } catch (e) { return null; }
        }

        async function setFileByPath(pathArr, name, content) {
            try {
                var current = fileSystem.root;
                for (var i = 0; i < pathArr.length; i++) {
                    if (!current[pathArr[i]]) current[pathArr[i]] = { type: 'folder', children: {} };
                    current = current[pathArr[i]].children;
                }
                var fileId = Date.now().toString(36) + Math.random().toString(36);
                var file = { type: 'file', content: '', id: fileId, chunked: false, chunks: 0, size: content.length,
                    modified: new Date().toISOString() };
                if (content.length <= CHUNK_SIZE) {
                    file.content = content;
                } else {
                    if (!db) await openDB();
                    if (!db) return;
                    var tx = db.transaction(CHUNK_STORE, 'readwrite');
                    var store = tx.objectStore(CHUNK_STORE);
                    var chunks = Math.ceil(content.length / CHUNK_SIZE);
                    file.chunked = true;
                    file.chunks = chunks;
                    for (var j = 0; j < chunks; j++) {
                        store.put({ fileId: fileId, chunkIndex: j, data: content.substring(j * CHUNK_SIZE, (j + 1) *
                                CHUNK_SIZE) });
                    }
                }
                current[name] = file;
                await saveFS();
            } catch (e) {}
        }

        async function deleteRecursive(current, pathArr, name) {
            try {
                var folder = pathArr.reduce(function(o, k) { return o[k].children; }, fileSystem.root);
                var item = folder[name];
                if (!item) return;
                if (item.type === 'folder') {
                    var children = item.children || {};
                    for (var childName in children) {
                        await deleteRecursive(folder, [...pathArr, name], childName);
                    }
                    delete folder[name];
                } else {
                    if (item.chunked && db) {
                        var tx = db.transaction(CHUNK_STORE, 'readwrite');
                        var store = tx.objectStore(CHUNK_STORE);
                        for (var i = 0; i < item.chunks; i++) {
                            store.delete([item.id, i]);
                        }
                    }
                    delete folder[name];
                }
                await saveFS();
            } catch (e) {}
        }

        // ===== 智能窗口定位：避免重叠 =====
        function findAvailablePosition(width, height) {
            var sw = window.innerWidth,
                sh = window.innerHeight;
            var existingWindows = windows.filter(function(w) { return w.parentNode; });
            var positions = existingWindows.map(function(w) {
                var rect = w.getBoundingClientRect();
                return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
            });
            var centerX = (sw - width) / 2;
            var centerY = (sh - height) / 2;
            var step = 28;
            var maxSteps = 120;
            for (var i = 0; i < maxSteps; i++) {
                var angle = i * 0.45;
                var radius = i * step / 8;
                var x = centerX + radius * Math.cos(angle);
                var y = centerY + radius * Math.sin(angle);
                x = Math.max(10, Math.min(x, sw - width - 10));
                y = Math.max(10, Math.min(y, sh - height - 40));
                var overlapping = false;
                for (var j = 0; j < positions.length; j++) {
                    var p = positions[j];
                    if (x < p.left + p.width + 10 && x + width + 10 > p.left &&
                        y < p.top + p.height + 10 && y + height + 10 > p.top) {
                        overlapping = true;
                        break;
                    }
                }
                if (!overlapping) {
                    return { left: x, top: y };
                }
            }
            return {
                left: Math.random() * (sw - width - 20) + 10,
                top: Math.random() * (sh - height - 50) + 10
            };
        }

        // ===== 创建窗口 =====
        function createWindow(appId, title, contentHTML, params) {
            var win = document.createElement('div');
            win.className = 'window active';
            win.dataset.app = appId;
            if (params) win.dataset.params = JSON.stringify(params);
            win._id = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            win.style.zIndex = ++zIndexCounter;
            var defaultWidth = 400,
                defaultHeight = 320;
            var pos = findAvailablePosition(defaultWidth, defaultHeight);
            win.style.left = pos.left + 'px';
            win.style.top = pos.top + 'px';
            win.style.width = defaultWidth + 'px';
            win.style.height = defaultHeight + 'px';
            win.innerHTML =
                '<div class="window-title"><span>' + title + '</span><div class="window-controls"><button data-action="minimize">—</button><button data-action="maximize">□</button><button data-action="close">✕</button></div></div><div class="window-content">' +
                contentHTML + '</div><div class="resize-handle" style="position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,0.06) 50%);border-radius:0 0 12px 0;"></div>';
            document.body.appendChild(win);
            win.querySelector('.window-title').addEventListener('mousedown', function(e) {
                e.stopPropagation();
                bringToFront(win, false);
                initDrag(e);
            });
            win.querySelector('[data-action="close"]').addEventListener('click', function(e) { e.stopPropagation();
                closeWindow(win); });
            win.querySelector('[data-action="minimize"]').addEventListener('click', function(e) { e.stopPropagation();
                minimizeWindow(win); });
            win.querySelector('[data-action="maximize"]').addEventListener('click', function(e) {
                e.stopPropagation();
                var mW = window.innerWidth,
                    mH = window.innerHeight - 32;
                if (win.dataset.prevSize) {
                    var p = JSON.parse(win.dataset.prevSize);
                    win.style.left = p.left;
                    win.style.top = p.top;
                    win.style.width = p.width;
                    win.style.height = p.height;
                    delete win.dataset.prevSize;
                } else {
                    win.dataset.prevSize = JSON.stringify({ left: win.style.left, top: win.style.top, width: win
                            .style.width, height: win.style.height });
                    win.style.width = mW + 'px';
                    win.style.height = mH + 'px';
                    win.style.left = '0';
                    win.style.top = '0px';
                }
            });
            win.addEventListener('mousedown', function(e) {
                if (e.target.closest('.window-title')) return;
                bringToFront(win, true);
            });
            win.querySelector('.resize-handle').addEventListener('mousedown', function(e) { e.stopPropagation();
                initResize(e, win); });
            win.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e
                    .preventDefault();
                    openApp(appId, params, true); } });
            var ro = new ResizeObserver(function() {
                var ev = new Event('resize');
                win.querySelector('.window-content').dispatchEvent(ev);
            });
            ro.observe(win.querySelector('.window-content'));
            win._resizeObserver = ro;
            return win;
        }

        function minimizeWindow(win) {
            win.classList.add('minimizing');
            setTimeout(function() {
                win.style.display = 'none';

                win.classList.remove('active');
                win.classList.remove('focused');
                updateTaskbarApps();

        function closeWindow(win) {
            if (win._keydownHandler) document.removeEventListener('keydown', win._keydownHandler);
            if (win._taskmgrInterval) clearInterval(win._taskmgrInterval);
            if (win._uptimeInterval) clearInterval(win._uptimeInterval);
            if (win._clockInterval) clearInterval(win._clockInterval);
            if (win._monitorInterval) clearInterval(win._monitorInterval);
            if (win._browserCheckInterval) clearInterval(win._browserCheckInterval);
            if (win._previewInterval) clearInterval(win._previewInterval);
            if (win._resizeObserver) win._resizeObserver.disconnect();
            windows = windows.filter(function(w) { return w !== win; });
            win.classList.add('closing');
            setTimeout(function() {
                if (win.parentNode) win.remove();
                updateTaskbarApps();
                saveSession();
                var overlay = document.getElementById('taskViewOverlay');
                if (overlay.classList.contains('active')) {
                    openTaskView();
                }
            }, 150);

        function bringToFront(win, hideOthers) {
            if (hideOthers === undefined) hideOthers = true;
            if (!win.parentNode) return;
            if (win.style.display === 'none') {
                win.style.display = 'flex';
                win.classList.add('active');
            }
            win.style.zIndex = ++zIndexCounter;
            win.classList.add('focused');
            if (hideOthers) {
                windows.forEach(function(w) {
                    if (w !== win) {
                        w.classList.remove('focused');
                    }
                });
            } else {
                windows.forEach(function(w) {
                    if (w !== win) {
                        w.classList.remove('focused');
                    }
                });
            }
            win.classList.add('active');
            updateTaskbarApps();
            saveSession();
        }

        function initDrag(e) {
            var win = e.target.closest('.window');
            if (!win) return;
            var rect = win.getBoundingClientRect(),
                offX = e.clientX - rect.left,
                offY = e.clientY - rect.top;
            var mv = function(e) {
                win.style.left = (e.clientX - offX) + 'px';
                win.style.top = (e.clientY - offY) + 'px';
                var snapThreshold = 20,
                    wW = window.innerWidth,
                    wH = window.innerHeight;
                if (e.clientX < snapThreshold) win.style.left = '0px';
                else if (e.clientX > wW - snapThreshold) win.style.left = (wW - rect.width) + 'px';
                if (e.clientY < snapThreshold) win.style.top = '0px';
                else if (e.clientY > wH - snapThreshold) win.style.top = (wH - rect.height) + 'px';
            };
            var up = function() { document.removeEventListener('mousemove', mv);
                document.removeEventListener('mouseup', up);
                saveSession(); };
            document.addEventListener('mousemove', mv);
            document.addEventListener('mouseup', up);
        }

        function initResize(e, win) {
            e.stopPropagation();
            var startX = e.clientX,

            var key = appId + '_' + stableStringify(params);
            if (_openAppPending[key]) return;
            _openAppPending[key] = true;
            setTimeout(function() { _openAppPending[key] = false; }, 400);
            if (!forceMulti && !app.multiInstance) {
                var existing = windows.find(function(w) {
                    if (w.dataset.app !== appId) return false;
                    var wParams = w.dataset.params || 'null';
                    var p = (params !== undefined && params !== null) ? stableStringify(params) : 'null';
                    return wParams === p;
                });
                if (existing) { bringToFront(existing, true); return; }
            }
            var instanceId = Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            var title = typeof app.title === 'function' ? (app.title(params) || appId) : (app.title || appId);
            var sameAppWindows = windows.filter(function(w) { return w.dataset.app === appId; });
            if (sameAppWindows.length > 0 && (forceMulti || app.multiInstance)) {
                title += ' (' + (sameAppWindows.length + 1) + ')';
            }
            var contentHTML = typeof app.content === 'function' ? app.content(params) : app.content;
            var win = createWindow(appId, title, contentHTML, params);
            win.dataset.instanceId = instanceId;
            windows.push(win);
            requestAnimationFrame(function() {
                win.classList.add('active');
                win.classList.add('focused');

            setTimeout(function() { if (typeof app.bind === 'function') app.bind(win, params); }, 50);

        // ===== 核心修复：桌面图标去重 =====
        function renderDesktopIcons() {
            var container = document.getElementById('desktopIcons');
            container.innerHTML = '';
            var order = (settings.desktopOrder && settings.desktopOrder.length) ? settings.desktopOrder :
            desktopIconList;
            // 去重
            order = [...new Set(order)];
            order = order.filter(function(id) { return desktopIconList.includes(id); });
            var positions = settings.desktopPositions || {};
            var containerWidth = container.clientWidth || window.innerWidth;
            var gridSize = 68,
                padding = 0,
                iconWidth = 54;
            var cols = Math.max(1, Math.floor((containerWidth - padding * 2) / gridSize));
            var gridSlots = [];
            for (var row = 0; row < 20; row++) {
                for (var col = 0; col < cols; col++) {
                    gridSlots.push({ x: padding + col * gridSize, y: padding + row * gridSize });
                }
            }
            var slotIndex = 0;
            order.forEach(function(appId) {
                if (!appRegistry[appId]) return;
                var pos = positions[appId];
                if (!pos || pos.x + iconWidth > containerWidth - padding || pos.x < 0 || pos.y < 0) {
                    if (slotIndex < gridSlots.length) {
                        pos = gridSlots[slotIndex++];
                    } else {
                        pos = { x: padding, y: padding + Math.floor(slotIndex / cols) * gridSize };
                        slotIndex++;
                    }
                    positions[appId] = pos;
                } else {
                    slotIndex++;
                }
                var def = appRegistry[appId];
                var div = document.createElement('div');
                div.className = 'desktop-icon';
                div.dataset.app = appId;
                div.draggable = true;
                var title = typeof def.title === 'function' ? (def.title() || appId) : (def.title || appId);
                div.innerHTML = '<span class="icon-img">' + def.icon + '</span><span>' + title + '</span>';
                div.style.left = pos.x + 'px';
                div.style.top = pos.y + 'px';
                var clickTimer = null;
                div.addEventListener('click', function(e) {
                    if (clickTimer) { clearTimeout(clickTimer);
                        clickTimer = null; }
                    clickTimer = setTimeout(function() {
                        var forceMulti = e.ctrlKey || e.metaKey;
                        openApp(appId, null, forceMulti);
                        clickTimer = null;
                    }, 150);
                });
                div.addEventListener('contextmenu', function(e) { e.preventDefault();
                    showDesktopCtx(e.clientX, e.clientY, appId); });
                div.addEventListener('dragstart', function(e) {
                    div.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', appId);
                });
                div.addEventListener('dragend', function(e) {
                    div.classList.remove('dragging');
                    document.querySelectorAll('.desktop-icon.drag-over').forEach(function(el) { el.classList
                            .remove('drag-over'); });
                    var rect = div.getBoundingClientRect();
                    var containerRect = container.getBoundingClientRect();
                    var x = rect.left - containerRect.left + window.scrollX;
                    var y = rect.top - containerRect.top + window.scrollY;
                    var snap = function(v) { return Math.round(v / gridSize) * gridSize; };
                    x = Math.max(0, snap(x));
                    y = Math.max(0, snap(y));
                    if (x + iconWidth > containerWidth - padding) x = containerWidth - iconWidth - padding;
                    if (isNaN(x) || x < 0) x = padding;
                    if (isNaN(y) || y < 0) y = padding;
                    div.style.left = x + 'px';
                    div.style.top = y + 'px';
                    settings.desktopPositions[appId] = { x: x, y: y };
                    saveSettings();
                });
                div.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    document.querySelectorAll('.desktop-icon.drag-over').forEach(function(el) { el.classList
                            .remove('drag-over'); });
                    div.classList.add('drag-over');
                });
                div.addEventListener('dragleave', function() { div.classList.remove('drag-over'); });
                div.addEventListener('drop', function(e) {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    var draggedApp = e.dataTransfer.getData('text/plain');
                    if (draggedApp && draggedApp !== appId && desktopIconList.includes(draggedApp)) {
                        var pos1 = settings.desktopPositions[draggedApp] || { x: padding, y: padding };
                        var pos2 = settings.desktopPositions[appId] || { x: padding, y: padding };
                        settings.desktopPositions[draggedApp] = pos2;
                        settings.desktopPositions[appId] = pos1;
                        var orderArr = settings.desktopOrder;
                        var idx1 = orderArr.indexOf(draggedApp);
                        var idx2 = orderArr.indexOf(appId);
                        if (idx1 > -1 && idx2 > -1) {
                            [orderArr[idx1], orderArr[idx2]] = [orderArr[idx2], orderArr[idx1]];
                        }
                        saveSettings();
                        renderDesktopIcons();
                    }
                });
                container.appendChild(div);
            });
            var newOrder = Array.from(container.querySelectorAll('.desktop-icon')).map(function(el) { return el.dataset
                    .app; });
            // 再次去重，防止意外
            settings.desktopOrder = [...new Set(newOrder)];
            saveSettings();
        }
